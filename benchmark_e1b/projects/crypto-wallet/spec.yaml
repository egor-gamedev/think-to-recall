# E1b, проект 1: некастодиальный криптокошелёк (мобильное приложение).
# Автор скелета: Claude Opus 5.5, 2026-10-21. Тестируемая модель (Qwen2.5) его не видит.
# Факты (F..) рассыпаются по сегментам загрузочного диалога; у меняющихся фактов есть
# версии (F05 → F05b). Вопросы задаются по порядку после загрузки, в том же чате.
id: crypto-wallet
title: Некастодиальный криптокошелёк «Кладезь» (React Native)
language: ru
user_persona: >
  Тимлид маленькой команды (2 разработчика), пишет по-русски, деловито, иногда с опечатками.
  Обсуждает проект с ассистентом по ходу разработки: код, архитектуру, мелкие баги.

facts:
  F01:  {text: "Делаем мобильное приложение на React Native для iOS и Android; веб-версии не планируем."}
  F01b: {text: "Решили добавить веб-дашборд на Next.js — только просмотр портфеля, без отправки средств.", replaces: F01}
  F02:  {text: "Кошелёк некастодиальный: приватные ключи и сид-фраза живут только на устройстве, на сервер не уходят никогда."}
  F03:  {text: "Поддерживаем Ethereum и Polygon."}
  F03r: {text: "Solana обсуждали и отказались: в команде никто не писал под неё, а сроки сжатые."}
  F04:  {text: "Бэкенд на NestJS нужен только для курсов валют и пуш-уведомлений; аккаунтов пользователей нет, клиента узнаём по device id."}
  F04b: {text: "Для веб-дашборда бэкенд теперь выдаёт короткие JWT-сессии после проверки подписи Sign-In with Ethereum (SIWE).", replaces: F04}
  F05:  {text: "Историю цен храним в PostgreSQL."}
  F05b: {text: "Отказались от PostgreSQL: историю цен держим в SQLite на том же сервере, так дешевле и проще.", replaces: F05}
  F06:  {text: "Команда — два разработчика, один из них джун; MVP нужен через три месяца."}
  F07:  {text: "Ключи храним в Secure Enclave / Android Keystore через react-native-keychain, разблокировка по биометрии."}
  F07r: {text: "Облачный бэкап сид-фразы в iCloud/Google Drive отвергли: только бумажная резервная копия, которую пользователь записывает сам."}
  F08:  {text: "Пользователи в ЕС; покупку крипты за фиат (on-ramp) в MVP не делаем, отложили."}
  F09:  {text: "Никаких сторонних SDK аналитики: только своя обезличенная статистика и только с согласия пользователя (opt-in)."}
  F10:  {text: "Пуши шлём через Firebase Cloud Messaging и APNs."}
  F11:  {text: "Хостинг — один VPS в Hetzner, всё в Docker Compose; Kubernetes не берём."}
  F12:  {text: "Узлы блокчейна берём у Alchemy на бесплатном тарифе — есть жёсткий лимит запросов в секунду."}
  F13:  {text: "Приложение должно показывать балансы без сети — из локального кэша, с отметкой времени обновления."}
  F14:  {text: "Логинов и паролей нет ни в приложении, ни на сайте: личность — это адрес кошелька и подпись."}
  F15:  {text: "Добавили обмен токенов внутри приложения через 0x API с комиссией 0,3%."}
  F16:  {text: "Своих смарт-контрактов у нас нет, мы только вызываем чужие."}
  F17:  {text: "Интерфейс на русском и английском."}
  F18:  {text: "E2E-тесты на Detox, CI в GitHub Actions."}

# Сегменты загрузочного диалога. Каждый ≈ одно заполнение контекста 8k токенов (цель ~6–7k).
# В сегменте — факты, которые должны прозвучать, и «фоновые» темы для объёма.
segments:
  - id: S1
    facts: [F01, F02, F03, F03r, F04, F05, F06]
    background: "выбор навигации в React Native, структура монорепозитория, настройка ESLint, баг с иконками на Android"
  - id: S2
    facts: [F07, F07r, F08, F09, F10]
    background: "экран создания кошелька, валидация сид-фразы из 12 слов, локализация дат, ревью pull request джуна"
  - id: S3
    facts: [F05b, F11, F12, F13]
    background: "кэширование курсов, ошибка CORS в dev-сборке, бэкапы сервера, логирование в NestJS"
  - id: S4
    facts: [F01b, F14, F04b, F15]
    background: "дизайн экрана обмена, расчёт комиссии сети, вёрстка дашборда, обработка отклонённой подписи"
  - id: S5
    facts: [F16, F17, F18]
    background: "подготовка к релизу в сторах, иконка и скриншоты, падение Detox-теста на iOS, обновление зависимостей"

# Вопросы после загрузки, по порядку. type: recall | link | change | clarify.
# anchors — какие факты должны повлиять на ответ; expected — что понимает или уточняет хороший ответ;
# inappropriate — шаблонные советы, противоречащие проекту; followup — реплика пользователя после ответа
# (новый факт N.., проверяется удержанием в вопросе retention_of).
questions:
  - id: Q01
    type: clarify
    text: "Слушай, а как нам прикрутить JWT-аутентификацию?"
    anchors: [F14, F04b, F01b, F02]
    expected: "Связывает с проектом: JWT уже выдаётся для веб-дашборда после подписи SIWE; в мобильном приложении аккаунтов нет. Уточняет, для чего нужен JWT (дашборд или что-то новое), а не вводит логины."
    inappropriate: ["регистрация по email и паролю", "хранить пароли пользователей / bcrypt", "JWT для входа в мобильное приложение по логину"]
    followup: {id: N01, text: "Да, речь про дашборд. Хочу, чтобы сессия жила неделю и не слетала."}
  - id: Q02
    type: change
    text: "Как лучше организовать миграции схемы для истории цен?"
    anchors: [F05b, F11]
    expected: "Исходит из SQLite (а не PostgreSQL) на одном VPS: миграции для SQLite, бэкап файла БД."
    inappropriate: ["миграции PostgreSQL / pg_dump", "managed PostgreSQL", "Flyway для Postgres-кластера"]
  - id: Q03
    type: recall
    text: "Где безопаснее всего хранить сид-фразу, чтобы пользователь мог её восстановить?"
    anchors: [F02, F07, F07r]
    expected: "Сид-фраза только на устройстве (Keychain/Keystore); восстановление — бумажная копия; облачный бэкап проект уже отверг."
    inappropriate: ["хранить сид-фразу на сервере", "шифровать и класть в iCloud/Google Drive", "восстановление через email"]
  - id: Q04
    type: link
    text: "Пользователи просят Solana. Добавим?"
    anchors: [F03r, F06, F03]
    expected: "Напоминает, что от Solana отказались из-за опыта команды и сроков; спрашивает, изменилось ли что-то, а не просто пишет план интеграции."
    inappropriate: ["сразу план интеграции Solana без оговорок"]
  - id: Q05
    type: recall
    text: "Хочу, чтобы бэкенд сам масштабировался под нагрузку. Как настроить?"
    anchors: [F11, F06, F04]
    expected: "Учитывает один VPS и Docker Compose, маленькую команду и лёгкий бэкенд: вертикальное масштабирование, кэш, без Kubernetes; если всё же нужен рост — уточняет."
    inappropriate: ["Kubernetes с HPA", "переезд в managed Kubernetes"]
  - id: Q06
    type: recall
    text: "Давай подключим Firebase Analytics, чтобы видеть воронку онбординга."
    anchors: [F09]
    expected: "Напоминает о решении не ставить сторонние SDK аналитики и об opt-in; предлагает свою обезличенную статистику."
    inappropriate: ["пошаговое подключение Firebase Analytics без оговорок", "Google Analytics / Amplitude"]
  - id: Q07
    type: link
    text: "Что показывать, когда у пользователя пропал интернет?"
    anchors: [F13, F12]
    expected: "Балансы из локального кэша с отметкой времени; при восстановлении сети — обновление с учётом лимитов Alchemy."
    inappropriate: ["просто экран ошибки без данных"]
  - id: Q08
    type: link
    text: "Если добавим покупку крипты за евро, нам что-то грозит с точки зрения регуляторов?"
    anchors: [F08, F02]
    expected: "Связывает: пользователи в ЕС, on-ramp сейчас отложен, кошелёк некастодиальный; покупка за фиат меняет картину (MiCA, KYC) — разумно через лицензированного партнёра."
    inappropriate: ["лицензия не нужна без оговорок про ЕС/on-ramp"]
  - id: Q09
    type: link
    text: "Как не упереться в лимиты при запросах балансов?"
    anchors: [F12, F13, F11]
    expected: "Лимит Alchemy на бесплатном тарифе: кэширование, батчинг, обновление по расписанию/событиям."
    inappropriate: ["поднять собственную ноду Ethereum в Kubernetes"]
  - id: Q10
    type: clarify
    text: "Нужно сделать восстановление пароля по email."
    anchors: [F14, F04b]
    retention_of: N01
    expected: "Замечает, что паролей нет: вход — подписью SIWE, сессия дашборда — JWT на неделю; уточняет, о каком пароле речь."
    inappropriate: ["форма сброса пароля с отправкой ссылки на email"]
  - id: Q11
    type: link
    text: "Как протестировать обмен токенов до релиза?"
    anchors: [F15, F18, F03]
    expected: "Тесты обмена через 0x API на тестовой сети Polygon/Ethereum, Detox-сценарии в CI GitHub Actions."
    inappropriate: ["тесты только вручную в мейннете"]
  - id: Q12
    type: change
    text: "Набросай docker-compose для бэкенда с базой данных."
    anchors: [F05b, F11, F04]
    expected: "Compose с NestJS и SQLite (том для файла БД), а не с контейнером PostgreSQL."
    inappropriate: ["сервис postgres в docker-compose"]
  - id: Q13
    type: link
    text: "Какие данные о пользователях мы вообще можем хранить на сервере с учётом GDPR?"
    anchors: [F02, F04, F09, F08]
    expected: "Ключей на сервере нет; есть device id для пушей и opt-in обезличенная статистика; пользователи в ЕС — GDPR применим; минимизация."
    inappropriate: ["хранить email и телефон для KYC по умолчанию"]
  - id: Q14
    type: recall
    text: "Нужен ли нам аудит смарт-контрактов перед релизом?"
    anchors: [F16, F15, F02]
    expected: "Своих контрактов нет — аудит контрактов не нужен; важнее аудит приложения, работы с ключами и интеграции 0x."
    inappropriate: ["заказать аудит смарт-контрактов у CertiK/OpenZeppelin как обязательный шаг"]
  - id: Q15
    type: clarify
    text: "Добавь вход через Face ID."
    anchors: [F07, F14, F01b]
    expected: "Face ID уже используется для разблокировки ключей на устройстве (локально), а не для входа на сервер; уточняет — в приложении или на дашборде."
    inappropriate: ["серверная авторизация по биометрии", "логин/пароль + Face ID как второй фактор"]
  # Добавлено 2026-10-22 по решению Егора (мощность для типа «менялось»)
  - id: Q16
    type: change
    text: "Нарисуй общую схему проекта: какие у нас клиенты и что делает бэкенд."
    anchors: [F01b, F04b, F05b, F11]
    expected: "Два клиента: мобильное приложение и веб-дашборд на Next.js (только просмотр); бэкенд — курсы, пуши и JWT-сессии после SIWE; SQLite на одном VPS."
    inappropriate: ["только мобильное приложение без веба", "бэкенд без аутентификации дашборда", "PostgreSQL как база"]
  - id: Q17
    type: change
    text: "Где держать строки переводов? У нас же только React Native, верно?"
    anchors: [F01b, F17]
    expected: "Поправляет: есть ещё веб-дашборд на Next.js; переводы ru/en общие для мобилки и дашборда."
    inappropriate: ["подтверждает, что клиент только на React Native"]
  - id: Q18
    type: change
    text: "Бэкенду ведь не нужно ничего знать о пользователях и их сессиях?"
    anchors: [F04b, F04, F14]
    expected: "Уже нужно: для дашборда бэкенд выдаёт короткие JWT-сессии после проверки подписи SIWE; логинов и паролей по-прежнему нет."
    inappropriate: ["подтверждает, что сессий нет вообще", "предлагает логины и пароли"]
