segment: S1
author: Claude Opus 5.5 (2026-10-21), по скелету spec.yaml
turns:
  - role: user
    facts: [B01]
    text: |
      Привет! Я аспирантка, делаю главу про bulk RNA-seq печени мышей: контроль и голодание 24 часа, по 12 мышей в группе, всего 24 образца. Сырые fastq пришли от секвенирования. С чего начать обработку, чтобы потом не переделывать?
  - role: assistant
    facts: []
    text: |
      Хороший момент, чтобы всё сделать правильно с начала. Общая схема для bulk RNA-seq:

      1. **Контроль качества сырых ридов** — FastQC и сводный MultiQC.
      2. **Тримминг адаптеров** (если нужно) — Trim Galore или fastp.
      3. **Выравнивание и/или подсчёт** — на геном или транскриптом.
      4. **Матрица счётов** по генам.
      5. **Дифференциальная экспрессия** и дальше обогащение.

      Проще всего не собирать это руками, а взять готовый пайплайн, например nf-core/rnaseq: он делает шаги 1–4, собирает отчёт MultiQC и документирует версии всех инструментов — это потом пригодится для раздела методов.

      Сразу заведите таблицу образцов (samplesheet) с колонками: имя образца, пути к fastq, группа, дата/запуск секвенирования, пол, RIN. Многие проблемы анализа решаются тем, что эта таблица есть с самого начала.
  - role: user
    facts: [B02, B06]
    text: |
      Да, берём nf-core/rnaseq: STAR для выравнивания и Salmon для подсчёта. Референс — GRCm38. Как правильно оформить samplesheet, у меня пайплайн ругается.
  - role: assistant
    facts: []
    text: |
      Для nf-core/rnaseq samplesheet — это CSV ровно с такими колонками:

      ```csv
      sample,fastq_1,fastq_2,strandedness
      C1,/data/raw/C1_R1.fastq.gz,/data/raw/C1_R2.fastq.gz,auto
      C2,/data/raw/C2_R1.fastq.gz,/data/raw/C2_R2.fastq.gz,auto
      F1,/data/raw/F1_R1.fastq.gz,/data/raw/F1_R2.fastq.gz,auto
      ```

      Частые причины ругани:
      - Лишние колонки (группу и RIN сюда не кладите — держите их в отдельной таблице метаданных).
      - Пробелы в именах или в путях, Windows-переводы строк (`\r\n`) — проверьте `cat -A samplesheet.csv`.
      - Относительные пути: на кластере используйте абсолютные.
      - Если образец разбит на несколько дорожек, пишите его несколькими строками с одинаковым `sample` — пайплайн склеит.

      `strandedness: auto` пайплайн определит сам через Salmon — удобно, если не уверены в протоколе библиотеки.
  - role: user
    facts: [B03]
    text: |
      Были виндовые переводы строк, точно. Считаем на университетском SLURM-кластере: квота 500 ГБ, на вычислительных узлах интернета нет, контейнеры только Singularity. Пайплайн при запуске пытается что-то скачать и падает.
  - role: assistant
    facts: []
    text: |
      Без интернета на узлах всё, что пайплайн обычно тянет сам, надо скачать заранее на логин-ноде:

      ```bash
      # на логин-ноде, где есть интернет
      module load nextflow singularity
      nf-core download rnaseq -r 3.14.0 --container-system singularity \
          --container-cache-utilisation amend --compress none -o /home/$USER/nf-core-rnaseq
      ```

      Затем запускайте локальную копию с офлайн-флагом:

      ```bash
      export NXF_OFFLINE=true
      export NXF_SINGULARITY_CACHEDIR=/home/$USER/singularity-cache
      nextflow run /home/$USER/nf-core-rnaseq/3_14_0 -profile singularity \
          --input samplesheet.csv --outdir results -c slurm.config
      ```

      Референс (fasta и gtf) тоже скачайте заранее и передайте путями (`--fasta`, `--gtf`), а не через `--genome` из iGenomes — тот будет пытаться качать из AWS.

      `slurm.config` с вашей очередью и лимитами:

      ```groovy
      process { executor = 'slurm'; queue = 'normal'; clusterOptions = '--account=mylab' }
      executor { queueSize = 20 }
      ```
  - role: user
    facts: [B17]
    text: |
      Скачала на логин-ноде, запустилось! Кстати, вспомнила для метаданных: все мыши самцы. Колонку пол в таблицу добавлять смысла нет?
  - role: assistant
    facts: []
    text: |
      В модель для анализа пол не войдёт — он у всех одинаковый. Но в таблице метаданных и в описании данных его всё равно стоит указать: при выкладке данных и в методах статьи пол животных — обязательная информация, и рецензенты спросят. Просто колонка-константа «male».

      Это, кстати, полезно и для проверки качества: если на PCA вдруг появится образец с высокой экспрессией *Xist*, это сигнал перепутанного образца — у самцов её практически нет.

      ```python
      meta["sex"] = "male"
      ```
  - role: user
    facts: [B08]
    text: |
      Про Xist классная идея, проверю. Таймлайн у меня такой: глава диссертации нужна через два месяца. Успею?
  - role: assistant
    facts: []
    text: |
      Если обработка пайплайном идёт без сюрпризов, два месяца — реально. Примерный план:

      - **Неделя 1**: прогон пайплайна, разбор MultiQC, решение по выбросам.
      - **Неделя 2–3**: DE-анализ, проверка модели, первые рисунки.
      - **Неделя 4**: обогащение (GO/пути), интерпретация.
      - **Неделя 5–6**: финальные рисунки, текст результатов и методов.
      - **Неделя 7–8**: правки руководителя, запас.

      Главные риски: очередь на кластере, перезапуски пайплайна из-за места и долгие согласования интерпретации с руководителем. Резервируйте время на последнее — оно обычно самое долгое.
  - role: user
    facts: []
    text: |
      Пайплайн отработал. В MultiQC куча вкладок, на что смотреть в первую очередь?
  - role: assistant
    facts: []
    text: |
      Для bulk RNA-seq по порядку:

      1. **General Statistics**: число ридов на образец (сильные выбросы по глубине?), процент дубликатов, GC.
      2. **STAR / Salmon mapping rate**: доля выровненных ридов. Для мыши норма — 80–90%; образец с заметно меньшей долей — подозрительный.
      3. **Qualimap / RSeQC — gene body coverage**: равномерное покрытие тела гена. Перекос к 3'-концу говорит о деградации РНК.
      4. **Strandedness**: что все образцы определились одинаково.
      5. **Sample correlation / PCA** от пайплайна — быстрый взгляд на кластеризацию по группам.

      Отмечайте подозрительные образцы и сверяйте с RIN из лаборатории: деградация на gene body coverage обычно совпадает с низким RIN.
  - role: user
    facts: []
    text: |
      Один образец явно странный, у него перекос к 3'-концу. Завтра сверю с RIN и решу. Спасибо!
