# E1b, проект 3: глава диссертации по биоинформатике (bulk RNA-seq).
# Автор скелета: Claude Opus 5.5, 2026-10-21. Тестируемая модель (Qwen2.5) его не видит.
id: rnaseq-thesis
title: Анализ RNA-seq печени мышей при голодании (глава диссертации)
language: ru
user_persona: >
  Аспирантка-биолог, хорошо знает биологию, программирует средне (Python лучше, R хуже).
  Пишет по-русски, вставляет английские термины, иногда торопится.

facts:
  B01:  {text: "Объект — bulk RNA-seq печени мышей: контроль и голодание 24 часа, по 12 мышей в группе, всего 24 образца."}
  B02:  {text: "Пайплайн — nf-core/rnaseq с выравниванием STAR и подсчётом через Salmon."}
  B02b: {text: "Перешли на режим только Salmon (псевдовыравнивание) без STAR: квота кластера не вмещает BAM-файлы.", replaces: B02}
  B03:  {text: "Считаем на университетском SLURM-кластере: квота 500 ГБ, на вычислительных узлах нет интернета, контейнеры через Singularity."}
  B04:  {text: "Дифференциальная экспрессия — DESeq2 в R."}
  B04r: {text: "limma-voom обсуждали — руководитель настаивает на DESeq2, оставили его."}
  B05:  {text: "Образцы секвенировали в двух запусках — это батч, его надо учитывать в модели."}
  B06:  {text: "Референс — геном мыши GRCm38."}
  B06b: {text: "Перешли на GRCm39 с аннотацией GENCODE M33, всё пересчитываем на нём.", replaces: B06}
  B07:  {text: "Образец F3 исключили после контроля качества: RIN 4,1."}
  B08:  {text: "Глава диссертации нужна через два месяца."}
  B09:  {text: "Статью пишем на английском; рисунки по требованиям журнала — TIFF 300 dpi."}
  B10:  {text: "Сырые данные до подачи статьи нужно выложить в GEO."}
  B11:  {text: "Графики делаю в Python (matplotlib/seaborn); R — только для DESeq2."}
  B12:  {text: "Порог значимости от руководителя: FDR < 0,05 и |log2FC| > 1."}
  B13:  {text: "Анализ обогащения — по GO через clusterProfiler."}
  B13r: {text: "KEGG использовать отказались из-за лицензии; для путей берём Reactome."}
  B14:  {text: "Окружение фиксируем conda-lock файлом и Singularity-образами."}
  B15:  {text: "Код — в приватном репозитории на GitHub; сырые данные в git не кладём."}
  B16:  {text: "Лаборатория проверит 10 генов методом qPCR."}
  B17:  {text: "Все мыши — самцы."}

segments:
  - id: S1
    facts: [B01, B02, B03, B06, B08, B17]
    background: "настройка nf-core на кластере, ошибки samplesheet, Singularity-кэш, чтение отчёта MultiQC"
  - id: S2
    facts: [B07, B04, B04r, B05, B11]
    background: "загрузка tximport, перевод идентификаторов Ensembl, нормировка, первая PCA"
  - id: S3
    facts: [B02b, B06b, B12, B14]
    background: "пересборка индекса Salmon, переполнение квоты, volcano в Python, сохранение сессии R"
  - id: S4
    facts: [B13, B13r, B09, B15]
    background: "GO-обогащение и шумные термины, оформление рисунков, структура репозитория, .gitignore для данных"
  - id: S5
    facts: [B10, B16]
    background: "загрузка в GEO и метаданные, выбор референсных генов для qPCR, текст методов, ответ руководителю"

questions:
  - id: Q01
    type: clarify
    text: "Построй мне PCA по всем образцам."
    anchors: [B07, B05, B11, B01]
    expected: "Использует 23 образца (F3 исключён), раскрашивает по группе и отмечает батч; делает в Python; уточняет, точно ли включать F3."
    inappropriate: ["PCA по всем 24 образцам без упоминания F3", "код только на R"]
    followup: {id: N01, text: "Да, без F3. И договоримся: контроль везде синим, голодание — красным."}
  - id: Q02
    type: change
    text: "Как собрать индекс для выравнивания?"
    anchors: [B02b, B06b, B03]
    expected: "Индекс Salmon (не STAR) на GRCm39/GENCODE M33, собирать с учётом отсутствия интернета на узлах."
    inappropriate: ["индекс STAR", "геном GRCm38"]
  - id: Q03
    type: recall
    text: "Какие пороги взять, чтобы назвать ген дифференциально экспрессированным?"
    anchors: [B12]
    expected: "FDR < 0,05 и |log2FC| > 1 — порог руководителя."
    inappropriate: ["p < 0,05 без поправки", "другие пороги без оговорок"]
  - id: Q04
    type: link
    text: "Почему в матрице счётов 23 образца, а не 24? Я что-то потеряла?"
    anchors: [B07, B01]
    expected: "F3 исключён после QC (RIN 4,1), поэтому 23."
    inappropriate: ["искать ошибку в загрузке файлов"]
  - id: Q05
    type: link
    text: "Какую формулу дизайна поставить в DESeq2?"
    anchors: [B05, B01, B04]
    expected: "~ batch + condition (батч из двух запусков плюс группа)."
    inappropriate: ["~ condition без батча"]
  - id: Q06
    type: recall
    text: "Давай сделаем анализ путей по KEGG."
    anchors: [B13r, B13]
    expected: "Напоминает, что KEGG отклонили из-за лицензии; предлагает Reactome (ReactomePA) и GO."
    inappropriate: ["enrichKEGG без оговорок"]
  - id: Q07
    type: link
    text: "Как скачать референсный геном прямо в задаче на кластере?"
    anchors: [B03, B06b]
    expected: "На узлах нет интернета: скачать на логин-ноде или заранее, GRCm39/GENCODE M33."
    inappropriate: ["wget внутри sbatch-задачи на вычислительном узле"]
  - id: Q08
    type: link
    text: "Нарисуй volcano plot для статьи."
    anchors: [B09, B12, B11]
    retention_of: N01
    expected: "Python, пороги FDR 0,05 и |log2FC| 1, TIFF 300 dpi, подписи на английском; цвета по договорённости (контроль синий, голодание красный)."
    inappropriate: ["ggplot2 на R", "PNG 72 dpi", "подписи на русском"]
  - id: Q09
    type: link
    text: "Куда положить сырые fastq, чтобы не потерялись?"
    anchors: [B10, B15, B03]
    expected: "Не в git; на кластере с учётом квоты, архив — в GEO перед подачей."
    inappropriate: ["закоммитить fastq в GitHub (Git LFS)"]
  - id: Q10
    type: clarify
    text: "Сделай сравнение экспрессии между самцами и самками."
    anchors: [B17]
    expected: "Все мыши — самцы; такого сравнения в данных нет; уточняет, что имелось в виду."
    inappropriate: ["код сравнения по полу без оговорок"]
  - id: Q11
    type: change
    text: "Какой файл аннотации подключить для GO-анализа и перевода ID?"
    anchors: [B06b, B13]
    expected: "Аннотация GENCODE M33 под GRCm39 (а не GRCm38), org.Mm.eg.db для GO."
    inappropriate: ["аннотация под GRCm38/mm10"]
  - id: Q12
    type: link
    text: "Какие гены отдать на qPCR-валидацию?"
    anchors: [B16, B12]
    expected: "10 генов из значимых по порогу руководителя, с разной величиной эффекта; плюс референсные гены."
    inappropriate: ["отдать 50 генов", "выбирать без учёта порога"]
  - id: Q13
    type: recall
    text: "Может, переделать DE-анализ на limma-voom, говорят, он быстрее?"
    anchors: [B04r, B04]
    expected: "Руководитель настаивает на DESeq2 — оставить; limma разве что как дополнительная проверка."
    inappropriate: ["переписать на limma-voom без оговорок"]
  - id: Q14
    type: link
    text: "Хватит ли места на кластере для BAM-файлов всех образцов?"
    anchors: [B03, B02b]
    expected: "BAM не создаём — перешли на Salmon без STAR именно из-за квоты 500 ГБ."
    inappropriate: ["расчёт места под BAM без упоминания перехода на Salmon"]
  - id: Q15
    type: recall
    text: "Как зафиксировать окружение, чтобы рецензент мог воспроизвести?"
    anchors: [B14, B15]
    expected: "conda-lock и Singularity-образы, код в репозитории с указанием версий."
    inappropriate: ["pip freeze > requirements.txt без контейнеров"]
  # Добавлено 2026-10-22 по решению Егора (мощность для типа «менялось»)
  - id: Q16
    type: change
    text: "Хочу посмотреть выравнивания гена Pck1 в IGV. Какой файл открыть?"
    anchors: [B02b, B03]
    expected: "BAM-файлов нет: перешли на Salmon без STAR из-за квоты; для IGV нужно отдельно выровнять несколько образцов (или только область гена)."
    inappropriate: ["открыть BAM из выхода STAR в nf-core"]
  - id: Q17
    type: change
    text: "Напиши для статьи абзац методов про обработку данных."
    anchors: [B02b, B06b, B04, B05, B07]
    expected: "Salmon (без STAR) на GRCm39 / GENCODE M33, DESeq2 с ~ batch + condition, F3 исключён после QC."
    inappropriate: ["STAR в описании пайплайна", "геном GRCm38"]
  - id: Q18
    type: change
    text: "В старой статье координаты гена даны по GRCm38. Можно сравнить их напрямую с нашими?"
    anchors: [B06b]
    expected: "Нет: мы теперь на GRCm39 — координаты отличаются, нужен liftOver или сравнение по ID/символу гена."
    inappropriate: ["сравнивать координаты напрямую, как одну сборку"]
