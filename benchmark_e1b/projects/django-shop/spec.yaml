# E1b, проект 2: интернет-магазин велозапчастей на Django (один разработчик).
# Автор скелета: Claude Opus 5.5, 2026-10-21. Тестируемая модель (Qwen2.5) его не видит.
id: django-shop
title: Интернет-магазин велозапчастей «Спица» (Django)
language: ru
user_persona: >
  Разработчик-одиночка, сам себе тимлид; пишет по-русски коротко, иногда раздражённо.
  Магазин уже работает, он дорабатывает его по ходу и советуется с ассистентом.

facts:
  G01:  {text: "Сайт на Django 5 с серверными шаблонами и HTMX; отдельный SPA-фронтенд не делаем."}
  G02:  {text: "Онлайн-оплата через ЮKassa."}
  G02b: {text: "Ушли с ЮKassa на CloudPayments из-за комиссии; ЮKassa отключили полностью.", replaces: G02}
  G03:  {text: "База — PostgreSQL."}
  G04:  {text: "Фоновые задачи — Celery с Redis."}
  G04r: {text: "Kafka для очередей предлагали — отказались: для одного разработчика это перебор."}
  G05:  {text: "Хостимся в Яндекс Облаке: персональные данные покупателей по 152-ФЗ должны храниться в России."}
  G06:  {text: "Своего склада нет: товар лежит у поставщика, остатки подтягиваем из его CSV раз в час."}
  G06b: {text: "Поставщик дал API с вебхуками: остатки теперь обновляются сразу по вебхуку, CSV раз в час убрали.", replaces: G06}
  G07:  {text: "Доставка только СДЭК."}
  G07r: {text: "Почту России подключать отказались: плохой трекинг и много потерянных посылок."}
  G08:  {text: "Покупают в основном частные лица, но есть и юрлица — они платят по счёту."}
  G09:  {text: "Поиск по каталогу — полнотекстовый поиск PostgreSQL."}
  G09r: {text: "Elasticsearch ставить отказались: лишний сервис, а каталог небольшой."}
  G10:  {text: "Разработчик один; дизайнер помогает по паре часов в неделю."}
  G11:  {text: "Мобильного приложения нет и не будет — только адаптивный сайт."}
  G12:  {text: "Вход для покупателей — по номеру телефона и коду из SMS; паролей нет."}
  G13:  {text: "Магазин на УСН без НДС; цены в рублях."}
  G13b: {text: "С января магазин платит НДС: в ценах и чеках НДС нужно выделять.", replaces: G13}
  G14:  {text: "Фотографии товаров лежат в Яндекс Object Storage, миниатюры режет imgproxy на лету."}
  G15:  {text: "Заказами и ценами занимается менеджер через Django admin; он не технарь."}
  G16:  {text: "Аналитика — Яндекс Метрика."}
  G17:  {text: "Промокод — один на заказ, складывать нельзя."}
  G18:  {text: "Возвраты принимаем 14 дней, обратная отправка — тоже через СДЭК."}
  G19:  {text: "В каталоге около 30 тысяч позиций."}

segments:
  - id: S1
    facts: [G01, G03, G10, G11, G19, G02, G06]
    background: "медленная страница каталога, N+1 запросы в шаблоне, пагинация с HTMX, настройка django-debug-toolbar"
  - id: S2
    facts: [G04, G04r, G05, G07, G07r, G12]
    background: "отправка SMS-кодов, таймаут API СДЭК, расчёт стоимости доставки в корзине, миграция с переименованием поля"
  - id: S3
    facts: [G08, G13, G09, G09r, G14, G15]
    background: "выставление счёта юрлицу в PDF, поиск по артикулам с дефисами, тормозящие миниатюры, кастомизация списка заказов в админке"
  - id: S4
    facts: [G02b, G06b, G16, G17]
    background: "вебхуки CloudPayments и проверка подписи, идемпотентность обработки вебхука поставщика, цели в Метрике, баг с промокодом"
  - id: S5
    facts: [G13b, G18]
    background: "фискальные чеки и кассы, оформление возврата, обновление Django, тесты на pytest-django"

questions:
  - id: Q01
    type: clarify
    text: "Надо сделать нормальную регистрацию пользователей. С чего начать?"
    anchors: [G12, G08]
    expected: "Напоминает, что вход уже по телефону и SMS без паролей; уточняет, что нужно — например, кабинет для юрлиц."
    inappropriate: ["регистрация по email и паролю с нуля", "django-allauth с паролями"]
    followup: {id: N01, text: "Да, именно для юрлиц: чтобы входили, видели свои счета и указывали ИНН."}
  - id: Q02
    type: change
    text: "Как вернуть деньги покупателю, если заказ отменили после оплаты?"
    anchors: [G02b]
    expected: "Возврат через API CloudPayments (а не ЮKassa)."
    inappropriate: ["возврат через API ЮKassa"]
  - id: Q03
    type: recall
    text: "Хочу поиск, который прощает опечатки. Поднимаем Elasticsearch?"
    anchors: [G09, G09r, G10, G19]
    expected: "Напоминает отказ от Elasticsearch; предлагает триграммы pg_trgm в PostgreSQL для 30 тысяч позиций."
    inappropriate: ["пошаговая установка Elasticsearch без оговорок"]
  - id: Q04
    type: link
    text: "Покупатель жалуется: оплатил товар, а его не оказалось в наличии. Откуда это и как не допустить?"
    anchors: [G06b, G06]
    expected: "Связывает с остатками у поставщика: сейчас они по вебхукам; проверить пропущенные вебхуки, резервировать при оформлении, сверять перед оплатой."
    inappropriate: ["проверить остатки на собственном складе", "настроить CSV-импорт чаще"]
  - id: Q05
    type: recall
    text: "Хочу слать покупателям пуши о скидках. Делаем мобильное приложение?"
    anchors: [G11, G10]
    expected: "Приложения нет и не планировалось; предлагает веб-пуши или email/SMS."
    inappropriate: ["план разработки мобильного приложения для пушей"]
  - id: Q06
    type: link
    text: "Можно держать резервные копии базы в AWS S3 во Франкфурте?"
    anchors: [G05, G12]
    expected: "Персональные данные (телефоны) по 152-ФЗ должны храниться в России — бэкапы в Яндекс Облаке или обезличивать."
    inappropriate: ["да, AWS S3 подойдёт без оговорок"]
  - id: Q07
    type: recall
    text: "Давай подключим Почту России — дешевле для дальних регионов."
    anchors: [G07r, G07]
    expected: "Напоминает, что от Почты отказались из-за трекинга и потерь; спрашивает, изменилось ли что-то."
    inappropriate: ["пошаговая интеграция API Почты России без оговорок"]
  - id: Q08
    type: change
    text: "Как правильно выводить цены в карточке товара и в чеке?"
    anchors: [G13b]
    expected: "С января НДС: в чеке выделять НДС, цены с НДС."
    inappropriate: ["НДС не указывать, магазин на УСН"]
  - id: Q09
    type: link
    text: "Менеджер хочет сам массово поменять цены на тысячу товаров. Как ему дать такую возможность?"
    anchors: [G15, G19]
    expected: "Инструмент в Django admin для нетехнического менеджера: импорт CSV/Excel с предпросмотром или массовое действие с процентом."
    inappropriate: ["пусть пишет SQL-запрос", "скрипт через manage.py shell"]
  - id: Q10
    type: clarify
    text: "Сделай сброс пароля по почте."
    anchors: [G12]
    retention_of: N01
    expected: "Паролей нет — вход по SMS; уточняет, не про кабинет ли юрлиц речь, и как они входят."
    inappropriate: ["стандартный PasswordResetView с email"]
  - id: Q11
    type: link
    text: "Как организовать заказы для юрлиц?"
    anchors: [G08, G13b]
    expected: "Оплата по счёту, счёт с выделенным НДС (с января), реквизиты и ИНН."
    inappropriate: ["оплата картой как для физлиц"]
  - id: Q12
    type: recall
    text: "Для фоновых задач какую очередь лучше взять?"
    anchors: [G04, G04r]
    expected: "Celery с Redis уже есть; Kafka отвергли; при необходимости — настроить Celery, а не менять."
    inappropriate: ["внедрить Kafka или RabbitMQ с нуля"]
  - id: Q13
    type: link
    text: "Картинки товаров грузятся медленно. Что сделать?"
    anchors: [G14, G19]
    expected: "Кэш миниатюр imgproxy (CDN перед ним), правильные размеры и форматы WebP/AVIF из imgproxy."
    inappropriate: ["перенести картинки в статику Django", "сжимать вручную в Photoshop"]
  - id: Q14
    type: recall
    text: "Покупатель хочет вернуть товар через месяц после покупки. Что ему ответить?"
    anchors: [G18]
    expected: "Возврат в магазине — 14 дней; срок прошёл (кроме брака — отдельные правила); обратная отправка через СДЭК."
    inappropriate: ["принять возврат без оговорок о сроке"]
  - id: Q15
    type: recall
    text: "Можно ли применить к заказу сразу два промокода?"
    anchors: [G17]
    expected: "Нет: правило магазина — один промокод на заказ."
    inappropriate: ["да, сделаем суммирование скидок"]
  # Добавлено 2026-10-22 по решению Егора (мощность для типа «менялось»)
  - id: Q16
    type: change
    text: "Хочу добавить оплату через СБП. Как это сделать у нашего платёжного провайдера?"
    anchors: [G02b]
    expected: "Через CloudPayments (провайдер теперь он), а не ЮKassa."
    inappropriate: ["подключение СБП через ЮKassa"]
  - id: Q17
    type: change
    text: "Раз в час импорт остатков опять подтормаживает сайт. Как его ускорить?"
    anchors: [G06b, G06]
    expected: "Почасового CSV-импорта больше нет — остатки идут по вебхукам поставщика; уточняет, что именно тормозит (возможно, осталась старая периодическая задача)."
    inappropriate: ["оптимизировать почасовой CSV-импорт без оговорок"]
  - id: Q18
    type: change
    text: "Юрлицо просит счёт. Что писать в строке про налог?"
    anchors: [G13b, G08]
    expected: "С января магазин платит НДС — в счёте выделять НДС, а не писать «Без НДС»."
    inappropriate: ["писать «Без НДС», магазин на УСН"]
