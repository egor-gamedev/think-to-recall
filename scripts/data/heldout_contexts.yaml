- id: login-rate-limit
  past:
    - "We store sessions in Redis; the login endpoint already logs failed attempts."
    - "Redis cluster handles sessions and the login endpoint rate counters."
  current:
    - role: user
      content: "Add brute-force protection to the login endpoint: lock the account after 5 failed attempts."
    - id: app/auth/routes.py
      kind: file
      title: app/auth/routes.py
      content: |
        @router.post("/login")
        async def login(form: LoginForm, redis: Redis = Depends(get_redis)):
            user = await users.get_by_email(form.email)
            if not user or not verify_password(form.password, user.password_hash):
                await redis.incr(f"login_fail:{form.email}")
                raise HTTPException(status_code=401)
