# E3 «Помнит решения»: вставки в загрузку clinic-bot (E1c) — загрузка не переписывается.
# Каждая вставка — пара реплик (пользователь + ассистент) сразу после реплики `after` (конец сегмента).
# id вставленной реплики: «<after>+<n>». Автор: Claude Opus 5.5 (2026-10-29), не тестируемая модель.
project: clinic-bot
author: Claude Opus 5.5 (2026-10-29)
inserts:
  - after: S1.13
    turns:
      - id: S1.13+1
        role: user
        events: [EV15]
        text: |
          Ещё Ирина спросила, не сделать ли сразу английскую версию бота — летом в Зеленоградске бывают иностранцы. Английскую версию не делаем: переводчика у клиники нет, в договоре этого нет, а машинный перевод медицинских формулировок я выпускать не хочу. Тексты пока только на русском.
      - id: S1.13+2
        role: assistant
        text: |
          Понял, только русский. Чтобы не закрыть дорогу на будущее, держите все тексты бота в одном модуле `texts.py` (или YAML), а не строками по хэндлерам — если клиника когда-нибудь передумает, перевод будет делом одного файла, а не правкой кода.

  - after: S2.11
    turns:
      - id: S2.11+1
        role: user
        events: [EV12]
        text: |
          Ирина спросила про SMS-напоминания для тех, кто Telegram открывает редко. Подумал и отказался: SMS-шлюз — это платная рассылка, клиника платить за неё не согласна, а в договоре с фиксированной суммой SMS нет. Напоминания — только сообщениями в боте.
      - id: S2.11+2
        role: assistant
        text: |
          Хорошо, остаёмся в Telegram. Тогда важно, чтобы напоминание было заметным: короткий первый абзац с датой, временем и филиалом, без лишнего текста — его видно прямо в уведомлении на заблокированном экране.
      - id: S2.11+3
        role: user
        events: [EV19]
        text: |
          И ещё одно «нет» сразу, чтобы не возвращаться. Заказчик спрашивал, не нужна ли регистратуре своя веб-админка со списком записей из бота. Не делаем: регистратура работает только в СтомаОфисе, второй интерфейс им не нужен, а поддерживать веб-панель после сдачи некому. Всё, что записано через бот, они и так видят в учётке.
      - id: S2.11+4
        role: assistant
        text: |
          Согласен: лишний интерфейс — лишняя точка отказа. Единственное, что стоит сделать, — чтобы записи из бота в учётке было легко отличить: в поле комментария к записи ставить короткую метку вроде «бот».

  - after: S3.11
    turns:
      - id: S3.11+1
        role: user
        events: [EV13]
        text: |
          По развёртыванию решил так. Docker на проде не используем: Вадим Docker не знает, а перезапускать и смотреть логи ему придётся самому — на сервере будет обычный venv и юнит systemd. Для своих тестов на ноутбуке Docker можно, там он никому не мешает.
      - id: S3.11+2
        role: assistant
        text: |
          Разумно: для Вадима `systemctl restart clinic-bot` и `journalctl -u clinic-bot` понятнее, чем контейнеры. Зафиксируйте версии в `requirements.txt` и держите короткий скрипт обновления (git pull, pip install, restart) — это и будет вся «упаковка» для прода.
      - id: S3.11+3
        role: user
        events: [EV18]
        text: |
          Ещё заказчик хотел кнопку «Написать администратору», чтобы сообщения из бота пересылались в чат регистратуры и оттуда шёл ответ. Отказались: регистратура видит чат только на стойке и только в часы работы, ночью и в воскресенье пациент будет ждать ответа впустую и злиться. Вместо этого — кнопка с номером телефона регистратуры и часами работы.
      - id: S3.11+4
        role: assistant
        text: |
          Понял, переписки с регистратурой через бот нет. Кнопку «Позвонить в регистратуру» сделаю обычным сообщением с номером в формате `+7 …` — Telegram сам сделает его кликабельным, — и строкой с часами работы, чтобы человек не звонил в воскресенье.

  - after: S4.11
    turns:
      - id: S4.11+1
        role: user
        events: [EV14]
        text: |
          Про бэкапы SQLite с состояниями и флагами напоминаний. Хотел cron-скриптом копировать файл раз в сутки на Яндекс.Диск — отказались: юрист клиники против, чтобы что-то с данными пациентов лежало в стороннем облаке. Обходимся ежедневными снапшотами VPS в Selectel, они там уже включены.
      - id: S4.11+2
        role: assistant
        text: |
          Хорошо, без внешних облаков. Один нюанс: снапшот диска может поймать SQLite посреди записи. Чтобы копия в снапшоте всегда была целой, включите в базе `PRAGMA journal_mode=WAL` — тогда восстановление из снапшота даст согласованный файл.
      - id: S4.11+3
        role: user
        events: [EV17]
        text: |
          Новое правило от клиники про запись «на сегодня». В Калининграде записываться через бот на сегодня можно, но не позже чем за 2 часа до приёма. В Зеленоградске на сегодня через бот нельзя вообще: там один администратор, врачи приезжают по графику, и карту надо успеть подготовить — только на завтра и дальше.
      - id: S4.11+4
        role: assistant
        text: |
          Понял: правило зависит от филиала. В выдаче слотов это одна проверка — для Горького отсекаем слоты раньше чем «сейчас + 2 часа», для Зеленоградска первый доступный день — завтра. Время сравниваем по калининградскому поясу, как и всё расписание.

  - after: S5.15
    turns:
      - id: S5.15+1
        role: user
        events: [EV16]
        text: |
          Помнишь, в начале решили не делать английскую версию? Возвращаемся к ней. Ирина нашла переводчика с медицинским профилем, клиника сама оплачивает перевод. Делаем английский: язык выбираем по языку Telegram пациента, переводим кнопки, шаги записи и напоминания. Описания услуг пока остаются на русском.
      - id: S5.15+2
        role: assistant
        text: |
          Отлично, тексты как раз лежат в одном месте. Язык берём из `message.from_user.language_code`: `en` — английский, всё остальное — русский. Переводчику отдаём файл с кнопками, шагами записи и напоминаниями; описания услуг в этот файл не входят.
      - id: S5.15+3
        role: user
        events: [EV20]
        text: |
          И про ошибки в проде. Хотел подключить Sentry — Олег Викторович против: трейсы и контекст запросов уходят в чужой сервис, а там могут оказаться ФИО и телефоны. Решили так: ошибки уровня ERROR бот сам шлёт мне в личный Telegram — только тип ошибки и место в коде, без данных пациентов.
      - id: S5.15+4
        role: assistant
        text: |
          Сделаю отдельный `logging.Handler`, который отправляет записи уровня ERROR вам в личку через того же бота, с ограничением частоты, чтобы при каскаде ошибок не прилетела сотня сообщений. В сообщение идут только тип исключения, файл и строка — без текста запроса и аргументов.
