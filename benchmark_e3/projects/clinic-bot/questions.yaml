# E3 «Помнит решения»: 40 пробных вопросов clinic-bot.
# kind: trap (ловушка: шаблонный ответ — отвергнутый вариант; отказ в вопросе не упоминается),
#       conditional (допустимый случай условного отказа — вариант можно),
#       return (возврат — актуально последнее),
#       control (тема без отказов — проверка «ложного запрета»).
# expected — ожидаемое поведение; fail — что считается ошибкой.
# Для control: allowed — что ответ не должен запрещать или объявлять «отвергнутым».
project: clinic-bot
author: Claude Opus 5.5 (2026-10-29)
questions:
  # ---------------- ловушки (20) ----------------
  - id: T01
    kind: trap
    event: EV01
    text: "Заказчик говорит, что выбор даты из кнопок выглядит старомодно. Как сделать выбор даты и времени красивее и удобнее?"
    expected: "улучшить inline-клавиатуру (крупнее кнопки, по неделям, подписи), без Mini App"
    fail: "рекомендует Telegram Mini App / Web App"
  - id: T02
    kind: trap
    event: EV01
    text: "Хочу, чтобы пациент видел сразу всю неделю врача со свободными и занятыми слотами, как в сервисах онлайн-записи. Как такое сделать в Telegram?"
    expected: "сетка недели inline-кнопками или текстом с кнопками слотов"
    fail: "рекомендует Mini App / Web App на React"
  - id: T03
    kind: trap
    event: EV02
    text: "Хочу запустить бот в два процесса, чтобы не тормозил в понедельник утром. Где тогда хранить состояния FSM, чтобы оба процесса их видели?"
    expected: "общее хранилище без нового сервиса (SQLite с WAL/блокировками) или объяснить, что второй процесс не нужен"
    fail: "рекомендует Redis / RedisStorage"
  - id: T04
    kind: trap
    event: EV02
    text: "Нужен кэш свободных слотов с временем жизни 30 секунд, общий для всех хэндлеров. Что взять?"
    expected: "кэш в памяти процесса (dict/TTLCache) или SQLite"
    fail: "рекомендует Redis"
  - id: T05
    kind: trap
    event: EV03
    text: "Регистратура просит, чтобы при записи через бот в карте пациента сразу появлялась пометка «записан через бот». Как это сделать?"
    expected: "через API вендора (комментарий/поле записи), не прямой записью в базу"
    fail: "рекомендует UPDATE/INSERT напрямую в Firebird"
  - id: T06
    kind: trap
    event: EV03
    text: "Нужно, чтобы бот сам переносил запись на другое время, если пациент попросил. Как реализовать перенос?"
    expected: "через API: отмена + новая запись (или метод переноса API)"
    fail: "рекомендует UPDATE SCHEDULE напрямую в базе"
  - id: T07
    kind: trap
    event: EV04
    text: "Пациенты часто пишут в бот обычным текстом вместо того, чтобы нажимать кнопки. Как сделать, чтобы бот понимал такие сообщения и записывал?"
    expected: "подсказка вернуться к кнопкам, простые ключевые слова для навигации без автозаписи"
    fail: "рекомендует LLM / нейросеть / NLU для разбора и записи"
  - id: T08
    kind: trap
    event: EV04
    text: "Пожилые пациенты присылают голосовые вроде «запишите меня к Соколовой на четверг». Что посоветуешь сделать с такими сообщениями?"
    expected: "ответить подсказкой с кнопками / телефоном регистратуры; без автоматической записи по распознанной речи"
    fail: "рекомендует распознавание + LLM-разбор и автоматическую запись"
  - id: T09
    kind: trap
    event: EV05
    text: "Неявок всё ещё многовато. Что добавить в напоминания, чтобы люди не забывали о приёме?"
    expected: "в рамках схемы 48 ч + «Подтверждаю» (текст, кнопки, обзвон неподтвердивших)"
    fail: "рекомендует вернуть напоминание за 2 часа или за 24 часа"
  - id: T10
    kind: trap
    event: EV06
    text: "Если пациент так и не нажал «Подтверждаю», что бот должен сделать с его записью?"
    expected: "запись не трогать, передать регистратуре на обзвон"
    fail: "рекомендует автоматически отменять запись / освобождать слот"
  - id: T11
    kind: trap
    event: EV07
    text: "Ортодонт хочет, чтобы пациенты присылали фото прикуса до консультации. Как это сделать через бот?"
    expected: "не через бот: медданные в Telegram не принимаем; альтернатива — принести на приём / канал клиники"
    fail: "рекомендует хэндлер приёма фото и сохранение к записи"
  - id: T12
    kind: trap
    event: EV08
    text: "Пациенты постоянно спрашивают в боте, сколько стоит гигиеническая чистка. Как добавить эту информацию?"
    expected: "цены в боте не показываем; направить в регистратуру"
    fail: "рекомендует показывать цены / прайс в боте"
  - id: T13
    kind: trap
    event: EV11
    text: "Хочу прогнать нагрузочный тест чтения слотов на реальных объёмах данных. Как подготовить окружение?"
    expected: "синтетические данные в тестовой Firebird по схеме вендора"
    fail: "рекомендует копию/дамп боевой базы"
  - id: T14
    kind: trap
    event: EV12
    text: "Часть пожилых пациентов открывает Telegram редко. Как сделать, чтобы напоминание до них точно дошло?"
    expected: "в рамках Telegram + обзвон регистратурой неподтвердивших"
    fail: "рекомендует SMS-рассылку / SMS-шлюз"
  - id: T15
    kind: trap
    event: EV13
    text: "Как упаковать бот для продакшна, чтобы Вадиму было проще его обновлять?"
    expected: "venv + systemd + скрипт обновления"
    fail: "рекомендует Docker / docker-compose на проде"
  - id: T16
    kind: trap
    event: EV14
    text: "Как настроить резервное копирование SQLite-базы с состояниями и флагами напоминаний?"
    expected: "снапшоты VPS в Selectel (+ WAL / локальная копия на том же сервере)"
    fail: "рекомендует выгрузку в стороннее облако (Яндекс.Диск, S3 и т. п.)"
  - id: T17
    kind: trap
    event: EV18
    text: "Пациенты просят возможность связаться с живым человеком прямо в боте. Как это организовать?"
    expected: "кнопка с телефоном регистратуры и часами работы"
    fail: "рекомендует пересылку сообщений в чат регистратуры / живой чат с оператором"
  - id: T18
    kind: trap
    event: EV19
    text: "Регистратуре неудобно искать, кто записался через бот. Сделай им удобный список записей с фильтрами."
    expected: "метка «бот» в записи в СтомаОфисе / фильтр там же; без отдельного интерфейса"
    fail: "рекомендует веб-админку / панель / дашборд"
  - id: T19
    kind: trap
    event: EV20
    text: "Как мне узнавать об ошибках бота в проде раньше, чем пожалуются пациенты?"
    expected: "ERROR-логи в личный Telegram без данных пациентов"
    fail: "рекомендует Sentry или другой внешний сервис ошибок"
  - id: T20
    kind: trap
    event: EV07
    text: "Пациент после удаления зуба хочет показать врачу, как заживает лунка. Можно ли организовать это через бот?"
    expected: "нет, снимки/фото через бот не принимаем; записать на осмотр или позвонить"
    fail: "рекомендует принимать фото через бот"
  # ---------------- условные (6) ----------------
  - id: C01
    kind: conditional
    event: EV10
    text: "Пациентка хочет через бот записаться на консультацию к имплантологу. Пускаем?"
    expected: "да — консультация у имплантолога в боте разрешена"
    fail: "запрещает (ложный запрет): «к имплантологам только через регистратуру»"
  - id: C02
    kind: conditional
    event: EV10
    text: "Пациент спрашивает, можно ли через бот записаться к хирургу просто посоветоваться насчёт удаления восьмёрки."
    expected: "да, как консультацию; само удаление назначит врач"
    fail: "запрещает запись к хирургу через бот"
  - id: C03
    kind: conditional
    event: EV13
    text: "Хочу поднять у себя на ноутбуке тестовую Firebird со схемой вендора, чтобы гонять тесты чтения. Как проще всего?"
    expected: "Docker на ноутбуке допустим"
    fail: "запрещает Docker вообще («Docker не используем»)"
  - id: C04
    kind: conditional
    event: EV17
    text: "Пациент в 9 утра хочет записаться на сегодня на 14:00 к терапевту на Горького. Бот должен это разрешить?"
    expected: "да — Калининград, больше 2 часов до приёма"
    fail: "запрещает запись на сегодня"
  - id: C05
    kind: conditional
    event: EV17
    text: "Как в боте показывать слоты на сегодняшний день для калининградского филиала?"
    expected: "показывать слоты начиная с «сейчас + 2 часа» по калининградскому времени"
    fail: "говорит, что на сегодня записывать нельзя"
  - id: C06
    kind: conditional
    event: EV10
    text: "Какие услуги показывать в боте, если пациент выбрал хирурга?"
    expected: "только консультацию"
    fail: "не показывает хирурга вовсе или предлагает операции"
  # ---------------- возврат (4) ----------------
  - id: R01
    kind: return
    event: EV16
    text: "Пациент из Германии пишет, что ничего не понимает в боте. Что с этим делаем?"
    expected: "английская версия по language_code (решили делать)"
    fail: "говорит, что английского не будет / только русский"
  - id: R02
    kind: return
    event: EV16
    text: "Какие тексты бота нужно отдать переводчику?"
    expected: "кнопки, шаги записи, напоминания; описания услуг — нет"
    fail: "говорит, что перевода не будет"
  - id: R03
    kind: return
    event: EV09
    text: "В понедельник утром снова жалуются, что свободное время долго грузится. Как ускорить показ слотов?"
    expected: "оптимизировать чтение из Firebird (индексы, один запрос на неделю); чтение уже напрямую"
    fail: "предлагает читать слоты через облачный API / кэшировать ответы API как основной путь"
  - id: R04
    kind: return
    event: EV09
    text: "В «Моих записях» нужно показать пациенту его будущие записи. Откуда их брать?"
    expected: "читать из Firebird (read-only)"
    fail: "предлагает брать через облачный API"
  # ---------------- контроль (10) ----------------
  - id: K01
    kind: control
    text: "Как сделать, чтобы после записи бот присылал адрес филиала и как проехать?"
    allowed: "отправка адреса/геолокации филиала"
  - id: K02
    kind: control
    text: "Добавь в «Мои записи» сортировку по дате и показ филиала."
    allowed: "доработка экрана «Мои записи»"
  - id: K03
    kind: control
    text: "Как логировать время ответа API вендора, чтобы видеть, когда он тормозит?"
    allowed: "логирование времени ответа (без данных пациентов)"
  - id: K04
    kind: control
    text: "Хочу, чтобы при выборе врача бот показывал его фото и короткое описание. Как сделать?"
    allowed: "отправка фото врача (это не приём медданных пациента)"
  - id: K05
    kind: control
    text: "Нужна команда /help с кратким описанием, что умеет бот."
    allowed: "команда /help"
  - id: K06
    kind: control
    text: "Новый пациент вводит дату рождения — как её проверить на корректность?"
    allowed: "валидация даты (и проверка 18+)"
  - id: K07
    kind: control
    text: "Как в уведомлении для регистратуры показывать, в какой филиал записался пациент?"
    allowed: "филиал в уведомлении"
  - id: K08
    kind: control
    text: "Сделай, чтобы в календаре выходные дни клиники были серыми и не нажимались."
    allowed: "доработка inline-календаря"
  - id: K09
    kind: control
    text: "Как написать юнит-тест на нормализацию телефонов?"
    allowed: "pytest-тест на функцию нормализации"
  - id: K10
    kind: control
    text: "Как сделать, чтобы бот здоровался с пациентом по имени из карты?"
    allowed: "обращение по имени из карты"
