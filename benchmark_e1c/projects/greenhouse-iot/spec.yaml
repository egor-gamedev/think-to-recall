# E1c, проект 1: датчики теплиц на ESP32 → MQTT → Raspberry Pi, автополив.
# Автор: Claude Opus 5.5, 2026-10-22. Тестируемая модель (Nemotron) и судьи его не видят.
e1c: true
id: greenhouse-iot
title: Автополив и датчики двух теплиц (ESP32, MQTT, Raspberry Pi)
language: ru
user_persona: >
  Инженер-любитель из семейного фермерского хозяйства под Липецком: работает наладчиком
  на заводе в городе, теплицы ведёт вместе с отцом. Уверенно паяет и пишет прошивки,
  Linux знает на уровне «поставить и чтоб работало». Пишет по-русски, разговорно.

facts:
  # S1
  G01:  {text: "Две необогреваемые теплицы из поликарбоната: №1 — томаты в грунте (зоны Z1, Z2), №2 — огурцы в кокосовых матах (зоны Z3, Z4)."}
  G02:  {text: "Сервер — Raspberry Pi 4 (4 ГБ) в доме: на нём Mosquitto и Python-сервис полива poliv.py под systemd."}
  G03:  {text: "Четыре соленоидных клапана на 24 В переменного тока переключает один узел полива — ESP32 с 4-канальным реле в теплице №1; к клапанам №2 протянут провод."}
  G04:  {text: "В каждой теплице датчик воздуха SHT31 и по одному ёмкостному датчику влажности почвы v1.2 на зону."}
  G05:
    text: "Пользователь бывает в хозяйстве только по выходным; в будни на месте только отец."
    implicit: true
    evidence: "S1: «прошивку залью в субботу, раньше никак — с понедельника по пятницу я на смене в Липецке», «пока батя по утрам краны открывает»; дальше отец звонит о проблемах в будни (S3, S6)."
  G06:  {text: "Полив по расписанию: cron на Raspberry Pi открывает все зоны в 7:00 и 19:00 на 20 минут."}
  G07:  {text: "Интернет в хозяйстве — 4G-роутер с лимитом 20 ГБ в месяц и серым IP."}
  # S2
  G08:
    text: "Узлы теплицы №2 живут от аккумулятора с солнечной панелью: постоянное Wi-Fi-подключение им не по силам, нужен глубокий сон."
    implicit: true
    evidence: "S2: «во вторую кабель не тянули — там панелька на 6 Вт и два 18650 в держателе с платой заряда, от этого и запитаю узел» при схеме «все узлы по Wi-Fi каждые 30 секунд»."
  G09:  {text: "MQTT-топики вида teplica/<номер>/<зона>/<датчик>, полезная нагрузка — JSON с полями v и ts."}
  G10:  {text: "Mosquitto с логином и паролем, без TLS, слушает порт 1883 только в локальной сети."}
  G11:  {text: "Прошивки ESP32 пишем на Arduino-фреймворке в PlatformIO."}
  G11r: {text: "Home Assistant с ESPHome предлагали — отказались: хочу свой код и своё дерево MQTT-топиков."}
  G12:  {text: "Все узлы шлют показания по Wi-Fi напрямую в Mosquitto каждые 30 секунд."}
  G13:
    text: "Отцу оповещения можно слать только SMS или звонком: смартфона и мессенджеров у него нет."
    implicit: true
    evidence: "S2: «бате графики ни к чему — у него Nokia 1280, он ей только мне звонит, когда огурцы повяли»."
  # S3
  G14:
    text: "Общей с домом скважины не хватает на одновременный полив всех зон — зоны надо открывать по очереди."
    implicit: true
    evidence: "S3: когда по датчикам открылись сразу все четыре зоны, в конце рядов огурцов капельницы почти сухие, а при стирке в доме капать перестало; вода из одной скважины на всё хозяйство. Ассистент тогда списал это на засор."
  G06b: {text: "Перешли с расписания на полив по датчикам: зона открывается при влажности почвы ниже 30 % и закрывается на 45 %.", replaces: G06}
  G15:  {text: "Клапан нельзя держать открытым дольше 40 минут подряд — после этого закрывать аварийно (был случай: залило проход)."}
  G16:  {text: "На общей трубе полива стоит импульсный водомер (1 импульс = 10 литров), подключён к GPIO узла полива."}
  G17:  {text: "Показания пишем в SQLite на SD-карте Raspberry Pi."}
  # S4
  G18:  {text: "Удалённый доступ к Raspberry Pi — через Tailscale; портов наружу не открываем."}
  G18r: {text: "От облачных IoT-платформ (Yandex IoT Core, AWS IoT) отказались: 4G с лимитом и пропадает, всё должно работать локально."}
  G12b: {text: "Узлы теплицы №2 переведены с Wi-Fi на ESP-NOW: шлют на шлюз-ESP32 в теплице №1, шлюз публикует в MQTT.", replaces: G12}
  G19:  {text: "Тревога по жаре: в теплице №1 выше 35 °C, в теплице №2 выше 32 °C; форточки открываются только вручную, приводов нет."}
  # S5
  G20:
    text: "После отключения света Raspberry Pi какое-то время живёт с неверным временем: модуля часов RTC нет, а сеть для синхронизации появляется только минут через 20."
    implicit: true
    evidence: "S5: «свет опять вырубали ночью, часа на три», «4G-роутер после включения ещё минут двадцать сеть ищет», «Pi у меня голая — кроме блока питания ничего к ней не брал»."
  G20r: {text: "ИБП для Raspberry Pi не покупаем — не укладывается в деньги этого сезона."}
  G17b: {text: "SQLite и SD-карту бросили после сбоя: данные теперь в InfluxDB 1.8 на USB-SSD.", replaces: G17}
  G06c: {text: "Вернулись к поливу по расписанию 7:00 и 19:00, но с условием: зона пропускает полив, если её датчик показывает влажность выше 45 %.", replaces: G06b}
  # S6
  G12c: {text: "ESP-NOW-шлюз убрали: узлы теплицы №2 передают по LoRa 433 МГц (модули Ra-02) раз в 5 минут, приёмник подключён к Raspberry Pi по SPI.", replaces: G12b}
  G21:  {text: "Следующей весной добавится теплица №3 под перец — в 120 м от дома."}
  G22:  {text: "По субботам с 9 до 11 пользователь вручную делает подкормку через Dosatron; в это окно автоматика клапаны не трогает."}

segments:
  - id: S1
    facts: [G01, G02, G03, G04, G06, G05, G07]
    background: "общая архитектура, трансформатор 24 В и реле для клапанов, снабберы, выбор пинов ESP32 (ADC1), установка Mosquitto, cron и mosquitto_pub, проверка без клапанов"
  - id: S2
    facts: [G11, G11r, G09, G10, G12, G08, G13]
    background: "проект PlatformIO с окружениями на каждый узел, секреты, дерево топиков и LWT, mosquitto.conf с паролями, код узла (SHT31, АЦП, ArduinoJson, переподключение), корпус и конденсат, желание Grafana"
  - id: S3
    facts: [G06b, G17, G15, G16, G14]
    background: "калибровка ёмкостных датчиков и медианный фильтр, гистерезис полива, запись MQTT в SQLite, авария с залитым проходом, подсчёт импульсов водомера на прерывании, сухие капельницы и промывка"
  - id: S4
    facts: [G18, G18r, G19, G12b]
    background: "установка Tailscale, Grafana с SQLite-плагином, Telegram-бот тревог для пользователя, гистерезис и антиспам тревог, код ESP-NOW (передатчик и шлюз), канал Wi-Fi роутера"
  - id: S5
    facts: [G20, G20r, G17b, G06c]
    background: "умершая SD-карта, загрузка с USB-SSD, уменьшение записей на диск, установка InfluxDB 1.8 и писатель из MQTT, скачущие показания датчика в кокосовом мате, cron-слоты с условием пропуска"
  - id: S6
    facts: [G12c, G21, G22]
    background: "роутер сменил канал — ESP-NOW замолчал, подключение Ra-02 к SPI Raspberry Pi, код LoRa-узла и приёмника, правила 433 МГц, дальность до будущей теплицы, субботнее окно подкормки в poliv.py"

questions:
  - id: Q01
    type: change
    text: "Батя звонит: спрашивает, во сколько сегодня будет полив у огурцов, хочет в это время в теплицу не лезть. Что ему ответить?"
    anchors: [G06c, G06b, G06, G01]
    expected: "Полив по расписанию — утром с 7:00 и вечером с 19:00 (огурцы — зоны Z3, Z4); но зона пропустит полив, если её датчик показывает влажность выше 45 %, — тогда воды не будет. Время не зависит от того, когда «подсохнет»."
    inappropriate: ["«как только влажность упадёт ниже 30 %» — полив по датчикам, от которого ушли", "7:00 и 19:00 как безусловный полив всех зон без оговорки о пропуске"]
  - id: Q02
    type: recall
    text: "Подбери мне блок питания на 5 В на DIN-рейку для узлов второй теплицы, чтобы был с запасом."
    anchors: [G08]
    expected: "Во второй теплице нет сети 220 В — узлы живут от двух 18650 с солнечной панелью; DIN-блок включать некуда. Если нужен запас — это ёмкость аккумуляторов/панели и экономия энергии (сон), а не блок питания."
    inappropriate: ["конкретная модель Mean Well HDR/DR-15-5 без оговорки, что там нет розетки"]
  - id: Q03
    type: link
    text: "Сделай в Grafana панель «Состояние теплиц»: температура воздуха с подсветкой, когда пора бить тревогу."
    anchors: [G19, G17b, G09, G04]
    expected: "Источник — InfluxDB 1.8 (запросы InfluxQL по полю v), температура с SHT31 каждой теплицы; пороги разные: №1 — 35 °C, №2 — 32 °C (не один общий порог); напомнить, что реагировать надо вручную форточками."
    inappropriate: ["запрос к SQLite", "единый порог для обеих теплиц", "PromQL/Prometheus как источник"]
  - id: Q04
    type: clarify
    text: "Подключи третью теплицу к системе."
    anchors: [G21, G03, G08, G12c]
    expected: "Уточняет: будет ли в теплице №3 (120 м от дома) сеть 220 В или, как во второй, только аккумулятор с панелью; и будут ли её клапаны от узла полива в №1 по проводу или от своего узла. Связь в любом случае — LoRa, как у №2."
    inappropriate: ["сразу код Wi-Fi-узла с отправкой в MQTT", "добавить её в ESP-NOW-шлюз"]
    followup: {id: N01, text: "Электричества там не будет, как и во второй. Клапаны пусть идут от узла полива в первой — кабель дотяну."}
  - id: Q05
    type: change
    text: "Пишу прошивку для ещё одного датчикового узла во вторую теплицу. Как ему передавать данные и как часто?"
    anchors: [G12c, G08, G11]
    expected: "По LoRa 433 МГц (модуль Ra-02) на приёмник у Raspberry Pi, раз в 5 минут, между передачами — глубокий сон; прошивка в PlatformIO на Arduino-фреймворке."
    inappropriate: ["Wi-Fi напрямую в Mosquitto каждые 30 секунд", "ESP-NOW на шлюз в теплице №1"]
  - id: Q06
    type: recall
    text: "Настрой бате уведомления в Telegram, когда в теплице жара."
    anchors: [G13]
    expected: "У отца кнопочная Nokia 1280 — Telegram он не получит; нужен SMS или звонок (например, USB-модем с SIM на Pi и gammu/SMS-шлюз). Уточнить, устроит ли такой вариант."
    inappropriate: ["пошаговая настройка Telegram-бота для отца"]
  - id: Q07
    type: link
    text: "Где правильнее держать ограничение «клапан не дольше 40 минут» — в poliv.py или в прошивке? Сейчас оно в poliv.py."
    anchors: [G15, G03, G20, G02]
    expected: "Обязательно в прошивке узла полива (ESP32 с реле в №1): poliv.py уже падал, а Pi после отключения света перезагружается и живёт с неверным временем — команда закрытия может не прийти; на узле — таймер от момента открытия, на Pi — дублирующая проверка."
    inappropriate: ["оставить только в poliv.py", "только на Pi через systemd watchdog"]
  - id: Q08
    type: clarify
    text: "Пусть датчики шлют показания раз в 10 секунд — хочу видеть полив вживую."
    anchors: [G12c, G08, G12]
    expected: "Уточняет, какие узлы: для №1 (сеть, Wi-Fi, сейчас 30 с) это возможно; узлы №2 на аккумуляторе и LoRa раз в 5 минут — 10 секунд там не выйдет (энергия, эфир 433 МГц). Спросить, всё время или только пока идёт полив."
    inappropriate: ["поменять интервал на 10 с во всех прошивках, включая вторую теплицу"]
    followup: {id: N02, text: "Только узлы первой теплицы и только пока у них идёт полив. Вторую не трогай."}
  - id: Q09
    type: change
    text: "Нарисуй в Grafana график влажности почвы по зонам — данные бери из таблицы readings."
    anchors: [G17b, G17]
    expected: "Таблицы readings в SQLite больше нет: SD-карта умерла, данные в InfluxDB 1.8 на USB-SSD — запрос InfluxQL к измерению влажности по зонам."
    inappropriate: ["SQL-запрос к SQLite readings", "плагин SQLite для Grafana"]
  - id: Q10
    type: recall
    text: "Подключаю новый узел к брокеру. Напомни, что прописать для подключения?"
    anchors: [G10, G09]
    expected: "Mosquitto на Pi, порт 1883, без TLS, с логином и паролем (только из локальной сети); публиковать в teplica/<номер>/<зона>/<датчик> JSON с v и ts."
    inappropriate: ["порт 8883 и сертификаты TLS", "анонимное подключение"]
  - id: Q11
    type: link
    text: "Днём огурцы повяли, а тревога по жаре не пришла. Что могло пойти не так?"
    anchors: [G19, G12c, G08, G04]
    expected: "Проверить, доходили ли данные из №2: узлы на аккумуляторе с панелью (могли сесть в пасмурные дни) и шлют по LoRa раз в 5 минут — без данных тревога не сработает; порог №2 — 32 °C. Нужна тревога и на отсутствие свежих данных."
    inappropriate: ["искать только ошибку в Telegram-боте", "проверить Wi-Fi узлов второй теплицы"]
  - id: Q12
    type: change
    text: "Роутер опять сам сменил канал Wi-Fi. Что перенастроить в узлах второй теплицы?"
    anchors: [G12c, G12b]
    expected: "Ничего: узлы №2 теперь на LoRa и от канала Wi-Fi не зависят (зависимость от канала была у ESP-NOW-шлюза, его убрали). Узлы №1 на Wi-Fi переподключатся сами."
    inappropriate: ["прописать новый канал в ESP-NOW на узлах и шлюзе", "зафиксировать канал на роутере ради узлов №2"]
  - id: Q13
    type: clarify
    text: "Поставь порог тревоги по жаре 35 градусов."
    anchors: [G19]
    expected: "Уточняет: в №1 уже 35 °C, в №2 — 32 °C (огурцы нежнее). Поднять ли до 35 °C порог второй теплицы или сделать один порог на обе — оба прочтения возможны."
    inappropriate: ["молча поставить 35 °C единым порогом на обе теплицы"]
  - id: Q14
    type: link
    text: "Сколько 18650 и какую панель брать на датчиковый узел третьей теплицы, чтобы он пережил пасмурную неделю?"
    anchors: [G21, G08, G12c]
    retention_of: N01
    expected: "Помнит, что в №3 сети не будет: расчёт как для №2 — LoRa раз в 5 минут с глубоким сном между передачами, ток сна и передачи, запас ≥ 7 дней без солнца; клапаны там с узла полива №1, узлу их питать не надо."
    inappropriate: ["блок питания от сети", "расчёт под постоянный Wi-Fi"]
  - id: Q15
    type: recall
    text: "Давай утром открывать все четыре зоны одновременно, а не тянуть — так быстрее закончим до жары."
    anchors: [G14]
    expected: "Не стоит: при одновременном открытии всех зон в конце рядов огурцов было сухо, а при стирке в доме вода вообще пропадала — общей с домом скважины на все зоны не хватает; открывать по очереди."
    inappropriate: ["одновременное открытие без оговорок", "списать проблему только на засор капельниц"]
  - id: Q16
    type: change
    text: "Датчик в Z3 показывает 28 %, а клапан так и не открылся. Почему?"
    anchors: [G06c, G06b]
    expected: "Так и задумано: полив теперь по расписанию 7:00 и 19:00, датчик лишь отменяет полив при влажности выше 45 %; открытие по порогу 30 % отменено. Откроется в ближайший слот."
    inappropriate: ["отлаживать гистерезис 30/45 % как действующую логику"]
  - id: Q17
    type: link
    text: "Как поймать ситуацию, когда клапан залип открытым, а узел полива думает, что реле выключено?"
    anchors: [G16, G03, G22]
    expected: "Водомер на общей трубе (1 импульс = 10 л) на узле полива: импульсы при всех закрытых клапанах — тревога; исключить субботнее окно 9–11, когда подкормку делают вручную."
    inappropriate: ["ставить новые датчики тока или концевики на каждый клапан, не вспомнив водомер"]
  - id: Q18
    type: clarify
    text: "В субботу посреди подкормки клапан сам закрылся. Исправь."
    anchors: [G22, G15]
    expected: "Вероятно, сработал 40-минутный аварийный предохранитель, который не знает про окно подкормки 9–11. Уточняет: как открывали зону (через автоматику/реле или вручную) и сколько она была открыта; предлагает исключение на окно, а не отключение предохранителя."
    inappropriate: ["убрать или поднять предел 40 минут для всех случаев"]
  - id: Q19
    type: change
    text: "На сколько дней хватит заряда узлу во второй теплице при отправке раз в 30 секунд?"
    anchors: [G12c, G12, G08]
    expected: "Сейчас он шлёт не раз в 30 с, а по LoRa раз в 5 минут со сном между передачами — считать нужно так (30 с по Wi-Fi было в самом начале)."
    inappropriate: ["расчёт для Wi-Fi раз в 30 секунд как текущий режим"]
  - id: Q20
    type: recall
    text: "Добавляю датчик освещённости в первую теплицу, зона Z1. В какой топик и в каком виде его слать?"
    anchors: [G09]
    expected: "teplica/1/z1/<датчик>, например teplica/1/z1/lux, полезная нагрузка — JSON с полями v и ts."
    inappropriate: ["greenhouse/... или home/... другой схемой", "голое число без JSON"]
  - id: Q21
    type: link
    text: "Напиши в poliv.py функцию, которая решает, открывать ли зону прямо сейчас."
    anchors: [G06c, G14, G22, G15]
    expected: "Только в слоты 7:00 и 19:00; пропуск, если свежий датчик зоны выше 45 %; зоны по одной, не все сразу; в субботу 9–11 не трогать; не дольше 40 минут."
