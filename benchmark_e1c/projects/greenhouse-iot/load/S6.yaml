segment: S6
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: []
    text: |
      Опять вторая теплица. В понедельник роутер сам обновил прошивку и после перезагрузки перескочил на другой канал Wi-Fi — фиксированный шестой слетел в «авто». Шлюз переподключился к роутеру на новом канале, а узлы второй теплицы так и шлют на шестой. Три дня тишины, батя заметил только по вялым огурцам в среду. Я в городе, через Tailscale вижу, что данных нет, а сделать ничего не могу.
  - role: assistant
    facts: []
    text: |
      Да, это слабое место ESP-NOW рядом с Wi-Fi: шлюз обязан сидеть на канале роутера, а передатчики про смену канала ничего не знают. Варианты:

      1. **Сканирование канала на узлах.** Если подтверждение доставки не пришло, узел перебирает каналы 1–13 и ищет тот, где шлюз отвечает; найденный канал запоминает. Работает, но после каждой смены канала узлы какое-то время «ищут», а прошивки усложняются.
      2. **Шлюз без Wi-Fi.** Шлюз слушает ESP-NOW на фиксированном канале и передаёт данные в Pi не по Wi-Fi, а по проводу (UART/RS-485) — но от первой теплицы до дома 40 м кабеля.
      3. **Уйти с 2,4 ГГц совсем.** LoRa на 433 или 868 МГц: дальность на открытой местности — сотни метров и больше, пробивает поликарбонат и стены без проблем, от Wi-Fi не зависит вовсе. Приёмник ставится прямо у Pi, шлюз в теплице не нужен.

      Обновления прошивки роутера тоже стоит выключить, если он это позволяет: иначе это повторится с любой схемой, завязанной на его настройки.
  - role: user
    facts: [G12c]
    text: |
      Надоело. ESP-NOW-шлюз убираем: узлы теплицы №2 будут передавать по LoRa 433 МГц, модули Ra-02 уже лежат в ящике. Отправка раз в 5 минут — чаще огурцам не надо. А приёмник — тоже Ra-02, подключаю прямо к Raspberry Pi по SPI.
  - role: assistant
    facts: []
    text: |
      Хороший выбор. Ra-02 — это SX1278, питание строго 3,3 В (от 5 В модуль сгорит), и без антенны его не включайте на передачу.

      **Подключение приёмника к Pi** (нумерация физических пинов):

      | Ra-02 | Pi |
      |---|---|
      | 3.3V | 1 |
      | GND | 6 |
      | SCK | 23 (SPI0 SCLK) |
      | MISO | 21 |
      | MOSI | 19 |
      | NSS | 24 (CE0) |
      | RST | 22 (GPIO25) |
      | DIO0 | 18 (GPIO24) |

      SPI включается через `sudo raspi-config` → Interface Options → SPI.

      **Правила эфира.** 433,075–434,790 МГц у нас — диапазон для маломощных устройств без разрешения, мощность до 10 мВт. Ставьте 433,5 МГц и мощность 10 dBm. Раз в 5 минут — очень мало эфирного времени, проблем не будет.

      **Узел** (библиотека `sandeepmistry/LoRa` в PlatformIO):

      ```cpp
      #include <LoRa.h>

      struct __attribute__((packed)) Pkt {
        uint8_t teplica, zoneA, zoneB, seq;
        int16_t temp10, hum10, soilA10, soilB10;   // ×10, чтобы не гонять float
      };
      uint8_t seq = 0;

      void setup() {
        LoRa.setPins(5, 14, 2);                     // NSS, RST, DIO0
        LoRa.begin(433.5E6);
        LoRa.setTxPower(10);
        LoRa.setSpreadingFactor(10);
        LoRa.enableCrc();
        sht.begin(0x44);
      }

      void loop() {
        Pkt p = {2, 3, 4, seq++,
                 (int16_t)(sht.readTemperature() * 10), (int16_t)(sht.readHumidity() * 10),
                 (int16_t)(soilPercent(readSoilRaw(34)) * 10),
                 (int16_t)(soilPercent(readSoilRaw(35)) * 10)};
        LoRa.beginPacket();
        LoRa.write((uint8_t*)&p, sizeof p);
        LoRa.endPacket();
        delay(5UL * 60 * 1000);
      }
      ```

      **Приёмник на Pi** — небольшой сервис `lora-rx` на Python (библиотека `LoRaRF`), который разбирает пакет и публикует в те же топики, что раньше слал шлюз:

      ```python
      import struct, time, json
      from LoRaRF import SX127x
      import paho.mqtt.client as mqtt

      FMT = "<BBBBhhhh"
      lora = SX127x()
      lora.begin(0, 0, 25, 24)            # bus, cs, reset, irq
      lora.setFrequency(433_500_000)
      lora.setLoRaModulation(10, 125000, 5)
      lora.setRxGain(lora.RX_GAIN_BOOSTED, lora.RX_GAIN_AUTO)

      cl = mqtt.Client(mqtt.CallbackAPIVersion.VERSION2, "lora-rx")
      cl.username_pw_set("t2_sens", open("/etc/teplica/t2.pass").read().strip())
      cl.connect("localhost", 1883); cl.loop_start()

      def pub(topic, v):
          cl.publish(topic, json.dumps({"v": v, "ts": int(time.time())}))

      while True:
          lora.request(); lora.wait()
          raw = bytes(lora.read() for _ in range(lora.available()))
          if len(raw) != struct.calcsize(FMT):
              continue
          n, za, zb, seq, t, h, sa, sb = struct.unpack(FMT, raw)
          pub(f"teplica/{n}/air/temp", t / 10); pub(f"teplica/{n}/air/hum", h / 10)
          pub(f"teplica/{n}/z{za}/soil", sa / 10); pub(f"teplica/{n}/z{zb}/soil", sb / 10)
      ```

      Поле `seq` позволяет считать потерянные пакеты: разрыв в номерах — пропуск. Добавьте в Grafana RSSI (`lora.packetRssi()`) — по нему сразу видно, ухудшилась ли связь.

      Шлюз ESP-NOW из коробки узла полива можно вынуть — меньше помех рядом с реле.
  - role: user
    facts: [G21]
    text: |
      Собрал на столе, пакеты идут, RSSI на приёмнике из второй теплицы −98, SNR +7. Кстати, следующей весной добавится теплица №3 под перец, она будет в 120 м от дома, за второй. LoRa туда достанет?
  - role: assistant
    facts: []
    text: |
      С большим запасом. SX1278 на SF10 принимает примерно до −132 dBm, у вас сейчас −98 на ~75 м — до предела ещё больше 30 dB. Удвоение расстояния в открытом пространстве съедает около 6 dB, плюс поликарбонат и стенки теплиц — ещё несколько. 120 м пройдут, и даже SF можно будет снизить до 9 или 8, чтобы сократить время передачи.

      Что поможет, если вдруг будет на грани:

      - **Антенна приёмника** — вынести из дома: пружинка на модуле внутри дома теряет 10–15 dB. Четвертьволновой штырь (17 см для 433 МГц) на окне или внешняя антенна на кабеле.
      - **Высота** — поднять антенну узла хотя бы на 1,5–2 м над грядками: мокрая листва сильно поглощает.
      - **Одна частота** для всех узлов — приёмник один, коллизии при отправке раз в 5 минут маловероятны, а `seq` покажет, если что.
  - role: user
    facts: [G22]
    text: |
      Отлично. И ещё правило, забыл сказать: по субботам с 9 до 11 я вручную делаю подкормку через Dosatron — гоняю раствор по зонам по очереди. В это окно автоматика клапаны не трогает. Добавь в poliv.py.
  - role: assistant
    facts: []
    text: |
      Добавим проверку окна в режим `slot` — функция, которую вызывают перед каждым запуском по расписанию:

      ```python
      from datetime import datetime

      FEED_DAY = 5               # суббота (понедельник = 0)
      FEED_FROM, FEED_TO = 9, 11

      def in_feed_window(now=None):
          now = now or datetime.now()
          return now.weekday() == FEED_DAY and FEED_FROM <= now.hour < FEED_TO

      def slot(cl):
          if in_feed_window():
              log.info("субботнее окно подкормки — слот пропущен")
              return
          for z in (1, 2, 3, 4):
              run_zone(cl, z)
      ```

      Сейчас слоты в 7:00 и 19:00, так что в окно 9–11 они и не попадают, — проверка на случай, если расписание когда-нибудь сдвинете. Если хотите, чтобы на время подкормки ещё и тревоги по жаре не дёргали вас в Telegram — скажите, тоже можно привязать к окну.
  - role: user
    facts: []
    text: |
      Тревоги пусть остаются, в субботу я и так там. Спасибо, на сегодня всё — пойду монтировать Ra-02 во вторую.
  - role: assistant
    facts: []
    text: |
      Удачи с монтажом. При установке узла во второй теплице проверьте на месте: после первого пакета в журнале `lora-rx` (`journalctl -u lora-rx -f`) должен появиться RSSI около −95…−100, и в Grafana точки второй теплицы пойдут раз в 5 минут. Старые топики не меняются, поэтому панели и тревоги подхватят данные без правок.
