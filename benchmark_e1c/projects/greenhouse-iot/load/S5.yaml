segment: S5
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [G20]
    text: |
      Плохие новости. Свет опять вырубали ночью со среды на четверг, часа на три — у нас линия старая, такое бывает пару раз в месяц. Raspberry после этого не поднялся вообще. Батя утром звонил, полив открывал руками. Приехал в пятницу: SD-карта не читается ни на Pi, ни на ноутбуке. 4G-роутер, кстати, после включения ещё минут двадцать сеть ищет, у него всегда так, — так что я даже не сразу понял, что дело не в связи. Pi у меня голая — кроме блока питания ничего к ней не брал. Что делать, чтобы такое не повторялось?
  - role: assistant
    facts: []
    text: |
      Внезапное отключение питания — главная причина смерти SD-карт в Raspberry Pi: если обрыв приходится на запись, контроллер карты может испортить служебные области, и карта перестаёт определяться целиком. У вас писали на карту сразу три источника: SQLite каждые несколько секунд, журналы systemd и Grafana. Варианты по убыванию эффекта:

      1. **Загрузка с USB-SSD.** Pi 4 умеет грузиться с USB без карты. SSD переносят обрывы питания гораздо лучше, а ресурса записи у них на порядки больше. Подойдёт любой SATA-SSD на 120–240 ГБ в USB 3.0-боксе, лучше с чипом ASMedia или JMicron (у некоторых других проблемы с UAS).
      2. **Меньше записей.** Журналы — в оперативную память: в `/etc/systemd/journald.conf` поставить `Storage=volatile`, `RuntimeMaxUse=50M`.
      3. **Файловая система.** ext4 с журналом (по умолчанию) и опция `commit=60` в `/etc/fstab` для раздела с данными — меньше мелких записей.
      4. **Бэкап образа.** Раз в месяц `rpi-clone` или `dd` на второй носитель — восстановление за 15 минут, а не за выходные.

      Как загрузиться с SSD: прошить свежую Raspberry Pi OS на SSD через Raspberry Pi Imager, проверить порядок загрузки (`sudo rpi-eeprom-config` → `BOOT_ORDER=0xf41`, USB после SD) и вынуть карту.
  - role: user
    facts: [G20r]
    text: |
      ИБП для Raspberry Pi не покупаем — не укладывается в деньги этого сезона, и так на капельницы потратился. SSD на 240 есть старый, с ноутбука, бокс куплю. Карту, видимо, хоронить?
  - role: assistant
    facts: []
    text: |
      Скорее всего да. Можно попробовать снять образ `ddrescue` с другого компьютера, но если карта не определяется как устройство вовсе — данные с неё не достать без лаборатории, и для истории показаний это того не стоит.

      Без ИБП тогда тем более важно, чтобы система переживала обрыв сама:

      - сервисы с `Restart=always` и `WantedBy=multi-user.target` — после включения всё поднимется без вас;
      - базу держать на SSD и писать пачками, а не по одному значению с `commit()` на каждое;
      - узел полива должен сам приходить в безопасное состояние при перезагрузке Pi — у вас реле при старте выключены и есть таймер на узле, это уже хорошо.

      Пока Pi лежал, полив по датчикам просто не работал — зоны никто не открывал, и батя справился руками. Хуже было бы наоборот.
  - role: user
    facts: [G17b]
    text: |
      Систему на SSD поставил, всё перенёс из бэкапа конфигов, который у меня, к счастью, был на ноутбуке. Решено: SQLite и SD-карту бросаем, данные теперь будут в InfluxDB 1.8 на USB-SSD. Старая база осталась на карте — то есть всё. Как поставить Influx и переписать logger.py?
  - role: assistant
    facts: []
    text: |
      InfluxDB 1.8 для arm64 есть в репозитории InfluxData:

      ```bash
      wget -q https://repos.influxdata.com/influxdata-archive_compat.key
      cat influxdata-archive_compat.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/influxdata.gpg >/dev/null
      echo "deb https://repos.influxdata.com/debian stable main" | sudo tee /etc/apt/sources.list.d/influxdata.list
      sudo apt update && sudo apt install -y influxdb
      sudo systemctl enable --now influxdb
      influx -execute "CREATE DATABASE teplica"
      influx -execute "CREATE RETENTION POLICY two_years ON teplica DURATION 104w REPLICATION 1 DEFAULT"
      ```

      Новый logger.py — пишет пачками раз в 10 секунд, теги для теплицы и места, поле `v`:

      ```python
      # logger.py (InfluxDB 1.8)
      import json, time, threading
      import paho.mqtt.client as mqtt
      from influxdb import InfluxDBClient

      db = InfluxDBClient("localhost", 8086, database="teplica")
      buf, lock = [], threading.Lock()

      def on_message(cl, ud, msg):
          _, n, place, sensor = msg.topic.split("/")
          if place == "node":
              return
          d = json.loads(msg.payload)
          with lock:
              buf.append({"measurement": sensor,
                          "tags": {"teplica": n, "place": place},
                          "time": int(d["ts"]),
                          "fields": {"v": float(d["v"])}})

      def flusher():
          while True:
              time.sleep(10)
              with lock:
                  batch, buf[:] = list(buf), []
              if batch:
                  db.write_points(batch, time_precision="s")

      threading.Thread(target=flusher, daemon=True).start()
      ```

      В Grafana — новый источник данных InfluxDB (InfluxQL, `http://localhost:8086`, база `teplica`). Запрос температуры:

      ```sql
      SELECT mean("v") FROM "temp"
      WHERE "place" = 'air' AND $timeFilter
      GROUP BY time($__interval), "teplica"
      ```

      Плагин SQLite и старые панели можно удалить.
  - role: user
    facts: []
    text: |
      Перенёс, графики снова идут. Теперь другая проблема — Z3. Последнюю неделю датчик в мате показывает то 20 %, то 60 %, клапан открывается и закрывается по пять раз за утро. В Z4 поспокойнее, но тоже скачет. В томатах всё ровно. Датчики одинаковые, калибровка та же.
  - role: assistant
    facts: []
    text: |
      Для кокосового субстрата это ожидаемо, и дело не в самих датчиках:

      - **Соли.** В маты идёт раствор с удобрениями, а ёмкостный датчик чувствителен к электропроводности: после подкормки показания «влажнее», после промывки — «суше», хотя воды столько же.
      - **Мат быстро сохнет и быстро мокнет.** Кокос держит мало воды по сравнению с грунтом, и капля рядом с датчиком меняет показание сразу на десятки процентов. Положение датчика относительно капельницы решает всё.
      - **Контакт.** В волокнистом кокосе вокруг платы бывают воздушные карманы — показание зависит от того, как мат осел.

      Можно сгладить: скользящая медиана за 15 минут, ставить датчик на постоянное расстояние от капельницы (5–7 см), в середину мата по высоте. Но в тепличном овощеводстве на субстрате полив по датчику влажности вообще редкость — обычно поливают по расписанию или по накопленной солнечной радиации, а влажность и дренаж используют для контроля.
  - role: user
    facts: [G06c]
    text: |
      Вот и я к тому. По датчикам не работает. Короче, возвращаемся к поливу по расписанию — 7:00 и 19:00, как было, — но с условием: зона пропускает полив, если её датчик показывает влажность выше 45 %. Пусть датчик только запрещает лишний полив, а не командует.
  - role: assistant
    facts: []
    text: |
      Разумный компромисс: расписание задаёт ритм, а датчик страхует от перелива. Чтобы шумный датчик не мешал и здесь, для решения берём медиану за последние 15 минут, а не последнее значение.

      Слоты можно снова отдать cron, а логику проверки — poliv.py:

      ```cron
      0 7,19 * * * /usr/local/bin/poliv-slot
      ```

      ```bash
      #!/bin/sh
      # /usr/local/bin/poliv-slot
      exec /usr/bin/python3 /home/pi/poliv/poliv.py slot
      ```

      ```python
      SKIP_ABOVE = 45.0
      DURATION = 20 * 60
      WINDOW = 15 * 60

      def zone_median(z):
          r = db.query(f'SELECT median("v") FROM "soil" WHERE "place" = \'z{z}\' '
                       f'AND time > now() - {WINDOW}s')
          pts = list(r.get_points())
          return pts[0]["median"] if pts else None

      def run_zone(cl, z):
          m = zone_median(z)
          if m is not None and m > SKIP_ABOVE:
              log.info("z%d: %.0f%% > %.0f%% — пропуск", z, m, SKIP_ABOVE)
              return
          if m is None:
              log.warning("z%d: нет свежих данных — поливаем по расписанию", z)
          cl.publish(f"poliv/z{z}/set", DURATION)
      ```

      Обратите внимание на ветку «нет данных»: если датчик молчит, зона поливается — для растений безопаснее лишний полив по расписанию, чем пропуск из-за мёртвого датчика. Код гистерезиса 30/45 из основного цикла уберите, но watchdog на 40 минут оставьте как есть.
  - role: user
    facts: []
    text: |
      Логично, что без данных — поливать. Убрал гистерезис, режим slot сделал. Утром проверю, как отработает.
  - role: assistant
    facts: []
    text: |
      Для проверки удобно запустить слот вручную, не дожидаясь утра, и посмотреть журнал:

      ```bash
      sudo -u pi /usr/local/bin/poliv-slot
      journalctl -t poliv-slot -n 20
      ```

      Если хотите видеть решения по зонам в Grafana, публикуйте результат в `teplica/<n>/z<z>/decision` — со значением 1 (полили) или 0 (пропуск); logger.py запишет его в Influx как обычное показание.
