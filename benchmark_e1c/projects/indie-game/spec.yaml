    expected: "Список языков — только из enabled в languages.cfg (ru/en/de), навигация фокусом с геймпада и клавиатуры без мыши; названия языков на своём языке рисуются «Маячком» (латиница и кириллица), а «日本語» не отрисуется без CJK-шрифта — учесть, когда включат японский; предупреждение о вспышках — до первой сцены с маяком."
    inappropriate: ["выбор языка кликом мыши", "все языки Godot в списке"]
  - id: Q49
    type: change
    text: "Подскажи, как в Weblate настроить обязательное ревью для японского."
    anchors: [I05c, I05b]
    expected: "Weblate закрыт, переводы в CSV в репозитории; японский попадает в релиз после вычитки носителем — ревью устраивается вне Weblate (вычитка kuroshio/носителя и включение ja в languages.cfg)."
    inappropriate: ["инструкция по режиму Reviewers в Weblate", "вернуть японский в Weblate"]
  - id: Q50
    type: clarify
    text: "Сделай, чтобы можно было сохраняться в любой момент."
    anchors: [I07c, I07]
    expected: "Два прочтения: (1) ручное сохранение в один из трёх слотов из меню паузы (сейчас только автосохранение при входе в комнату); (2) сохранение посреди головоломки — тогда в бинарный словарь сейва надо добавлять состояние механизмов. Спрашивает, что нужно."
    inappropriate: ["квиксейв в save.json", "сохранение через ResourceSaver"]
