    expected: "Опция «Уменьшить вспышки» уже есть и спрашивается при первом запуске; уточняет: включить её по умолчанию для всех, убрать вспышки из конкретной сцены или из трейлера/демо — что имеется в виду."
    inappropriate: ["молча удалить эффект маяка из игры", "добавить ещё одну такую же опцию"]
  - id: Q45
    type: change
    text: "Плейтестер хочет вручную перенести сохранения на другой компьютер. Какие файлы ему искать?"
    anchors: [I07c, I07b, I07]
    expected: "Файлы slot_1…3.sav в папке Smotritel внутри %APPDATA% (на Linux/Deck — ~/.local/share/Smotritel); старые .tres переименованы в .old и не загружаются; вообще-то это делает Steam Cloud сам."
    inappropriate: ["искать save.json", "скопировать slot_N.tres"]
  - id: Q46
    type: link
    text: "Что учесть, когда будем делать трейлер, чтобы его можно было крутить на странице и раздать стримерам?"
    anchors: [I08, I21, I13, I06]
    expected: "Музыка Олега в трейлере — оговорить в договоре использование в материалах продвижения (и Content ID); без частых вспышек маяка в кадре или с предупреждением; монтажёр уже оплачен из бюджета, отдельной рекламы под трейлер нет — он работает через страницу и стримеров; записывать с целым множителем (1280×800 или 1600×1000 в рамке), без дробного масштаба."
