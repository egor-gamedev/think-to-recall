    anchors: [I14r, I13]
    expected: "Ранний доступ уже отвергнут: игра линейная и сюжетная, половина истории испортит впечатление и отзывы; денег это не решает так, как кажется; лучше копить вишлисты к июньскому демо."
    inappropriate: ["да, ранний доступ — хороший способ профинансировать разработку", "план выхода в ранний доступ"]
