    expected: "Сводит: Next Fest в июне 2027; японский включается только после вычитки kuroshio; «Маячок» не содержит японских знаков — нужен готовый пиксельный CJK-шрифт с лицензией (Вика тысячи иероглифов не нарисует, у неё только выходные) и перевёрстка окон под крупный шрифт; реалистичнее японский к релизу или патчем."
