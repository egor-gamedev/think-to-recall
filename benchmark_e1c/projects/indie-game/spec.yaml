# E1c, проект indie-game: 2D-головоломка «Смотритель» на Godot, релиз в Steam, локализация.
# Автор: Claude Opus 5.5, 2026-10-22. Тестируемая модель и судьи этот файл не видят.
# Неявные факты (implicit) ни разу не сказаны прямо; evidence — из каких реплик они следуют.
# Цепочки: I05 → I05b → I05c (локализация, с возвратом к CSV «с условием»),
#          I07 → I07b → I07c (формат сохранений).
id: indie-game
e1c: true
title: Инди-головоломка «Смотритель» (Godot 4.3, Steam, локализация)
language: ru
user_persona: >
  Соло-разработчик: днём бэкендер на основной работе, игру делает по вечерам и в выходные.
  Пишет по-русски, коротко и по делу, иногда устало и с иронией; в Godot разбирается средне,
  в Steamworks и юридических вопросах — слабо.

facts:
  I01:  {text: "Игра «Смотритель» — 2D пиксельная головоломка-адвенчура про смотрителя маяка; движок Godot 4.3, весь код на GDScript, C# не используем."}
  I02:  {text: "Код, геймдизайн и тексты делаю один, около 15 часов в неделю после основной работы; арт рисует сестра Вика по выходным, музыку пишет композитор по договору."}
  I03:  {text: "Платформы — Windows и нативная Linux-сборка; главная цель — значок Steam Deck Verified, Deck — основное тестовое устройство."}
  I03r: {text: "Порт на Nintendo Switch отвергли: Godot не экспортирует на консоли сам, нужен сторонний портер, а денег на него нет."}
  I04:
    text: "Версии под macOS не будет."
    implicit: true
    evidence: "S1: в Steamworks отмечены только Windows и Linux; «мака у меня нет и не будет, покупать железку ради одной платформы не стану», а нотаризация требует Apple-устройства."
  I05:  {text: "Локализация: переводы храню в CSV-таблице в репозитории, языки — русский и английский, английский перевожу сам."}
  I05b: {text: "Перешли на gettext .po и Weblate: волонтёры переводят на немецкий, французский, испанский, португальский (бразильский), японский и китайский; языков стало 8.", replaces: I05}
  I05c: {text: "Weblate закрыли и вернулись к CSV в репозитории, но с условием: язык попадает в релиз, только если перевод вычитан носителем; на релизе русский, английский и немецкий, японский — если успеет вычитка, иначе патчем.", replaces: I05b}
  I06:
    text: "На мониторах 1920×1080 картинка не займёт весь экран: целочисленный масштаб даёт 1600×1000 с чёрной рамкой по краям."
    implicit: true
    evidence: "S2: базовое разрешение 320×200, масштабирование только целым множителем (integer scaling), под Deck 1280×800 ровно ×4; 1080/200 = 5,4 → множитель 5."
  I07:  {text: "Сохранение — JSON-файл user://save.json, один слот, автосохранение при входе в комнату."}
  I07b: {text: "Сохранения перевёл на Resource: класс SaveGame, ResourceSaver пишет user://slot_N.tres, слотов стало три.", replaces: I07}
  I07c: {text: "От .tres отказался: загрузка .tres может выполнить встроенный скрипт, а сейвы игроки пересылают в Discord; теперь бинарный файл через FileAccess.store_var/get_var без объектов, с полем версии, три слота, синхронизация через Steam Cloud.", replaces: I07b}
  I08:  {text: "Композитор Олег по договору: права на музыку остаются у него, у игры неисключительная лицензия; продавать саундтрек отдельно — только с его согласия и с долей 50 % ему."}
  I08r: {text: "Издателя «Пиксель Хаус» отвергли: просили 30 % выручки и права на IP и сиквелы."}
  I09:  {text: "План: демо на Steam Next Fest в феврале 2027, релиз 1.0 в апреле 2027."}
  I09b: {text: "Next Fest перенесён на июнь 2027 — демо не успевает к февралю; релиз 1.0 сдвинут на сентябрь 2027.", replaces: I09}
  I10:  {text: "Базовая цена в Steam — 12,99 $, региональные цены по рекомендации Steam."}
  I11:  {text: "Вишлистов сейчас около 1800; цель до Next Fest — 7000."}
  I12:  {text: "Игра линейная, около 5 часов, 4 главы; все уровни и головоломки собраны вручную, процедурной генерации нет."}
  I13:
    text: "Платной рекламы не будет: денег на неё нет."
    implicit: true
    evidence: "S4: бюджет 300 тыс. ₽ расписан целиком — 180 тыс. композитору, 60 тыс. Вике, 40 тыс. на трейлер-монтажёра, остаток на взнос Steam Direct и запас на налоги; «больше взять неоткуда»."
  I14:  {text: "Закрытый плейтест через Steam Playtest, лимит 200 человек."}
  I14r: {text: "Ранний доступ отвергли: игра сюжетная и линейная, недоделанный сюжет в раннем доступе только испортит впечатление."}
  I15:
    text: "Собственного шрифта не хватит для японского: нужен отдельный CJK-шрифт."
    implicit: true
    evidence: "S3: пиксельный шрифт «Маячок» Вика нарисовала в BitFontMaker — высота 6 пикселей, в нём только латиница и кириллица; в S3 же волонтёры берутся за японский."
  I16:  {text: "Управление — геймпад и клавиатура; мышь в игре не используется вообще, курсор скрыт."}
  I17:  {text: "Диалоги сделаны в Dialogic 2; строки диалогов выгружаются встроенным экспортом переводов Dialogic в CSV."}
  I18:  {text: "Движок заморожен на Godot 4.3 до релиза, на 4.4 и новее не переходим."}
  I19:
    text: "Нынешняя сборка без запущенного Steam работать не будет."
    implicit: true
    evidence: "S5: при старте вызывается Steam.steamInitEx(), и если результат не OK — get_tree().quit() («как в доке GodotSteam, чтоб не было пиратских запусков»); отдельного пресета без Steam нет."
  I20:  {text: "Озвучки нет: только текст и «бормотание» — звуки-слоги для каждого персонажа."}
  I21:  {text: "Опция отключения вспышек обязательна: свет маяка мигает, а у одного из тестеров фоточувствительная эпилепсия."}
  I22:  {text: "Репозиторий на GitHub с Git LFS; CI в GitHub Actions экспортирует сборки и заливает их через steamcmd в ветку beta."}

segments:
  - id: S1
    facts: [I01, I02, I03, I03r, I04, I05, I18]
    background: "структура проекта Godot, автозагрузки, машина состояний игрока, джиттер камеры"
  - id: S2
    facts: [I06, I07, I09, I16, I17]
    background: "pixel-perfect камера и stretch, Input Map, настройка Dialogic, первое автосохранение"
  - id: S3
    facts: [I05b, I08, I08r, I12, I15, I20]
    background: "переход на gettext и Weblate, звуковые шины, бормотание персонажей, пиксельный шрифт"
  - id: S4
    facts: [I07b, I10, I11, I13, I14, I14r]
    background: "страница Steam, капсулы, вишлисты, ресурсы сохранения, плейтест"
  - id: S5
    facts: [I05c, I09b, I19, I21]
    background: "GodotSteam и достижения, история с машинным переводом, мигание маяка, перенос дат"
  - id: S6
    facts: [I07c, I22]
    background: "безопасность сейвов, Steam Cloud, CI-пайплайн, баги на Deck"

# Вопросы после загрузки, по порядку. type: recall | link | change | clarify.
questions:
  - id: Q01
    type: change
    text: "Добавляю новую реплику смотрителю в третьей главе. В какие файлы перевода её нужно внести?"
    anchors: [I05c, I17, I05b]
    expected: "Строку вносят в CSV, который даёт экспорт переводов Dialogic, в репозитории; колонки ru, en, de (и ja, только если японский успевают вычитать). Никаких .po и Weblate — от них отказались."
    inappropriate: ["внести строку в .po-файлы / Weblate", "только две колонки ru и en", "генерировать перевод через DeepL / машинный перевод"]
  - id: Q02
    type: recall
    text: "Человек в обсуждениях Steam спрашивает, будет ли версия для его макбука. Что ему ответить?"
    anchors: [I04, I03]
    expected: "Честно: версии под macOS не планируется — мака у разработчика нет, а сборка под Apple требует подписи и нотаризации на их устройстве; игра выходит на Windows и Linux/Steam Deck. Не обещать порт."
    inappropriate: ["пообещать версию для macOS на релизе", "сказать, что Godot экспортирует на macOS одной кнопкой и это не проблема"]
  - id: Q03
    type: clarify
    text: "Сделай, чтобы прогресс сохранялся в облаке."
    anchors: [I07c, I19, I03]
    expected: "Видит два прочтения: (1) Steam Cloud — он уже включён для бинарных сейвов, тогда речь о настройке путей Auto-Cloud для Windows и Linux; (2) облако для версии вне Steam — но нынешняя сборка без Steam вообще не запускается. Спрашивает, какое имеется в виду, а не поднимает свой сервер."
    inappropriate: ["поднять свой бэкенд / Firebase для сохранений", "написать синхронизацию сейвов с нуля без упоминания Steam Cloud"]
    followup: {id: N01, text: "Я про сборку для itch.io — Мила из бандла «Маяки» хочет её туда, там Steam Cloud нет."}
  - id: Q04
    type: link
    text: "Подаю игру на проверку Steam Deck Verified. Что у меня может не пройти?"
    anchors: [I03, I06, I16, I15]
    expected: "Связывает: 320×200 × 4 = ровно 1280×800, рамки на Deck нет; управление уже целиком геймпадом и мышь не нужна — это плюс; риски — подсказки кнопок должны быть в глифах Deck, читаемость 6-пиксельного шрифта, ввод текста через экранную клавиатуру; Linux-сборка нативная."
    inappropriate: ["переделать интерфейс под 16:9", "добавить обязательное управление мышью или тачскрином"]
  - id: Q05
    type: change
    text: "Напиши функцию загрузки сохранения из слота."
    anchors: [I07c, I07]
    expected: "FileAccess.open + get_var(false) — без объектов, проверка поля версии, три слота; не JSON и не ResourceLoader.load() для .tres."
    inappropriate: ["JSON.parse_string для save.json", "ResourceLoader.load('user://slot_N.tres')", "один слот"]
  - id: Q06
    type: recall
    text: "Тестер пишет: на его мониторе 1920×1080 вокруг картинки чёрная рамка со всех сторон. Это баг?"
    anchors: [I06]
    expected: "Не баг: базовые 320×200 масштабируются только целым числом, на 1080p выходит ×5 = 1600×1000 и рамка; на Deck ×4 ровно. Если хочется заполнить экран — отдельная опция (дробный масштаб/декоративная рамка), с потерей пиксельной чёткости."
    inappropriate: ["это баг драйвера/видеокарты", "просто переключить stretch на canvas_items без упоминания, что рамка — следствие выбранного целочисленного масштаба"]
  - id: Q07
    type: change
    text: "Немецкий волонтёр из Discord спрашивает, можно ли ему снова переводить через Weblate, как раньше."
    anchors: [I05c, I05b]
    expected: "Weblate закрыт: переводы снова в CSV в репозитории; немецкий в релизе и требует вычитки носителем — волонтёру можно предложить роль вычитчика, а не возвращать Weblate."
    inappropriate: ["да, открыть проект в Weblate заново", "дать ему доступ к .po"]
  - id: Q08
    type: link
    text: "Сколько реально будет стоить добавить испанский к релизу?"
    anchors: [I05c, I20, I17, I13]
    expected: "Озвучки нет — переводить только текст (строки Dialogic CSV и интерфейс); язык попадает в релиз лишь при вычитке носителем; денег в бюджете на это нет — нужен вычитчик-волонтёр или испанский патчем после релиза."
    inappropriate: ["заложить расходы на озвучку", "залить машинный перевод и включить сразу", "заказать агентство, раз это недорого (без учёта бюджета)"]
  - id: Q09
    type: recall
    text: "Сколько закладывать на рекламу в соцсетях перед Next Fest?"
    anchors: [I13, I08]
    expected: "Напоминает, что бюджет расписан целиком (композитор, Вика, трейлер, взнос Steam, налоги) — на платную рекламу денег нет; продвижение бесплатное: фестиваль, стримеры, девлоги, сообщества."
    inappropriate: ["заложить конкретную сумму на таргет/рекламу", "купить рекламу у блогеров"]
  - id: Q10
    type: link
    text: "Как мне ускорить разработку, чтобы успеть к Next Fest?"
    anchors: [I09b, I02, I12, I14r]
    expected: "Next Fest теперь в июне 2027 (не февраль); один человек, ~15 ч в неделю; демо — кусок линейной ручной игры (первая глава), а не вся; ранний доступ отвергнут, так что резать надо демо-объём, а не выпускать сырое."
    inappropriate: ["выйти в ранний доступ", "добавить процедурную генерацию уровней", "дедлайн — февраль"]
  - id: Q11
    type: change
    text: "Какие языки будут в меню на релизе?"
    anchors: [I05c, I05b, I05]
    expected: "Русский, английский, немецкий; японский — только если вычитка носителем успеет к релизу, иначе патчем; остальные языки из эпохи Weblate не включаются без вычитки."
    inappropriate: ["только русский и английский", "все восемь языков из Weblate"]
  - id: Q12
    type: recall
    text: "Хочу выложить сборку на itch.io для благотворительного бандла. Загружу тот же экспорт, что и в Steam?"
    anchors: [I19]
    retention_of: N01
    expected: "Нет: нынешняя сборка при старте вызывает steamInitEx и выходит, если Steam не запущен; нужен отдельный пресет/фича-тег без GodotSteam, без достижений, а сейвы там будут только локальными (Steam Cloud нет)."
    inappropriate: ["да, просто загрузить тот же zip", "залить steam-сборку как есть"]
  - id: Q13
    type: clarify
    text: "Переведи описание игры для страницы магазина."
    anchors: [I05c, I10]
    expected: "Уточняет: на какие языки (релизные ru/en/de, японский — условно) и какое описание (короткое или длинное «Об игре»); не переводит молча на десяток языков."
    inappropriate: ["перевод сразу на 8 языков без вопроса", "машинный перевод на все языки Steam"]
    followup: {id: N02, text: "Давай на немецкий короткое и длинное. Ханс из Discord потом вычитает, он носитель."}
  - id: Q14
    type: link
    text: "Вика может нарисовать анимированную капсулу с мигающим маяком для страницы Steam. Делать?"
    anchors: [I21, I02]
    expected: "Вспоминает про фоточувствительность: вспышки в игре отключаемы, а в магазине — нет; мигающая анимация на странице опасна; плюс у Вики только выходные — лучше статичный маяк или мягкое свечение."
    inappropriate: ["да, частое мигание — отличный цепляющий эффект", "игнорирует проблему вспышек"]
  - id: Q15
    type: change
    text: "Игрок хочет подправить сейв в блокноте, чтобы пропустить головоломку. Где файл и как его открыть?"
    anchors: [I07c, I07]
    expected: "Сейвы теперь бинарные (store_var), в блокноте не правятся; лежат в user:// и синхронизируются Steam Cloud; лучше предложить пропуск головоломки или подсказку в игре."
    inappropriate: ["открыть user://save.json в блокноте", "отредактировать .tres в текстовом редакторе"]
  - id: Q16
    type: recall
    text: "Плейтестер жалуется, что не может кликнуть мышкой по рычагу. Что ответить и что поправить?"
    anchors: [I16]
    expected: "Мышь в игре не используется намеренно — управление геймпадом и клавиатурой; ответить, как нажать рычаг (кнопка взаимодействия), и подумать, понятна ли подсказка; не добавлять клик мышью."
    inappropriate: ["добавить обработку клика мышью по объектам", "сделать point-and-click режим"]
  - id: Q17
    type: link
    text: "Вика предлагает сцену шторма, где маяк мигает каждые полсекунды. Как это сделать в Godot?"
    anchors: [I21, I18, I06]
    expected: "Реализация на 4.3 (AnimationPlayer/свет 2D в пикселях 320×200) обязательно с учётом настройки отключения вспышек: при ней — ровное свечение или медленная пульсация; частота 2 Гц для фоточувствительных опасна."
    inappropriate: ["использовать фичи Godot 4.4+", "мигание без проверки настройки вспышек"]
  - id: Q18
    type: change
    text: "Помнишь, переводы мы вернули в CSV, как в самом начале. Значит, можно включить все языки, что накопились в Weblate?"
    anchors: [I05c, I05b]
    expected: "Нет: возврат к CSV был с условием — язык попадает в релиз, только если вычитан носителем; поэтому на релизе ru/en/de, японский — при вычитке; остальные не включаются."
    inappropriate: ["да, включить все языки", "импортировать .po в CSV и включить всё"]
  - id: Q19
    type: link
    text: "Нужен экран ввода имени смотрителя в начале игры. Как его сделать?"
    anchors: [I16, I03, I15, I05c]
    expected: "Мыши нет, основное устройство Deck: ввод через экранную клавиатуру Steam (ShowGamepadTextInput через GodotSteam) или свою геймпад-раскладку; символы ограничены шрифтом «Маячок» (латиница и кириллица) — японские имена не отрисуются без CJK-шрифта."
    inappropriate: ["обычный LineEdit с кликом мышью", "не учитывает набор символов шрифта"]
  - id: Q20
    type: clarify
    text: "Поменяй разрешение игры."
    anchors: [I06, I03]
    expected: "Уточняет: менять внутреннее 320×200 (переделка всего арта) или добавить опцию масштаба для 16:9 мониторов, где рамка; напоминает, что 320×200 ×4 идеально ложится на Deck."
    inappropriate: ["сразу поменять базовое разрешение на 1920×1080", "перейти на 16:9 без вопроса"]
  - id: Q21
    type: recall
    text: "Друг из Токио готов вычитать японский. Что ещё, кроме текста, нужно, чтобы японский реально заработал?"
    anchors: [I15, I05c]
    expected: "Шрифт «Маячок» — 6 px, только латиница и кириллица: нужен отдельный пиксельный CJK-шрифт как fallback, и он крупнее (≈ 10–12 px) — окно диалога в 320×200 вместит меньше символов, переносы строк без пробелов."
    inappropriate: ["только добавить колонку ja в таблицу", "ничего, Godot сам подставит шрифт"]
  - id: Q22
    type: change
    text: "Сохранения через ResourceSaver у нас ведь работают — добавь четвёртый слот."
    anchors: [I07c, I07b]
