segment: S4
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [I10]
    text: |
      Открыл страницу в Steam, она висит как Coming Soon. Базовая цена в Steam — 12,99 $, региональные цены ставлю по рекомендации Steam, сам в этом не разберусь. Теперь капсулы. Вика спрашивает, какие размеры рисовать и что на них должно быть.
  - role: assistant
    facts: []
    text: |
      Обязательные графические ассеты страницы (размеры актуальны для Steamworks):

      | ассет | размер | где виден |
      |---|---|---|
      | Header capsule | 920×430 | верх страницы, списки |
      | Small capsule | 462×174 | поиск, списки — самый важный по охвату |
      | Main capsule | 1232×706 | главная витрина |
      | Vertical capsule | 748×896 | некоторые разделы витрины |
      | Page background | 1438×810 | фон страницы (необязателен) |
      | Library capsule | 600×900 | библиотека игрока |
      | Library hero | 3840×1240 | библиотека, без логотипа |
      | Library logo | 1280×720 (PNG с прозрачностью) | поверх hero |

      Советы для пиксель-арта:

      - Не растягивайте пиксельную картинку на 920×430 дробным масштабом — либо рисуйте ключевой арт отдельно в высоком разрешении, либо масштабируйте целым множителем и добивайте края фоном.
      - **Small capsule** при 462×174 должна читаться в миниатюре: только маяк и название, без мелких деталей. Проверьте, как она выглядит уменьшенной в 2 раза.
      - На капсулах только название игры — без слов «скоро», «скидка», наград и цитат (Valve отклоняет такие капсулы).
  - role: user
    facts: [I11]
    text: |
      Передал Вике таблицу. Про вишлисты: вишлистов сейчас около 1800, это за три недели со страницей. Цель до Next Fest — 7000. Реально?
  - role: assistant
    facts: []
    text: |
      Реально, но не сам собой. 1800 за три недели — хороший старт, обычно после первого всплеска (анонс, посты) приток падает до десятков в день. Чтобы дойти до 7000 к фестивалю, нужны регулярные поводы:

      - **Фестивали и витрины** помимо Next Fest: тематические Steam-фестивали (головоломки, уютные игры, пиксель-арт), онлайн-витрины инди. Подаваться везде, где бесплатно.
      - **Девлоги и гифки** в соцсетях — по одному короткому визуальному посту в неделю: механизм маяка, бормотание, смена погоды.
      - **Стримеры и ютуберы**, которые играют в атмосферные головоломки: личное письмо + ключ демо, когда оно будет.
      - **Тематические сообщества** (Reddit: r/indiegaming, r/PixelArt, r/puzzlevideogames) — с уважением к правилам о самопиаре.

      И отслеживайте источники в Steamworks → UTM-ссылки: сразу видно, какой канал приносит вишлисты, а какой — только лайки.
  - role: user
    facts: [I13]
    text: |
      Стримеры — это интересно. Посчитал свой бюджет на всю игру: 300 тыс. ₽. Из них 180 тыс. — Олегу за музыку, 60 тыс. — Вике (она отказывается работать бесплатно, и правильно), 40 тыс. — монтажёру трейлера, остальное — взнос Steam Direct и запас на налоги. Больше взять неоткуда, кредиты на игру брать не буду.
  - role: assistant
    facts: []
    text: |
      Расклад трезвый. Пара комментариев:

      - **Взнос Steam Direct** — 100 $ за игру, возвращается после 1000 $ выручки. Демо и плейтест создаются внутри страницы игры и отдельного взноса не требуют.
      - **Налоги**: правильно, что запас есть — Steam удерживает налог по форме, которую вы заполните в Steamworks, а в своей стране тоже придётся декларировать доход. Тут лучше один раз проконсультироваться с бухгалтером, чем потом разбираться.
      - **Трейлер** за 40 тыс. — разумная трата: трейлер — главный инструмент страницы, его смотрят чаще, чем читают описание.

      Всё остальное продвижение, получается, держится на вашем времени — значит, к девлогам и письмам стримерам стоит относиться как к задачам в плане, а не «когда останется время».
  - role: user
    facts: [I07b]
    text: |
      Понял. Вернусь к коду. JSON мне надоел: то float вместо int, то забыл поле. Сохранения перевёл на Resource: класс SaveGame, ResourceSaver пишет user://slot_N.tres, слотов стало три — тестеры просили. Глянь, нормально сделано?

      ```gdscript
      class_name SaveGame
      extends Resource

      @export var chapter: int = 1
      @export var room: String = ""
      @export var flags: Dictionary = {}
      @export var playtime_sec: float = 0.0
      ```
  - role: assistant
    facts: []
    text: |
      Сделано нормально, и типизация через `@export` действительно избавляет от проблем с `float`. Менеджер слотов:

      ```gdscript
      # autoload/save_manager.gd
      extends Node

      const SLOTS := 3

      func slot_path(i: int) -> String:
          return "user://slot_%d.tres" % i

      func save_slot(i: int, room: String) -> void:
          var s := SaveGame.new()
          s.chapter = GameState.chapter
          s.flags = GameState.to_dict()["flags"]
          s.room = room
          s.playtime_sec = GameState.playtime
          var err := ResourceSaver.save(s, slot_path(i))
          if err != OK:
              push_error("save failed: %s" % err)

      func load_slot(i: int) -> SaveGame:
          if not ResourceLoader.exists(slot_path(i)):
              return null
          return ResourceLoader.load(slot_path(i), "", ResourceLoader.CACHE_MODE_IGNORE)
      ```

      `CACHE_MODE_IGNORE` важен: без него при повторной загрузке того же слота вы получите закэшированный объект, а не то, что на диске.

      Старые `save.json` у тестеров: при первом запуске можно один раз сконвертировать их в `slot_1.tres` и переименовать в `save.json.bak`.
  - role: user
    facts: [I14, I14r]
    text: |
      Конвертацию сделал. Теперь тестирование. Хочу закрытый плейтест через Steam Playtest, лимит 200 человек — больше я фидбека просто не переварю. И сразу скажу: ранний доступ отвергли. Мне уже советовали в чате «выходи в ранний доступ, будут деньги». Но игра сюжетная и линейная, недоделанный сюжет в раннем доступе только испортит впечатление — люди пройдут половину истории и уйдут с ощущением, что это всё.
  - role: assistant
    facts: []
    text: |
      С ранним доступом согласен: для линейной сюжетной игры он работает плохо — первые впечатления и отзывы формируются на неполной истории, а вернуться «досмотреть» мало кто приходит.

      Steam Playtest — хороший инструмент для вашей задачи:

      - Создаётся в Steamworks как **отдельное приложение** (кнопка «Create Playtest» на странице игры). У него свой App ID и свои депо — сборки заливаются туда отдельно.
      - Игроки нажимают «Запросить доступ» на странице игры, вы выдаёте доступ партиями — можно ровно 200, остальные ждут.
      - Отзывов и обзоров у плейтеста нет, страницу магазина он не трогает.
      - Плейтест можно закрыть в любой момент.

      Что спрашивать у тестеров (через короткую форму после главы):

      1. На какой головоломке застряли и сколько минут.
      2. Понятны ли подсказки кнопок.
      3. Где пропал интерес.
      4. На каком устройстве играли (Deck / Windows / Linux) — у вас это важно.
  - role: user
    facts: []
    text: |
      Плейтест создал, App ID у него действительно другой. Первая партия — 50 человек, посмотрю, что скажут.
