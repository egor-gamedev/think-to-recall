segment: S1
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [I01]
    text: |
      Привет. Есть пет-проект, который пора превращать в нормальную игру. Рабочее название «Смотритель» — 2D пиксельная головоломка-адвенчура про смотрителя маяка: ходишь по маяку и острову, чинишь механизмы, по ходу раскрывается история прошлых смотрителей. Движок Godot 4.3, весь код на GDScript, C# не используем и не будем — не хочу тащить .NET-сборку ради пары удобств.

      Сейчас в проекте бардак: всё в корне, сцены вперемешку со скриптами. С чего начать наводить порядок?
  - role: assistant
    facts: []
    text: |
      Начать стоит со структуры папок — в Godot её потом больно менять, потому что пути зашиты в сцены (хотя редактор и умеет обновлять зависимости при перемещении через FileSystem dock — двигайте файлы только оттуда, не из проводника).

      Вариант, который хорошо живёт в небольших проектах — «по фичам», а не «по типам файлов»:

      ```
      res://
        autoload/          # синглтоны: GameState, SaveManager, Audio
        actors/
          player/          # player.tscn, player.gd, анимации
          npc/
        world/
          lighthouse/      # комнаты маяка
          island/
        puzzles/           # механизмы: шестерни, клапаны, линзы
        ui/
        assets/
          fonts/
          sfx/
          music/
        localization/
      ```

      Скрипт лежит рядом со сценой, которой он принадлежит: `actors/player/player.gd` рядом с `player.tscn`. Тогда при переносе фичи в другую папку она переезжает целиком.

      Ещё два правила, которые экономят нервы:

      1. Имена файлов — `snake_case`, имена классов (`class_name`) — `PascalCase`. Godot на Windows не различает регистр в путях, а на Linux различает, и сборка, которая работала у вас, может упасть на Linux-машине из-за `Player.tscn` vs `player.tscn`.
      2. Всё, что должно жить между сценами (прогресс, настройки), — в автозагрузках, а не в статических переменных узлов.

      Что у вас сейчас в автозагрузках?
  - role: user
    facts: []
    text: |
      Про регистр — хорошее замечание, у меня как раз была история с Lever.tscn. В автозагрузках пока только GameState: там флаги вроде «починил насос» и номер текущей главы. Ещё хочу Audio и что-то для сохранений.
  - role: assistant
    facts: []
    text: |
      Нормальный старт. Пара советов по GameState, пока он маленький:

      ```gdscript
      # autoload/game_state.gd
      extends Node

      signal flag_changed(flag: StringName, value: bool)

      var chapter: int = 1
      var _flags: Dictionary = {}

      func set_flag(flag: StringName, value: bool = true) -> void:
          if _flags.get(flag, false) == value:
              return
          _flags[flag] = value
          flag_changed.emit(flag, value)

      func has_flag(flag: StringName) -> bool:
          return _flags.get(flag, false)

      func to_dict() -> Dictionary:
          return {"chapter": chapter, "flags": _flags.duplicate()}

      func from_dict(d: Dictionary) -> void:
          chapter = d.get("chapter", 1)
          _flags = d.get("flags", {})
      ```

      Смысл: снаружи никто не лезет в словарь напрямую, все изменения идут через `set_flag`, а на сигнал `flag_changed` можно повесить, например, открытие двери, которая зависит от насоса. И сразу заложены `to_dict`/`from_dict` — сохранения потом будут просто сериализовать этот словарь, в каком бы формате вы их ни писали.

      Флаги лучше называть `StringName` с префиксом главы: `&"ch1_pump_fixed"`. Когда флагов станет двести, префикс сильно помогает.
  - role: user
    facts: [I02]
    text: |
      Сделаю так. Чтобы ты понимал контекст: код, геймдизайн и тексты делаю один, получается около 15 часов в неделю — днём я бэкендер на основной работе, игра по вечерам и в выходные. Арт рисует сестра Вика, но тоже по выходным. Музыку пишет композитор по договору, с ним отдельная история. Так что всё, что требует ежедневного внимания, мне не подходит.

      Теперь про игрока. Сейчас у меня в player.gd огромный match по состояниям, и он уже на 400 строк. Как разнести?
  - role: assistant
    facts: []
    text: |
      При 15 часах в неделю главное — чтобы код можно было открыть через неделю перерыва и сразу понять. Огромный `match` как раз этому мешает.

      Для платформера/адвенчуры хорошо работает машина состояний на узлах: каждое состояние — дочерний узел со своим скриптом.

      ```gdscript
      # actors/player/state.gd
      class_name PlayerState
      extends Node

      var player: Player

      func enter(_prev: StringName) -> void: pass
      func exit() -> void: pass
      func physics_update(_delta: float) -> StringName:
          return &""   # пустое имя = остаёмся в этом состоянии
      ```

      ```gdscript
      # actors/player/state_machine.gd
      extends Node

      @export var initial: PlayerState
      var current: PlayerState

      func _ready() -> void:
          for s in get_children():
              s.player = owner
          current = initial
          current.enter(&"")

      func _physics_process(delta: float) -> void:
          var next := current.physics_update(delta)
          if next != &"":
              var prev := current.name
              current.exit()
              current = get_node(NodePath(next))
              current.enter(prev)
      ```

      Состояния: `Idle`, `Walk`, `Climb` (лестницы в маяке), `Interact` (когда крутим вентиль — игрок заблокирован), `Cutscene`. Каждое — 30–80 строк, и баг в лазании по лестнице ищется в одном файле, а не в 400 строках.

      Переход на `Interact` удобно делать по сигналу от механизма, а не опросом: механизм говорит «меня начали крутить», игрок уходит в состояние и ждёт сигнала «закончили».
  - role: user
    facts: []
    text: |
      Понял, переделаю на выходных. Ещё вопрос: камера дёргается, когда игрок идёт медленно. Камера — Camera2D с position_smoothing, следит за игроком.
  - role: assistant
    facts: []
    text: |
      Классическая история для пиксель-арта: игрок стоит на дробной координате (например, x = 103.4), камера сглаживается к другой дробной координате, и при отрисовке спрайт и фон округляются по-разному — получается дрожание на 1 пиксель.

      Что проверить по порядку:

      1. Project Settings → Rendering → 2D → **Snap 2D Transforms to Pixel** и **Snap 2D Vertices to Pixel** — включить.
      2. Физику и камеру — в одном цикле. У Camera2D свойство `process_callback` поставьте в `Physics`, раз игрок двигается в `_physics_process`.
      3. Если включено сглаживание — оно и есть главный источник дробных позиций. Попробуйте без него: в головоломке с маленькими комнатами жёсткая привязка часто выглядит даже лучше.
      4. Физический тикрейт и частота монитора: если игра на 60 Гц физики, а монитор 144 Гц, будет микрорывок. Это лечится интерполяцией физики (`physics/common/physics_interpolation`) — проверьте, есть ли она для 2D в вашей версии, и включайте, только если первые пункты не помогли.

      Обычно хватает первых двух пунктов.
  - role: user
    facts: [I18]
    text: |
      Включил снап и Physics у камеры — дёрганье ушло, спасибо. Интерполяция в 4.3 есть, но пока не трогаю. И сразу правило на будущее: движок заморожен на Godot 4.3 до релиза. На 4.4 и новее не переходим, даже если там что-то вкусное выйдет. Я уже раз обжёгся на переходе 4.1 → 4.2 с поломанными тайлмапами, второй раз на финишной прямой не хочу.
  - role: assistant
    facts: []
    text: |
      Разумно. Заморозка движка перед релизом — стандартная практика, особенно для соло-разработки: любой апгрейд — это неделя на «что сломалось», а неделя у вас — это 15 часов.

      Чтобы заморозка была настоящей, а не на словах:

      - зафиксируйте точную версию в README (`4.3.stable`) и держите бинарник редактора и export templates именно этой версии в отдельной папке;
      - в CI (если будет) тоже скачивайте конкретно 4.3, а не «последний стабильный»;
      - плагины из Asset Library ставьте версии, совместимые с 4.3, и не обновляйте их бездумно — некоторые уже требуют 4.4.

      Если в 4.4+ выйдет критичный для вас фикс, обычно есть два пути: найти обход в 4.3 или собрать 4.3 с бэкпортом коммита из исходников. Второе — крайняя мера.
  - role: user
    facts: [I03, I03r]
    text: |
      Про шаблоны экспорта — да, положу рядом. Теперь про платформы. Платформы такие: Windows и нативная Linux-сборка. Главная цель — значок Steam Deck Verified, Deck у меня есть и это основное тестовое устройство: играю на нём в электричке, там же ловлю баги.

      Про Nintendo Switch думал и отказался: Godot не экспортирует на консоли сам, нужен сторонний портер, а денег на портер нет. Может, когда-нибудь потом, если игра выстрелит.
  - role: assistant
    facts: []
    text: |
      Хорошая связка: Deck — это по сути Linux, так что нативная Linux-сборка и Deck проверяют друг друга. Несколько практических вещей:

      1. **Экспорт под Linux** в 4.3 — пресет `Linux/X11` (он же работает и на Deck в режиме игры). Архитектура `x86_64`. Включите встраивание PCK в бинарник — меньше файлов, меньше шансов, что депо Steam соберётся без `.pck`.
      2. **Рендерер.** На Deck для 2D пиксельной игры спокойно хватает `Compatibility` (OpenGL 3.3 / GLES3) — он легче, быстрее стартует и меньше греет. `Forward+` тут не нужен. Проверьте только, что эффекты (свет маяка, шейдеры) выглядят одинаково — между рендерерами бывают отличия в 2D-освещении.
      3. **Требования Deck Verified**, которые чаще всего роняют проверку:
         - игра запускается и работает без клавиатуры и мыши;
         - подсказки кнопок показываются в стиле контроллера Deck;
         - текст читаем на экране 7 дюймов (Valve ориентируется на минимум около 9 px по высоте в нативном разрешении 1280×800);
         - если нужен ввод текста — открывается экранная клавиатура;
         - стандартное разрешение 1280×800 (16:10) или 1280×720 поддерживается.
      4. **Proton не нужен** — если есть нативная Linux-сборка, Steam запустит её. Но на всякий случай проверьте и Windows-сборку через Proton: часть игроков на Deck принудительно включает Proton, и баги там другие.

      По Switch — да, порт через стороннего портера (на W4 Games или других студиях) стоит денег и требует dev-kit, так что отложить правильно.
  - role: user
    facts: [I04]
    text: |
      Рендерер — да, у меня как раз Compatibility. Про Proton понял, проверю. В Steamworks галочки поставил только Windows и Linux, третью оставил пустой. Мака у меня нет и не будет, покупать железку ради одной платформы не стану — я даже не знаю, как там что устроено. Ты говорил, там ещё подпись какая-то нужна?
  - role: assistant
    facts: []
    text: |
      Да. Для Apple-платформы Godot сам по себе экспорт умеет, но чтобы игру можно было запустить без танцев, приложение нужно подписать сертификатом разработчика Apple (платная подписка, около 99 $ в год) и отправить на нотаризацию. Нотаризация делается инструментами Xcode — то есть на их же устройстве. Из Windows это либо очень неудобно, либо через сторонние сервисы сборки.

      Без подписи и нотаризации игрок получит предупреждение «приложение повреждено или от неустановленного разработчика», и большая часть людей на этом остановится. Так что ваше решение оставить только две галочки согласовано с тем, какое у вас железо.

      Пока вернёмся к тому, что есть. Что дальше по плану — локализация или уровни?
  - role: user
    facts: [I05]
    text: |
      Локализация, она у меня самая сырая. Хочу так: переводы храню в CSV-таблице в репозитории, языки — русский и английский. Английский перевожу сам, он у меня рабочий. Тексты пишу сначала по-русски. Как правильно завести CSV в Godot?
  - role: assistant
    facts: []
    text: |
      В Godot это делается просто: CSV импортируется как набор переводов.

      Формат файла `localization/strings.csv`:

      ```csv
      keys,ru,en
      MENU_NEW_GAME,Новая игра,New game
      MENU_CONTINUE,Продолжить,Continue
      HINT_INTERACT,"Нажмите {button}, чтобы осмотреть","Press {button} to inspect"
      CH1_PUMP_BROKEN,"Насос молчит. Похоже, сорвало шток.","The pump is silent. Looks like the rod snapped."
      ```

      Первая колонка — ключ, дальше по колонке на локаль. Ячейки с запятыми — в кавычках.

      После сохранения Godot сам импортирует файл и создаст `strings.ru.translation` и `strings.en.translation`. Их нужно добавить в Project Settings → Localization → Translations.

      В коде:

      ```gdscript
      label.text = tr("CH1_PUMP_BROKEN")
      hint.text = tr("HINT_INTERACT").format({"button": InputGlyphs.for_action("interact")})
      ```

      А узлы `Label`/`Button` с текстом-ключом в свойстве `text` переводятся автоматически (auto translate включён по умолчанию).

      Смена языка:

      ```gdscript
      TranslationServer.set_locale("en")
      ```

      Пара советов на будущее:

      - Ключи — по смыслу, а не по тексту (`CH1_PUMP_BROKEN`, а не `NASOS_MOLCHIT`), тогда правка русской фразы не ломает ключ.
      - Оставляйте плейсхолдеры `{button}`, а не склейку строк: в другом языке порядок слов может быть другим.
      - Длину строк держите в голове с самого начала — при маленьком базовом разрешении каждый символ на счету, а русский обычно на 15–25 % длиннее английского, так что верстайте окна под русский.
  - role: user
    facts: []
    text: |
      Ок, ключи по смыслу — то, что надо. Русский длиннее, это я уже вижу по кнопкам меню. На сегодня всё, пойду переделывать игрока на состояния.
