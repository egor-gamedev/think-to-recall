segment: S3
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [I12]
    text: |
      Прошёл месяц. Первая глава почти собрана. Для понимания объёма: игра линейная, около 5 часов, 4 главы. Все уровни и головоломки собраны вручную, процедурной генерации нет и не будет — каждая головоломка завязана на сюжет комнаты. Сейчас застрял на звуке: музыка, эффекты, всё в одну кучу, громкость не регулируется отдельно.
  - role: assistant
    facts: []
    text: |
      Нужно разнести звук по шинам (Audio Buses) — это делается один раз и дальше просто работает.

      Схема для вашей игры:

      ```
      Master
       ├─ Music
       ├─ SFX
       │   └─ Ambience   (волны, ветер, скрип маяка)
       └─ Voice          (бормотание персонажей, если будет)
      ```

      В редакторе: вкладка Audio внизу → Add Bus, сохраняется в `default_bus_layout.tres`. Каждому `AudioStreamPlayer` указываете свойство `bus`.

      Регулятор громкости в меню:

      ```gdscript
      func set_bus_volume(bus_name: String, linear: float) -> void:
          var idx := AudioServer.get_bus_index(bus_name)
          AudioServer.set_bus_volume_db(idx, linear_to_db(clamp(linear, 0.0, 1.0)))
          AudioServer.set_bus_mute(idx, linear <= 0.001)
      ```

      Ползунок — в линейной шкале 0…1, а в шину отдаёте децибелы через `linear_to_db`, иначе половина хода ползунка будет почти тишиной.

      Для эмбиента маяка пригодится эффект на шине: лёгкий `AudioEffectReverb` на `Ambience`, когда игрок внутри башни, и выключенный снаружи. Переключать можно `AudioServer.set_bus_effect_enabled`.
  - role: user
    facts: [I20]
    text: |
      Сделал шины, работает. Отдельной шины Voice можно назвать по-другому — озвучки нет: только текст и «бормотание», звуки-слоги для каждого персонажа, как в Undertale или Animal Crossing. У смотрителя низкое «бу-бу», у девочки с острова — высокие щелчки. Как сделать, чтобы бормотание шло синхронно с появлением букв?
  - role: assistant
    facts: []
    text: |
      Тогда шину честно назовём `Babble`. В Dialogic 2 у персонажа есть «Typing Sounds» — это ровно то, что нужно: звук проигрывается при появлении символов.

      Если хочется гибче, чем встроенное, можно сделать своё, подписавшись на появление букв:

      ```gdscript
      # ui/babble.gd
      extends AudioStreamPlayer

      @export var sounds: Array[AudioStream]
      @export var every_n_chars := 2
      @export var pitch_jitter := 0.08
      var _count := 0

      func on_char(ch: String) -> void:
          if ch.strip_edges() == "" or ".,!?…".contains(ch):
              return
          _count += 1
          if _count % every_n_chars != 0:
              return
          stream = sounds.pick_random()
          pitch_scale = 1.0 + randf_range(-pitch_jitter, pitch_jitter)
          play()
      ```

      Советы:

      - Не играйте звук на каждой букве — каждая вторая или третья звучит естественнее.
      - Пропускайте пробелы и знаки препинания — на них возникает пауза, и речь получает ритм.
      - Небольшой случайный pitch убирает эффект «пулемёта».
      - Бормотание на разных языках будет звучать одинаково — в этом и прелесть: никакой локализации звука не нужно.
  - role: user
    facts: [I15]
    text: |
      Бормотание — огонь, Вика смеялась полчаса. Ещё про текст. Шрифт «Маячок» Вика нарисовала сама в BitFontMaker — высота 6 пикселей, моноширинный. В нём только латиница и кириллица, мы рисовали ровно те символы, что нужны для двух наших языков, плюс цифры и пунктуация. Как правильно подключить его, чтобы не мылился?
  - role: assistant
    facts: []
    text: |
      BitFontMaker отдаёт TTF, и в Godot 4.3 пиксельный TTF подключается так:

      1. В импорте шрифта (вкладка Import у `.ttf`):
         - `Antialiasing` → **None**;
         - `Hinting` → **None**;
         - `Subpixel Positioning` → **Disabled**;
         - `Generate Mipmaps` → выкл.
      2. Размер шрифта в теме — ровно та высота, на которую он рисовался (у пиксельных TTF это часто 8 или 16 «юнитов» на 6 пикселей глифа — подберите так, чтобы один пиксель глифа совпал с одним пикселем экрана 320×200).
      3. Сделайте `Theme` для всего UI и укажите шрифт как `default_font`, чтобы не назначать его каждому Label.

      Проверка: сделайте скриншот при масштабе ×1 и увеличьте — каждый пиксель буквы должен быть ровно одним пикселем, без полутонов.

      Высота 6 px при ×4 на Deck даёт 24 физических пикселя — с читаемостью проблем не будет.
  - role: user
    facts: [I05b]
    text: |
      Теперь большое изменение. В Discord пришли люди, которые хотят перевести игру, и я решил открыть перевод. Перешли на gettext .po и Weblate: волонтёры переводят на немецкий, французский, испанский, португальский (бразильский), японский и китайский упрощённый. Вместе с русским и английским языков стало 8. CSV для такого неудобен — Weblate с ним работает плохо, а с .po отлично. Как Godot дружит с .po?
  - role: assistant
    facts: []
    text: |
      Хорошо дружит: Godot 4 импортирует `.po` напрямую, а шаблон `.pot` умеет генерировать сам.

      Схема:

      1. **Project Settings → Localization → POT Generation**: добавьте сцены и скрипты, где есть строки, и нажмите «Generate POT». Получится `localization/messages.pot` — источник для Weblate.
      2. Каждый язык — свой файл: `de.po`, `fr.po`, `ja.po` и т. д. Их добавляете в список Translations, как раньше CSV.
      3. В Weblate компонент настраивается на репозиторий: `localization/*.po`, шаблон `messages.pot`, формат «gettext PO». Weblate сам будет делать коммиты (или pull request) с переводами.

      Сложное место — **Dialogic**. Он экспортирует только CSV. Варианты:

      - конвертировать CSV Dialogic в `.po` скриптом при каждом обновлении таймлайнов, а результаты Weblate превращать обратно в CSV;
      - или держать диалоги отдельным компонентом Weblate в формате CSV (Weblate умеет «CSV file (multi-language)», хотя и капризничает).

      Первый путь стабильнее. Набросок конвертера:

      ```python
      # tools/dialogic_csv_to_po.py
      import csv, sys, polib
      src = csv.DictReader(open(sys.argv[1], encoding="utf-8"))
      pot = polib.POFile()
      for row in src:
          pot.append(polib.POEntry(msgctxt=row["keys"], msgid=row["ru"], msgstr=""))
      pot.save(sys.argv[2])
      ```

      `msgctxt` = ключ Dialogic, чтобы одинаковые фразы в разных местах не склеивались.
  - role: user
    facts: []
    text: |
      Сделал конвертер, пустил его в pre-commit. Weblate уже подхватил. Японский взял парень по нику kuroshio, обещает за месяц. Китайский пока никто не взял.
  - role: assistant
    facts: []
    text: |
      Отлично, что японский взяли. Для волонтёрских переводов в Weblate полезно сразу настроить:

      - **Проверки качества**: плейсхолдеры `{button}` должны сохраняться, максимальная длина строки (флаг `max-length:N` — особенно важно при 320×200), одинаковая пунктуация в конце.
      - **Глоссарий** с именами персонажей и названиями механизмов, чтобы «линза Френеля» не переводилась пятью способами.
      - **Скриншоты** к строкам — Weblate позволяет приложить картинку; переводчику, который не видел игру, это сильно помогает.
      - **Роль ревьюера**: хотя бы один человек на язык, который одобряет переводы. Иначе в релиз уйдёт всё, что вписали.
  - role: user
    facts: [I08]
    text: |
      Ок. Ещё деловой вопрос, юридический. Подписали договор с композитором Олегом. Права на музыку остаются у него, у игры неисключительная лицензия на использование музыки. Продавать саундтрек отдельно — только с его согласия, и тогда 50 % ему. Это нормальные условия?
  - role: assistant
    facts: []
    text: |
      Да, для инди это распространённая модель: композитор сохраняет права и может, например, использовать треки в портфолио или выпустить свой альбом, а вы получаете право использовать музыку в игре.

      На что обратить внимание в формулировках:

      - **Что входит в «использование в игре».** Трейлеры, геймплейные ролики, стримы и видео игроков — обычно покрываются, но лучше, чтобы это было прописано явно: «в игре и в материалах для её продвижения». Иначе трейлер с музыкой формально может оказаться вне лицензии.
      - **Срок и территория.** Неисключительная лицензия должна быть бессрочной и на весь мир — иначе через пять лет может возникнуть вопрос.
      - **Content ID.** Если Олег зарегистрирует треки в системах вроде YouTube Content ID, стримеры будут получать претензии. Хорошо бы договориться, что он не регистрирует музыку игры или добавляет в белый список.
      - **Порты и переиздания** — покрываются ли (на случай Switch через годы).

      По 50 % от продажи саундтрека — справедливо, это стандартная цифра.
  - role: user
    facts: [I08r]
    text: |
      Про Content ID спрошу, хороший пункт. И ещё: на меня вышел издатель «Пиксель Хаус». Предлагали деньги на маркетинг, но просили 30 % выручки и права на IP и сиквелы. Издателя «Пиксель Хаус» я отверг. Отдавать персонажей и мир, который мы с Викой придумали, — нет.
  - role: assistant
    facts: []
    text: |
      Понимаю решение. 30 % выручки — само по себе в пределах нормы для издательской сделки, но передача прав на IP и сиквелы — это то, на что инди-разработчики соглашаются, когда без денег издателя проект не выйдет вообще. Если игра доходит до релиза и без них, сохранить мир за собой — сильная позиция.

      На будущее, если появятся другие предложения, полезно сравнивать их не только по проценту:

      - есть ли аванс (минимальная гарантия) и окупается ли он из вашей доли;
      - на какой срок права и на какие платформы;
      - что издатель реально делает: маркетинг, локализация, QA, порты на консоли;
      - кто владеет страницей Steam и вишлистами.

      Иногда издатели соглашаются на сделку только по выручке, без IP, — переговоры возможны.
  - role: user
    facts: []
    text: |
      Посмотрим, если будут ещё. Пока всё, kuroshio уже прислал первые 200 строк японского.
