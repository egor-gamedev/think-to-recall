segment: S5
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [I19]
    text: |
      Подключаю Steam. Поставил GodotSteam как GDExtension (версию под 4.3). В автозагрузке при старте сделал как в доке GodotSteam, чтоб не было пиратских запусков:

      ```gdscript
      # autoload/steam_boot.gd
      extends Node

      func _ready() -> void:
          var res: Dictionary = Steam.steamInitEx()
          if res["status"] != Steam.STEAM_API_INIT_RESULT_OK:
              push_error("Steam init: %s" % res["verbal"])
              get_tree().quit()
      ```

      Отдельного пресета экспорта без Steam у меня нет, пресеты только Windows и Linux. Теперь хочу достижения. Как их правильно заводить?
  - role: assistant
    facts: []
    text: |
      Достижения сначала заводятся в Steamworks: App Admin → Stats & Achievements → Achievements. У каждого — **API Name** (например, `ACH_CH1_PUMP`), отображаемое имя и описание на каждом языке, две иконки (открытое и закрытое, 256×256). После изменений — **Publish** в разделе Publish, иначе клиент их не увидит.

      В игре:

      ```gdscript
      # autoload/achievements.gd
      extends Node

      func unlock(api_name: String) -> void:
          var st: Dictionary = Steam.getAchievement(api_name)
          if st.get("achieved", false):
              return
          Steam.setAchievement(api_name)
          Steam.storeStats()
      ```

      И не забудьте вызывать коллбэки Steam каждый кадр — без этого `storeStats` и оверлей работают через раз:

      ```gdscript
      func _process(_delta: float) -> void:
          Steam.run_callbacks()
      ```

      Для отладки: `Steam.resetAllStats(true)` сбрасывает все достижения у вашего аккаунта. Удобно вынести в отладочное меню, но убедитесь, что в релизной сборке его нет.

      Связать с сюжетом удобно через уже существующий сигнал `GameState.flag_changed`: на нужные флаги — `Achievements.unlock(...)`.
  - role: user
    facts: []
    text: |
      Повесил на flag_changed, 24 достижения уже в Steamworks. Сброс спрятал за фича-тегом debug. Теперь неприятная история с переводами.

      Немецкий волонтёр в Weblate за ночь «перевёл» 3000 строк. Немец из Discord открыл игру и сказал, что это машинный перевод DeepL, местами смешной, местами просто неправильный — «Насос молчит» стало чем-то про молчаливого насоса-человека. И ревьюера на немецком у нас не было, всё ушло в репозиторий.
  - role: assistant
    facts: []
    text: |
      Неприятно, но лучше сейчас, чем в отзывах после релиза. Что можно сделать сразу:

      1. **Откатить** немецкие строки в репозитории до состояния до этого коммита Weblate (у Weblate коммиты с автором, их легко найти).
      2. **Заблокировать** компонент или язык в Weblate, пока не решите, как дальше.
      3. **Вывод на будущее**: без ревьюера-носителя на каждый язык любые волонтёрские переводы — лотерея. Weblate умеет требовать одобрения (режим «Reviewers»), но для этого нужен человек, которому вы доверяете.

      И вопрос к вам: кто из волонтёров реально носитель и готов проверять чужое? От этого зависит, какие языки вообще стоит держать.
  - role: user
    facts: [I05c]
    text: |
      Подумал два вечера. Решение: Weblate закрыли и вернулись к CSV в репозитории, как было в самом начале, — но с условием. Язык попадает в релиз, только если перевод вычитан носителем. На релизе будут русский, английский и немецкий — Ханс из Discord, тот самый, что поймал DeepL, согласился вычитать немецкий. Японский — если успеет вычитка у kuroshio, иначе выйдет патчем. Остальные языки пока замораживаю. Конвертер в .po выкидываю, Dialogic снова пишет CSV напрямую.
  - role: assistant
    facts: []
    text: |
      Решение здравое для одного человека: меньше инструментов, меньше мест, где что-то может сломаться, и правило «без носителя — не в релиз» защищает от повторения.

      Чтобы правило выполнялось само, а не на честном слове:

      - Заведите в репозитории файл `localization/languages.cfg`:

        ```ini
        [release]
        enabled = ["ru", "en", "de"]
        [pending]
        ja = "ждём вычитку"
        ```

      - Меню выбора языка строит список **только** из `enabled`:

        ```gdscript
        var cfg := ConfigFile.new()
        cfg.load("res://localization/languages.cfg")
        for loc in cfg.get_value("release", "enabled"):
            lang_option.add_item(TranslationServer.get_locale_name(loc))
        ```

      - Колонки языков, которые не в `enabled`, могут спокойно жить в CSV — игрок их просто не увидит.

      Тогда включение японского — это одна строчка в конфиге, когда kuroshio закончит.

      Из Weblate перед закрытием выгрузите последние `.po` в архив — переводы на французский и испанский могут пригодиться потом, если найдутся вычитчики.
  - role: user
    facts: [I21]
    text: |
      Конфиг завёл. Следующее — опция отключения вспышек, она обязательна. Свет маяка мигает: каждые несколько секунд луч проходит по экрану и даёт белую вспышку. А у одного из тестеров фоточувствительная эпилепсия — он сам написал после плейтеста, хорошо, что ничего не случилось. Как это сделать правильно?
  - role: assistant
    facts: []
    text: |
      Важно, что вы это делаете. Рекомендации:

      1. **Опция в настройках** «Уменьшить вспышки» (Reduce flashing) и — лучше — **вопрос при первом запуске** до того, как игрок увидит первую сцену с маяком. Предупреждение о фоточувствительности на старте — хорошая практика.
      2. **Что делать при включённой опции:** не просто убирать эффект, а заменять — вместо белой вспышки плавное усиление света с длительностью ≥ 0,5 с и малым контрастом. Атмосфера сохраняется.
      3. **Частота.** Ориентир из рекомендаций по доступности (WCAG): не больше трёх вспышек в секунду в любом режиме, а большие яркие красные вспышки избегать совсем.
      4. **Реализация** — одна точка правды:

      ```gdscript
      # autoload/settings.gd
      var reduce_flashing := false

      # world/lighthouse/beam.gd
      func flash() -> void:
          if Settings.reduce_flashing:
              $Anim.play("glow_soft")
          else:
              $Anim.play("flash")
      ```

      Проверяйте каждую новую сцену с эффектами по этой настройке — штормы, молнии, искры от механизмов.
  - role: user
    facts: [I09b]
    text: |
      Сделал и вопрос при первом запуске, и мягкий вариант. Теперь грустное. Next Fest перенесён на июнь 2027 — демо не успевает к февралю: вся эта история с переводами и сейвами съела месяц, плюс на работе релиз. Релиз 1.0 сдвинут на сентябрь 2027. Пересобрал план в таблице.
  - role: assistant
    facts: []
    text: |
      Сдвиг разумный: выходить на Next Fest с сырым демо хуже, чем выйти позже с хорошим, — фестиваль даёт один шанс на первое впечатление, а вишлисты, накопленные до него, работают на старт.

      Что стоит сделать в связи с переносом:

      - Проверьте окно регистрации на июньский фестиваль в Steamworks — оно закрывается заранее; поставьте себе напоминание.
      - Обновите на странице Steam примерную дату выхода — «2027» без месяца безопаснее, чем конкретный месяц, который снова может съехать.
      - Перерыв до июня — время копить вишлисты: девлоги и стримеры работают и без демо.
  - role: user
    facts: []
    text: |
      Поставил «2027». Ладно, пойду закрывать Weblate и писать волонтёрам, что произошло.
