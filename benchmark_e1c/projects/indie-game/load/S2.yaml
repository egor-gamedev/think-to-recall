segment: S2
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [I06]
    text: |
      Вернулся. Игрока перевёл на состояния, стало сильно легче. Теперь про картинку. Вика рисует всё в 320×200, я выставил stretch mode = viewport, aspect = keep и включил integer scaling — растягиваю только целым множителем, чтобы пиксели не плыли. На Deck 1280×800 ложится идеально, ровно ×4. Правильно настроил или что-то упустил?
  - role: assistant
    facts: []
    text: |
      Настройка правильная для pixel-perfect. Проверьте по списку:

      ```
      display/window/size/viewport_width = 320
      display/window/size/viewport_height = 200
      display/window/stretch/mode = "viewport"
      display/window/stretch/aspect = "keep"
      display/window/stretch/scale_mode = "integer"
      rendering/textures/canvas_textures/default_texture_filter = Nearest
      ```

      `scale_mode = integer` появился как раз в 4.x, так что в 4.3 он есть. Фильтр `Nearest` важен — иначе спрайты замылятся при масштабе.

      Ещё два момента:

      - Размер окна при старте поставьте кратным: `window_width_override = 1280`, `window_height_override = 800`. Тогда в оконном режиме на десктопе игра откроется ровно ×4.
      - Интерфейс (меню, диалоги) рисуйте в том же 320×200, а не отдельным слоем в высоком разрешении. Иначе получится смесь «чётких» шрифтов и пиксельного мира, которая обычно выглядит чужеродно.

      Если когда-то понадобится плавный зум камеры — с viewport-режимом он будет «ступенчатым», это нормально и даже в стиле.
  - role: user
    facts: [I16]
    text: |
      Окно ×4 поставил. Дальше Input Map. Управление — геймпад и клавиатура, мышь в игре не используется вообще, курсор скрыт. Это принципиально: на Deck хочу, чтобы всё было под руками. Какие действия заводить?
  - role: assistant
    facts: []
    text: |
      Для адвенчуры с головоломками без мыши — примерно такой набор:

      | действие | клавиатура | геймпад |
      |---|---|---|
      | `move_left/right/up/down` | WASD + стрелки | левый стик + крестовина |
      | `interact` | E, Space | A (нижняя кнопка) |
      | `cancel` | Esc, Q | B (правая кнопка) |
      | `inventory` | Tab, I | Y |
      | `hint` | H | X |
      | `pause` | Esc | Start / Menu |
      | `ui_*` | стандартные | стандартные |

      Важные детали:

      1. Мёртвая зона стика — 0.2–0.25, по умолчанию в Godot 0.5, и это слишком туго для ходьбы.
      2. Курсор скрыть и не дать ему внезапно появиться: `Input.mouse_mode = Input.MOUSE_MODE_HIDDEN` в автозагрузке. Лучше ещё отключить обработку мыши в UI (`mouse_filter = IGNORE` у корневых Control), чтобы случайное движение тачпада Deck не выделяло кнопки.
      3. Фокус в меню: у каждой кнопки должны быть заданы соседи (`focus_neighbor_*`), и при открытии меню — `grab_focus()` на первую кнопку. Без мыши это единственный способ навигации.
      4. Глифы: определяйте последнее использованное устройство и показывайте соответствующие подсказки.

      ```gdscript
      # autoload/input_glyphs.gd
      extends Node
      signal device_changed(is_pad: bool)
      var is_pad := false

      func _input(e: InputEvent) -> void:
          var pad := e is InputEventJoypadButton or e is InputEventJoypadMotion
          if (e is InputEventKey or pad) and pad != is_pad:
              is_pad = pad
              device_changed.emit(is_pad)
      ```
  - role: user
    facts: []
    text: |
      Мёртвую зону поправил, действительно было вязко. Глифы сделаю потом, Вика нарисует. Теперь диалоги. Смотрю на Dialogic 2 — стоит ли его брать или проще своё написать? Диалогов будет много, это сюжетная игра.
  - role: assistant
    facts: []
    text: |
      Для сюжетной игры, которую делает один человек, Dialogic 2 — хороший выбор: редактор таймлайнов, персонажи, ветвления, переменные и, что для вас важно, встроенная поддержка переводов. Своё написать можно, но это месяцы работы, которые не видны игроку.

      Минусы, о которых надо знать заранее:

      - Dialogic 2 активно меняется; ставьте версию, совместимую с вашим 4.3, и не обновляйте его в середине разработки — тот же принцип, что с движком.
      - Стандартные стили рассчитаны на высокое разрешение. Для 320×200 придётся делать свой стиль текстового окна (или кастомизировать «Textbox Layer»): свой шрифт, отступы в пикселях, без сглаживания.
      - Переменные Dialogic живут отдельно от вашего GameState. Лучше сделать мост: в таймлайне вызывать `GameState.set_flag(...)` через событие «Call», а не дублировать флаги.

      Пример события в таймлайне:

      ```
      [signal arg="ch1_pump_fixed"]
      ```

      и в коде:

      ```gdscript
      func _ready() -> void:
          Dialogic.signal_event.connect(func(arg): GameState.set_flag(StringName(arg)))
      ```
  - role: user
    facts: [I17]
    text: |
      Беру. Диалоги сделаны в Dialogic 2 — первая глава уже вся там. Строки диалогов выгружаются встроенным экспортом переводов Dialogic в CSV: он сам раздаёт ключи репликам и складывает таблицы в папку. Получается, у меня два вида CSV — для интерфейса мой, для диалогов от Dialogic. Это нормально?
  - role: assistant
    facts: []
    text: |
      Нормально, так и задумано. Godot всё равно склеивает все переводы в один `TranslationServer`, ему неважно, из скольких файлов они пришли.

      Что стоит соблюдать:

      1. **Не правьте руками ключи, которые сгенерировал Dialogic.** Он записывает ID прямо в таймлайн (`#id:3f2a`), и если ключ в CSV и в таймлайне разойдутся, реплика молча покажется на исходном языке.
      2. **Порядок работы**: правите текст в редакторе Dialogic → «Update CSV files» → заполняете колонки других языков. Если сначала править CSV, а потом таймлайн, исходные строки затрутся при следующем экспорте.
      3. **Имена персонажей** Dialogic тоже выносит в отдельный CSV — не забудьте их перевести, это частая забытая мелочь.
      4. Добавьте все CSV Dialogic в список переводов проекта, как вы делали для `strings.csv`.

      И проверка, которую стоит делать перед каждой сборкой: переключить язык на английский и пройти по первой сцене. Непереведённая строка сразу бросается в глаза.
  - role: user
    facts: [I07]
    text: |
      Теперь сохранения, без них уже неудобно тестировать. Пока делаю просто: сохранение — JSON-файл user://save.json, один слот, автосохранение при входе в комнату. Набросай SaveManager.
  - role: assistant
    facts: []
    text: |
      ```gdscript
      # autoload/save_manager.gd
      extends Node

      const PATH := "user://save.json"

      func save_game(room: String) -> void:
          var data := GameState.to_dict()
          data["room"] = room
          var f := FileAccess.open(PATH, FileAccess.WRITE)
          if f == null:
              push_error("save failed: %s" % FileAccess.get_open_error())
              return
          f.store_string(JSON.stringify(data, "\t"))

      func has_save() -> bool:
          return FileAccess.file_exists(PATH)

      func load_game() -> Dictionary:
          if not has_save():
              return {}
          var txt := FileAccess.get_file_as_string(PATH)
          var data = JSON.parse_string(txt)
          if typeof(data) != TYPE_DICTIONARY:
              push_error("save corrupted")
              return {}
          GameState.from_dict(data)
          return data
      ```

      Автосохранение при входе в комнату — из скрипта комнаты:

      ```gdscript
      func _ready() -> void:
          SaveManager.save_game(scene_file_path)
      ```

      Две оговорки про JSON в Godot:

      - Числа после `JSON.parse_string` всегда приходят как `float`. `chapter` станет `1.0` — приводите к `int` в `from_dict`.
      - Чтобы при сбое питания не получить пустой файл, пишите сначала во временный `save.json.tmp`, а потом переименовывайте через `DirAccess.rename_absolute`.
  - role: user
    facts: []
    text: |
      Про float поймал сразу — номер главы стал 1.0 и сломал match. Временный файл сделал. Кстати, Вика спрашивает, где эти сейвы лежат физически — хочет на своём ноуте подсунуть сейв с середины главы.
  - role: assistant
    facts: []
    text: |
      `user://` на Windows — это `%APPDATA%\Godot\app_userdata\<имя проекта>\`, а если в настройках проекта включено `application/config/use_custom_user_dir`, то `%APPDATA%\<ваше имя папки>\`. На Linux и Deck — `~/.local/share/godot/app_userdata/<имя проекта>/`.

      Рекомендую сразу включить custom user dir и назвать папку `Smotritel` — иначе путь зависит от имени проекта в настройках, и если вы его переименуете, сейвы у всех «пропадут».

      Быстро открыть папку из игры для отладки: `OS.shell_open(ProjectSettings.globalize_path("user://"))`.
  - role: user
    facts: [I09]
    text: |
      Сделал Smotritel. Теперь про сроки, чтобы ты понимал, к чему мы бежим. План: демо на Steam Next Fest в феврале 2027, релиз 1.0 в апреле 2027. Демо — это первая глава. Успеваю, если не буду распыляться.
  - role: assistant
    facts: []
    text: |
      Тогда главный риск — не код, а всё вокруг демо, что обычно недооценивают:

      - **Страница в Steam** должна быть открыта заранее — Valve требует, чтобы страница «Coming Soon» существовала до регистрации на фестиваль, а вишлисты копятся именно на ней. Чем раньше она появится, тем лучше.
      - **Регистрация на Next Fest** закрывается примерно за пару месяцев до фестиваля, и демо должно пройти проверку Valve до него.
      - **Демо** — отдельное приложение в Steamworks со своим App ID. Его тоже надо собирать, заливать и проверять.
      - **Трейлер** и скриншоты для страницы.

      По объёму: первая глава как демо — правильный выбор для линейной сюжетной игры. Главное, чтобы она заканчивалась на крючке и ссылкой «Добавить в список желаемого».
  - role: user
    facts: []
    text: |
      Про страницу понял, на следующей неделе займусь. Ладно, пойду дорисовывать комнату с насосом.
