# E1c, проект clinic-bot: Telegram-бот записи в стоматологию с интеграцией в учётную систему клиники.
# Автор: Claude Opus 5.5, 2026-10-22. Тестируемая модель (Nemotron-3 Ultra) и судьи его не видят.
id: clinic-bot
e1c: true
title: Telegram-бот записи в стоматологию «Белая линия» (aiogram 3 + учётная система «СтомаОфис»)
language: ru
user_persona: >
  Разработчик на аутсорсе, ведёт заказ один. Пишет по-русски, по делу, иногда пересказывает
  решения клиники (главврач Олег Викторович, управляющая Ирина, регистратура) и вендора учётной системы.
  Клиника — в Калининградской области, сервер — в Москве.

facts:
  C01:  {text: "Бот на Python и aiogram 3, работает через вебхук на VPS в Selectel (Москва)."}
  # Цепочка 1 (интеграция с учётной системой), с возвратом к первому варианту с условием
  C02:  {text: "Расписание читаем и записи создаём напрямую в базе Firebird учётной системы «СтомаОфис» на сервере клиники, через туннель WireGuard."}
  C02b: {text: "Вендор «СтомаОфис» запретил прямую запись в базу под угрозой снять клинику с поддержки; перешли на их облачный API с лимитом 60 запросов в минуту — и чтение, и запись через API.", replaces: C02}
  C02c: {text: "Вернулись к чтению расписания напрямую из Firebird — под read-only пользователем, с письменного разрешения вендора; создание и отмена записей — только через API.", replaces: C02b}
  # Цепочка 2 (напоминания)
  C03:  {text: "Напоминание о приёме — одно сообщение в боте за 24 часа до приёма."}
  C03b: {text: "Напоминаний два: за 24 часа и за 2 часа до приёма.", replaces: C03}
  C03c: {text: "Напоминание одно — за 48 часов, с кнопкой «Подтверждаю»; кто не подтвердил за сутки до приёма, того бот не отменяет, а передаёт регистратуре на обзвон; напоминание за 2 часа убрали.", replaces: C03b}
  C04:  {text: "У клиники два филиала — Калининград (ул. Горького) и Зеленоградск; часть врачей работает в обоих."}
  C05:  {text: "Пациента опознаём по номеру из кнопки «Поделиться контактом» и ищем карту в учётке по телефону."}
  C06:  {text: "Телефоны в учётке записаны вразнобой (8…, +7…, с пробелами и скобками); сравниваем по последним 10 цифрам."}
  C07:  {text: "На один телефон в учётке бывает несколько карт (члены семьи) — бот спрашивает, кого записать."}
  C08:  {text: "Новых пациентов без карты бот записывает только на первичную консультацию 30 минут."}
  C09:  {text: "Через бота записываются только к терапевтам и гигиенисту; к хирургам и имплантологам — через регистратуру."}
  C09b: {text: "К хирургам и имплантологам в боте теперь можно записаться, но только на консультацию, не на операцию.", replaces: C09}
  C10:  {text: "Договор с фиксированной суммой: сдача 15 декабря, затем 3 месяца гарантийной поддержки."}
  C11:  {text: "После гарантии бот сопровождает приходящий айтишник клиники Вадим: знает Windows и 1С, Python — нет."}
  C12:  {text: "В логах ФИО и телефоны маскируются — требование юриста клиники."}
  C13:  {text: "Отменить запись в боте можно не позже чем за 12 часов до приёма; позже — только звонком в регистратуру."}
  C14:  {text: "Уведомления о новых записях и отменах бот шлёт в общий Telegram-чат регистратуры."}
  C15:  {text: "Для API есть песочница вендора; копии боевой базы Firebird для тестов нет — главврач не разрешил выносить базу."}
  C16:  {text: "Через 3 часа после приёма бот просит оценку от 1 до 5: на 5 даёт ссылку на отзыв в 2ГИС, на 1–4 пересылает отзыв управляющей Ирине."}
  # Неявные факты
  C17:
    text: "Детей клиника не принимает — записывать в боте можно только взрослых."
    implicit: true
    evidence: "S2: главврач велел всех младше 18 отправлять в «Карапуз» на Театральной, детского кресла нет, лицензию на детский приём не продлевали; в карте есть BIRTH_DATE."
  C18:
    text: "Время приёмов — калининградское, на час меньше московского, а сервер живёт по Москве: время в боте надо переводить."
    implicit: true
    evidence: "S1: VPS в Selectel (Москва), клиника в Калининграде и Зеленоградске; S2: в SCHEDULE время — TIMESTAMP без пояса, «как на часах в холле», пояс на VPS не трогали, планировщик берёт системный."
  C19:
    text: "Уведомления из чата регистратуры читают только в часы работы регистратуры на общем компьютере — ночью и в воскресенье их никто не видит."
    implicit: true
    evidence: "S3: у администраторов личные телефоны, рабочие чаты на личных главврач запретил, рабочий Telegram только на компьютере у стойки; работают с 8 до 21, в воскресенье закрыто."
  C20:
    text: "Цены в боте не показываются."
    implicit: true
    evidence: "S4: Ирина просила в описаниях услуг ничего про стоимость не писать; история со старой суммой за отбеливание в группе ВК и жалобой в Роспотребнадзор, у главврача «пунктик»."
  C21:
    text: "Запись в боте возможна максимум на две недели вперёд: дальше сетка врачей ещё не открыта."
    implicit: true
    evidence: "S4: админ в «СтомаОфисе» по пятницам выставляет докторам расписание на 14 дней, бот берёт слоты только из расписания."
  # Отказы
  C22r: {text: "Telegram Mini App для выбора слота отказались делать: после сдачи его некому поддерживать; только inline-кнопки."}
  C23r: {text: "LLM-ассистента для записи свободным текстом отказались делать: главврач боится ошибочных записей."}
  C24r: {text: "Приём фото и рентгеновских снимков через бот отказались делать: медданные в Telegram не гоняем."}

segments:
  - id: S1
    facts: [C10, C01, C02, C04, C05, C06, C22r]
    background: "структура проекта на aiogram 3, вебхук через aiohttp, firebird-driver в потоках поверх WireGuard, клавиатура «Поделиться контактом», нормализация телефонов, inline-календарь"
  - id: S2
    facts: [C09, C07, C17, C08, C03, C18]
    background: "список врачей по специальности, выбор карты из нескольких, хранилище FSM, запись без карты, периодическая задача напоминаний вместо разовых джобов, своя таблица флагов вне схемы вендора"
  - id: S3
    facts: [C02b, C11, C13, C19, C23r]
    background: "клиент облачного API на httpx, aiolimiter и 429, кэш слотов, хранилище FSM без Redis, кнопка отмены и правило 12 часов, ответ на свободный текст"
  - id: S4
    facts: [C03b, C14, C20, C21, C24r]
    background: "второе напоминание, chat_id группы и миграция в супергруппу, формат уведомления, тексты услуг в YAML для правки без кода, пустой календарь, хэндлер на фото"
  - id: S5
    facts: [C02c, C09b, C15, C16]
    background: "read-only пользователь Firebird и GRANT SELECT, разделение чтения и записи, задержка синхронизации облака и «удержание» слота, тестовая Firebird в Docker по схеме, консультации у хирургов, сбор оценок"
  - id: S6
    facts: [C03c, C12]
    background: "подтверждение записи кнопкой и статус через API, список неподтверждённых, фильтр маскирования в logging, чистка старых логов, шпаргалка systemd для сопровождения"

questions:
  - id: Q01
    type: clarify
    text: "Добавь в бот выбор филиала."
    anchors: [C04, C02c]
    expected: "Уточняет порядок: сначала филиал, потом врачи этого филиала — или сначала врач, а филиал выбирается после, раз часть врачей принимает в обоих (Калининград и Зеленоградск). Описывает оба варианта и что от выбора зависит."
    inappropriate: ["сразу делает статичный список двух кнопок без учёта врачей, работающих в обоих филиалах", "не спрашивает порядок"]
    followup: {id: N01, text: "Сначала филиал, а врачей показываем только тех, у кого в этом филиале открыта сетка."}
  - id: Q02
    type: change
    text: "Напиши текст напоминания, которое бот шлёт пациенту за сутки до приёма."
    anchors: [C03c, C03, C03b]
    expected: "Напоминание теперь одно — за 48 часов, с кнопкой «Подтверждаю»; за сутки пациенту ничего не шлётся, неподтверждённых передают регистратуре на обзвон. Предлагает текст для напоминания за 48 часов с кнопкой."
    inappropriate: ["текст напоминания за 24 часа без кнопки подтверждения", "два текста: за сутки и за 2 часа"]
  - id: Q03
    type: recall
    text: "Пациенты спрашивают в боте, сколько стоит чистка. Добавим кнопку «Цены»? Прайс можно вытащить из СтомаОфиса."
    anchors: [C20]
    expected: "Цены в боте не показываем: клиника (главврач, Ирина) против после истории со старой ценой и жалобой в Роспотребнадзор. Вместо прайса — «стоимость назовут на консультации / в регистратуре» и запись на приём."
    inappropriate: ["выгрузить прайс из учётки и показывать в боте", "кнопка «Цены» с таблицей услуг"]
  - id: Q04
    type: link
    text: "Нужна функция «перенести запись на другое время». Какие правила в неё заложить?"
    anchors: [C13, C02c, C14, C03c]
    expected: "Перенос = отмена + новая запись: действует правило 12 часов до приёма (позже — звонком); отмена и создание — через API вендора, не в Firebird; уведомление в чат регистратуры; по новой записи заново напоминание за 48 часов и сброс подтверждения."
    inappropriate: ["UPDATE времени записи в Firebird", "перенос в любой момент без ограничения по времени", "без уведомления регистратуры"]
  - id: Q05
    type: change
    text: "API вендора опять отвечает 429, когда пациент листает свободные слоты на неделю. Как ужаться в лимит?"
    anchors: [C02c, C02b]
    expected: "Слоты мы уже читаем напрямую из Firebird под read-only пользователем, а не через API — показ слотов в лимит не должен попадать. Значит, где-то остался старый код чтения через API: найти и перевести на Firebird; лимит 60/мин касается только создания и отмены."
    inappropriate: ["кэшировать ответы API на чтение слотов", "token bucket / батчинг запросов к API для показа слотов", "попросить у вендора больший лимит"]
  - id: Q06
    type: recall
    text: "Мама пишет в бот: хочет записать сына, ему 9 лет, его карта на её номере. Как ей выбрать карту ребёнка?"
    anchors: [C17, C07]
    expected: "Клиника детей не принимает (младше 18 — в «Карапуз», детского кресла и лицензии нет). Ребёнка в боте не записываем: карты несовершеннолетних по BIRTH_DATE не показывать, маме вежливо объяснить и дать контакт детской клиники."
    inappropriate: ["показать карту ребёнка в списке и записать к терапевту", "записать к детскому врачу"]
  - id: Q07
    type: link
    text: "Пациентка записалась через бота в Зеленоградск, а приехала на Горького — врач-то тот же. Как сделать, чтобы такого не было?"
    anchors: [C04, C03c, C14]
    expected: "Врач работает в обоих филиалах, поэтому адрес филиала должен быть явно в подтверждении записи и в напоминании за 48 часов (с кнопкой «Подтверждаю»), а также в уведомлении в чат регистратуры."
    inappropriate: ["запретить врачу работать в двух филиалах", "напоминание за сутки/за 2 часа с адресом"]
  - id: Q08
    type: clarify
    text: "Сделай, чтобы старые пациенты тоже получали напоминания."
    anchors: [C05, C03c]
    expected: "Уточняет, кто такие «старые»: (а) те, кто уже запускал бота и опознан по контакту, но записан через регистратуру — им можно слать напоминание за 48 часов, читая их записи из учётки; (б) пациенты из базы, ни разу не открывавшие бота, — бот не может написать им первым, нужен другой канал (SMS) или приглашение."
    inappropriate: ["разослать напоминания по всем телефонам из учётки через бота", "не спрашивает, о ком речь"]
  - id: Q09
    type: change
    text: "Регистратура просит: если пациент отменил запись в боте, пусть в карте появляется пометка «отменено через бота». Допишу UPDATE поля COMMENT в SCHEDULE — одна строка же."
    anchors: [C02c, C02b, C02]
    expected: "Нет: в Firebird у нас только чтение под read-only пользователем (UPDATE не пройдёт), прямую запись вендор запретил. Пометку — через API вендора (если есть поле комментария в методе отмены), иначе — в уведомлении в чат регистратуры."
    inappropriate: ["UPDATE поля COMMENT в Firebird", "выдать пользователю бота права на запись в таблицу"]
  - id: Q10
    type: link
    text: "Новый человек пишет боту: «Запишите меня на завтра к любому врачу, болит зуб». Как бот должен это обработать?"
    anchors: [C08, C23r, C22r]
    expected: "Свободный текст не разбираем (LLM-ассистента отказались), отвечаем подсказкой и inline-кнопками записи (не Mini App); новому пациенту без карты доступна только первичная консультация 30 минут, её и предлагаем, с ближайшими слотами."
    inappropriate: ["разобрать текст нейросетью/регулярками и записать автоматически", "записать на лечение к любому врачу"]
  - id: Q11
    type: recall
    text: "В разделе «на сегодня» показываю слоты, начиная с текущего времени плюс час запаса. Регистратура говорит, что бот прячет слоты, которые ещё вполне можно занять, — как будто пропадает лишний час. Где ошибка?"
    anchors: [C18]
    expected: "Часовой пояс: время в SCHEDULE калининградское без пояса, а сервер живёт по Москве (на час больше), и datetime.now() даёт московское — фильтр отрезает лишний час. Сравнивать в Europe/Kaliningrad (zoneinfo), заодно проверить напоминания и правило 12 часов."
    inappropriate: ["уменьшить запас с часа до 30 минут", "искать ошибку в кэше или округлении слотов"]
  - id: Q12
    type: clarify
    text: "Ирина просит отчёт. Сделай."
    anchors: [C16, C03c]
    expected: "Уточняет, какой: по отзывам (оценки 1–4 и так пересылаются Ирине; нужна ли сводка по врачам/за период) или по подтверждениям и обзвону неподтверждённых; и как часто/куда присылать."
    inappropriate: ["сразу делает отчёт по выручке или записям без вопроса"]
    followup: {id: N02, text: "По отзывам: раз в неделю сводка — средняя оценка по каждому врачу и сколько было оценок 1–4."}
  - id: Q13
    type: change
    text: "Пациент так и не нажал «Подтверждаю». За сутки до приёма бот отменяет запись через API и освобождает слот — правильно я сделал?"
    anchors: [C03c, C14]
    expected: "Нет: по решению клиники неподтверждённых бот не отменяет, а передаёт регистратуре на обзвон (в чат регистратуры). Автоотмену убрать."
    inappropriate: ["да, автоотмена через API правильна", "отменять и уведомлять пациента"]
  - id: Q14
    type: link
    text: "Когда после сдачи у бота упадёт вебхук, кто и как это заметит?"
    anchors: [C10, C11, C19, C01, C14]
    expected: "После 3 месяцев гарантии сопровождает Вадим (Windows/1С, без Python) — нужен простой внешний мониторинг (healthcheck/UptimeRobot) с алертом Вадиму и разработчику на время гарантии, systemd с авто-рестартом и инструкция «что нажать». Алерт в чат регистратуры не годится — его читают только в часы работы на общем компьютере."
    inappropriate: ["Prometheus + Grafana + Alertmanager", "слать алерты в чат регистратуры", "разработчик будет следить сам без срока"]
  - id: Q15
    type: recall
    text: "Пациент поставил 4 звезды. Куда бот его отправляет?"
    anchors: [C16]
    expected: "4 — это диапазон 1–4: отзыв пересылается управляющей Ирине; ссылку на отзыв в 2ГИС даём только на 5."
    inappropriate: ["4 и 5 — ссылка на 2ГИС / Яндекс Карты", "4 — положительная оценка, просим оставить публичный отзыв"]
  - id: Q16
    type: change
    text: "Пациент хочет через бота записаться на удаление зуба мудрости к хирургу. Пускаем?"
    anchors: [C09b, C09]
    expected: "К хирургам в боте теперь можно, но только на консультацию, не на операцию: предлагаем консультацию хирурга, удаление назначат после неё."
    inappropriate: ["нет, к хирургам только через регистратуру", "да, записываем сразу на удаление"]
  - id: Q17
    type: link
    text: "Регистратура хочет видеть в своём чате, кто записался, — с ФИО и телефоном. Это не противоречит маскированию?"
    anchors: [C14, C12, C19]
    expected: "Маскирование — требование юриста к логам, не к уведомлениям: в закрытый рабочий чат регистратуры (Telegram только на общем компьютере у стойки) ФИО и телефон отправлять можно, но без медданных; в логах эти же данные остаются замаскированными. Можно уточнить у юриста."
    inappropriate: ["маскировать ФИО и телефон и в уведомлениях регистратуре", "логировать уведомление целиком с ФИО"]
  - id: Q18
    type: clarify
    text: "Пациент хочет к Соколовой, но не знает, в каком она филиале. Как ему быть в боте?"
    anchors: [C04]
    retention_of: N01
    expected: "Помнит решение: сначала филиал, врачи — только с открытой сеткой в нём. Соколова принимает в обоих — значит, она есть в обоих списках; уточняет, нужен ли второй путь «по врачу» (показать её слоты в обоих филиалах с адресом) или достаточно подсказки."
