# E1c, проект econ-thesis: магистерская по эконометрике (панель регионов РФ, R).
# Автор: Claude Opus 5.5, 2026-10-22. Тестируемая модель и судьи его не видят.
id: econ-thesis
e1c: true
title: Трансферты и налоговые усилия регионов России (магистерская диссертация, R)
language: ru
user_persona: >
  Студентка магистратуры по экономике (двойной диплом), хорошо знает эконометрику по учебнику,
  в R уверенно работает с dplyr, но в панельных пакетах путается. Пишет по-русски, коротко,
  часто вставляет куски кода и вывода.

facts:
  # S1
  E01: {text: "Тема магистерской: влияние трансфертов из федерального бюджета на налоговые усилия регионов России; считаю в R."}
  E02: {text: "Налоговые усилия измеряем как отношение собственных налоговых доходов консолидированного бюджета региона к ВРП, в процентах."}
  E03: {text: "Выборка — все 85 регионов за 2010–2022 годы."}
  E04:
    text: 'Нативный пайп |> и короткую запись функций \(x) в коде использовать нельзя: они не поддерживаются.'
    implicit: true
    evidence: "S1: считает на факультетском RStudio Server, там R 4.0.3, админ обновит только летом, прав у неё нет; |> и \\(x) появились в R 4.1."
  E05:
    text: "Текст работы, таблицы и подписи рисунков должны быть на английском."
    implicit: true
    evidence: "S1: двойной диплом с Тилбургом, второй рецензент оттуда и по-русски не читает, защита совместная."
  # S2
  E03b: {text: "Исключили Крым и Севастополь (данных до 2014 года нет): 83 региона, панель сбалансированная.", replaces: E03}
  E06: {text: "Регионы склеиваем по кодам ОКАТО, а не по названиям."}
  E07: {text: "Тюменскую область берём без автономных округов, ХМАО и ЯНАО — отдельными регионами; Архангельскую — без НАО, НАО отдельно."}
  E08:
    text: "В выгрузках ЕМИСС дробная часть отделена запятой, а разряды тысяч — пробелами."
    implicit: true
    evidence: "S2: вставленный сырой кусок csv из ЕМИСС с числами вида «1 234 567,8»; сама ВРП и население она пересохраняла через Excel, поэтому проблемы не заметила."
  E09: {text: "Трансферты в отчётах Казначейства даны в тысячах рублей, а ВРП из ЕМИСС — в миллионах рублей."}
  E10: {text: "Исполнение бюджетов берём из Казначейства с 2014 года, а за 2010–2013 — из базы НИФИ."}
  E11:
    text: "Данные НИФИ нельзя выкладывать в открытый доступ."
    implicit: true
    evidence: "S2: базу за 2010–2013 дала Ирина Сергеевна из НИФИ лично; это их внутренняя база, статья по ней ещё на рецензии, просила только сослаться."
  E12: {text: "Базовая спецификация — модель с фиксированными эффектами региона и года (two-way FE)."}
  E13: {text: "Объясняющая переменная — все трансферты из федерального бюджета на душу населения."}
  # S3
  E13b: {text: "Вместо всех трансфертов берём только дотации на выравнивание бюджетной обеспеченности на душу, с лагом в один год.", replaces: E13}
  E12b: {text: "Перешли на системный GMM (Blundell–Bond, pgmm) с лагом налоговых усилий — по совету научрука.", replaces: E12}
  E14: {text: "Денежные показатели переводим в цены 2015 года региональным ИПЦ."}
  E15: {text: "Контрольные переменные: логарифм ВРП на душу, доля добычи полезных ископаемых в ВРП, уровень безработицы, доля городского населения."}
  E15r: {text: "Индекс налогового потенциала Минфина как контроль отклонили: он считается по фактическим поступлениям и эндогенен."}
  E12r: {text: "Кластеризацию по федеральным округам отклонили: всего 8 кластеров; кластеры оставили по регионам."}
  E16: {text: "Гипотеза H2: эффект сильнее у высокодотационных регионов — доля дотаций в доходах больше 40 %; проверяем взаимодействием."}
  # S4
  E03c: {text: "Период сократили: оцениваем на 2011–2019 годах (2010 нужен только как лаг дотаций, 2020–2022 исключены из-за ковидных трансфертов); 83 × 9 = 747 наблюдений.", replaces: E03b}
  E17: {text: "FE-модели теперь считаем в fixest (feols); plm оставили только для pgmm."}
  E18r: {text: "Пространственные модели (SAR, SDM) отклонили — не успеваем; упоминаем их в ограничениях."}
  E19:
    text: "Таблицы результатов нужно готовить в формате docx."
    implicit: true
    evidence: "S4: Вадим Петрович правит только в Word режимом рецензирования, html-ссылки не открывает, R у него не стоит."
  # S5
  E12c: {text: "Вернулись к two-way FE, но без лага налоговых усилий и с ошибками, кластеризованными по регионам; GMM — только в приложении: инструментов больше 120 при 83 регионах, тест Хансена p = 1,00.", replaces: E12b}
  E20: {text: "Проверка устойчивости — выборка без Москвы и Санкт-Петербурга."}
  E21: {text: "Работу печатают в чёрно-белом виде, поэтому графики не должны держаться на цвете."}
  # S6
  E16b: {text: "Порог H2 заменили: высокодотационные — регионы выше медианы доли дотаций в доходах, потому что выше 40 % только 9 регионов.", replaces: E16}
  E22: {text: "Код сдаётся приложением и должен воспроизводиться с нуля одним скриптом run_all.R на факультетском сервере."}

segments:
  - id: S1
    facts: [E01, E02, E03, E04, E05]
    background: "постановка вопроса и гипотезы H1, литература про flypaper-эффект, выбор меры налоговых усилий, структура RStudio-проекта и renv на сервере"
  - id: S2
    facts: [E03b, E06, E07, E08, E09, E10, E11, E12, E13]
    background: "чтение отчётов Казначейства из Excel, разные написания регионов, автономные округа, Крым, единицы, первая two-way FE в plm"
  - id: S3
    facts: [E13b, E12b, E14, E15, E15r, E12r, E16]
    background: "дефлирование, выбор контролей, встреча с научруком, переход на дотации с лагом и pgmm, спор про кластеры, формулировка H2"
  - id: S4
    facts: [E03c, E17, E18r, E19]
    background: "медленный pgmm, ковидные годы, переход на fixest, тест Морана и пространственные модели, VIF и замечания научрука"
  - id: S5
    facts: [E12c, E20, E21]
    background: "диагностика GMM (AR(2), Хансен, число инструментов, collapse), возврат к FE, проверки устойчивости, оформление графиков для печати"
  - id: S6
    facts: [E16b, E22]
    background: "группы для H2 и их размер, интерпретация взаимодействия, сборка воспроизводимого приложения, sessionInfo и пути"

questions:
  - id: Q01
    type: clarify
    text: "Пересчитай основную модель на полной выборке."
    anchors: [E03c, E03, E20, E12c]
    expected: "Уточняет, что значит «полная»: (а) основная выборка 83 региона × 2011–2019 (747 наблюдений) — в отличие от проверки без Москвы и Санкт-Петербурга; (б) исходные 85 регионов за 2010–2022 — но Крым и Севастополь без данных до 2014, а 2020–2022 исключены из-за ковидных трансфертов. Не пересчитывает молча на 85 × 13."
    inappropriate: ["пересчёт на 85 регионах за 2010–2022 без оговорок", "выбрать одно прочтение молча, не упомянув второе"]
  - id: Q02
    type: change
    text: "Сколько наблюдений должно получиться в основной регрессии? Хочу проверить, что ничего не потеряла при склейке."
    anchors: [E03c, E03b, E07]
    expected: "747 = 83 региона × 9 лет (2011–2019); 83 — без Крыма и Севастополя, Тюменская и Архангельская без АО, ХМАО, ЯНАО и НАО отдельными строками."
    inappropriate: ["1105 (85 × 13)", "1079 (83 × 13) или любое число, включающее 2010 или 2020–2022"]
  - id: Q03
    type: recall
    text: "Мне прислали из ЕМИСС csv с инвестициями в основной капитал по регионам. Напиши код, чтобы прочитать его в R."
    anchors: [E08, E04]
    expected: "Учитывает, что в сырых выгрузках ЕМИСС дробная часть через запятую, а тысячи разделены пробелами (возможно, неразрывными): read_delim с locale(decimal_mark = \",\", grouping_mark = \" \") или очистка gsub перед as.numeric; кодировку проверить; код без |> и \\(x)."
    inappropriate: ["read.csv() / read_csv() с настройками по умолчанию — числа становятся текстом или NA", "read_csv2 без замены grouping_mark (там точка)", "as.numeric() без удаления пробелов и замены запятой"]
  - id: Q04
    type: link
    text: "Странно: у ХМАО и ЯНАО налоговые усилия совсем не похожи на Тюменскую область. Может, я криво склеила?"
    anchors: [E07, E06, E02, E15]
    expected: "Скорее не ошибка: Тюменскую берём без автономных округов, ХМАО и ЯНАО — отдельные регионы с другой структурой экономики (добыча), отношение налогов к ВРП там иное; поэтому доля добычи в ВРП стоит в контролях. Проверить по кодам ОКАТО, что взяты строки «без АО», а не итог по области."
    inappropriate: ["объединить Тюменскую с ХМАО и ЯНАО", "удалить автономные округа как выбросы", "искать ошибку в написании названий регионов"]
  - id: Q05
    type: clarify
    text: "Добавь в основную модель лаг."
    anchors: [E12c, E13b, E12b]
    expected: "Уточняет, какой лаг: (а) налоговых усилий — его как раз убрали из основной FE, динамическая версия есть только в GMM в приложении; (б) дотаций — они уже стоят с лагом в год, можно добавить t−2 как проверку."
    inappropriate: ["добавить лаг налоговых усилий в основную FE без вопроса", "добавить lag() дотаций, не заметив, что лаг уже есть"]
    followup: {id: N01, text: "Лаг дотаций на два года, как проверку. И договоримся: в таблицах дотации подписываем «Equalization grants p.c., t−1» (и «t−2» для второго лага)."}
  - id: Q06
    type: change
    text: "Какую переменную трансфертов ставить в регрессию?"
    anchors: [E13b, E13, E14]
    expected: "Дотации на выравнивание бюджетной обеспеченности на душу, с лагом в год, в ценах 2015 года — а не все трансферты."
    inappropriate: ["все трансферты из федерального бюджета на душу", "трансферты текущего года без лага", "номинальные значения"]
  - id: Q07
    type: link
    text: "Нарисуй для главы график средних налоговых усилий по годам."
    anchors: [E03c, E05, E21, E04, E02]
    expected: "Годы 2011–2019, 83 региона; подписи и заголовок на английском; чёрно-белое оформление (серые оттенки, типы линий или маркеры); налоговые усилия в % ВРП; код без |> и \\(x)."
    inappropriate: ["годы 2010–2022", "подписи осей на русском", "различение только цветом"]
  - id: Q08
    type: recall
    text: "Кластеризуй стандартные ошибки по федеральным округам — так консервативнее."
    anchors: [E12r, E12c]
    expected: "Напоминает, что это уже отклонили: федеральных округов всего 8 — слишком мало кластеров, оценки ошибок ненадёжны; оставляем кластеры по регионам (83)."
    inappropriate: ["cluster = ~federal_district без оговорок"]
  - id: Q09
    type: change
    text: "Напиши код основной модели."
    anchors: [E12c, E13b, E15, E17, E04]
    expected: "fixest::feols: налоговые усилия ~ дотации на выравнивание на душу (t−1) + ln ВРП на душу + доля добычи + безработица + доля городского населения | регион + год, cluster = ~регион; без лага налоговых усилий; 2011–2019; без |> и \\(x)."
    inappropriate: ["pgmm / системный GMM как основная модель", "лаг налоговых усилий в правой части", "все трансферты вместо дотаций", "индекс налогового потенциала в контролях"]
  - id: Q10
    type: link
    text: "Какие годы мне брать из базы НИФИ, а какие из Казначейства?"
    anchors: [E10, E03c, E13b]
    expected: "НИФИ — 2010–2013 (2010 нужен только для лага дотаций к 2011), Казначейство — 2014–2019; 2020–2022 для основной выборки не нужны."
    inappropriate: ["из НИФИ только 2011–2013 — тогда для 2011 нет лага дотаций", "Казначейство до 2022 для основной модели"]
  - id: Q11
    type: clarify
    text: "Обнови данные до 2022 года."
    anchors: [E03c, E10]
    expected: "Уточняет: (а) расширить основную выборку — это против решения исключить 2020–2022 из-за ковидных трансфертов; (б) добавить 2020–2022 как проверку устойчивости в приложение. Данные за эти годы — из Казначейства."
    inappropriate: ["молча расширить основную выборку до 2022"]
    followup: {id: N02, text: "Как проверку, в приложение. И договоримся: таблицы приложения нумеруем A1, A2, …, а таблицы главы — 3.1, 3.2 и дальше."}
  - id: Q12
    type: recall
    text: "В туториале видела новый синтаксис: |> вместо %>% и \\(x) вместо function(x). Перепиши мой код очистки на него, чтобы было современно."
    anchors: [E04]
    expected: "Предупреждает: на факультетском RStudio Server R 4.0.3, а |> и \\(x) появились в R 4.1 — код упадёт с синтаксической ошибкой; оставить %>% и function(x) (или сначала добиться обновления R)."
    inappropriate: ["переписать на |> и \\(x) без предупреждения"]
  - id: Q13
    type: change
    text: "Вадим Петрович спросит, зачем мы ушли от GMM, который он сам предлагал. Что ему ответить?"
    anchors: [E12c, E12b]
    expected: "Распространение инструментов: больше 120 инструментов при 83 регионах, тест Хансена p = 1,00 — признак обессиленного теста, оценки GMM ненадёжны. Поэтому основная — two-way FE без лага с кластерами по регионам, а GMM оставлен в приложении как проверка."
    inappropriate: ["общие аргументы FE против GMM без диагностик проекта", "предложить вернуть GMM основной моделью"]
  - id: Q14
    type: link
    text: "Сколько регионов и наблюдений останется в проверке без городов федерального значения?"
    anchors: [E20, E03b, E03c]
    expected: "81 регион × 9 лет = 729 наблюдений: Севастополь уже исключён вместе с Крымом, убираем Москву и Санкт-Петербург."
    inappropriate: ["82 региона (85 − 3)", "80 регионов (83 − 3)", "счёт по 2010–2022"]
  - id: Q15
    type: change
    text: "Сделай таблицу с основной моделью для главы."
    anchors: [E12c, E19, E05, E13b]
    retention_of: N01
    expected: "Таблица 3.x в docx (modelsummary/flextable), подписи на английском, дотации подписаны «Equalization grants p.c., t−1»; two-way FE без лага, ошибки кластеризованы по регионам, N = 747; GMM в эту таблицу не идёт."
    inappropriate: ["LaTeX/stargazer или html", "колонка GMM как основная", "подписи переменных на русском или имена колонок из R"]
  - id: Q16
    type: link
    text: "Как правильно посчитать дотации на душу, чтобы потом сопоставлять с ВРП?"
    anchors: [E09, E14, E13b, E10]
    expected: "Казначейство — в тысячах рублей, ВРП — в миллионах: привести к одним единицам; делить на население; дефлировать региональным ИПЦ к ценам 2015 года; брать дотации на выравнивание; для 2010–2013 — база НИФИ (проверить её единицы отдельно)."
    inappropriate: ["делить без пересчёта тысяч и миллионов", "оставить номинальные рубли", "все трансферты"]
  - id: Q17
    type: clarify
    text: "Посчитай среднюю долю налоговых доходов в ВРП по России за период — для введения."
    anchors: [E02, E07, E03c]
    expected: "Уточняет: (а) невзвешенное среднее по 83 регионам выборки или (б) по России в целом — сумма налогов к сумме ВРП (взвешенное). В обоих случаях период 2011–2019; для агрегата не задвоить Тюменскую с АО и ХМАО/ЯНАО."
    inappropriate: ["одно число через mean() без вопроса", "период 2010–2022"]
  - id: Q18
    type: recall
    text: "Хочу выложить весь датасет на Zenodo, чтобы дать DOI в работе. Норм?"
    anchors: [E11, E10]
    expected: "Часть 2010–2013 — внутренняя база НИФИ, статья по ней ещё на рецензии: без разрешения Ирины Сергеевны её не выкладывать. Можно выложить данные Казначейства и ЕМИСС и код, а для НИФИ — описание и ссылку."
    inappropriate: ["выложить весь датасет без оговорок"]
  - id: Q19
    type: change
    text: "Какие годы оставить в итоговом датасете для анализа?"
    anchors: [E03c, E13b, E03]
    expected: "2010–2019: 2010 — только ради лага дотаций, оценивание на 2011–2019; 2020–2022 исключены из-за ковидных трансфертов."
    inappropriate: ["2010–2022", "2011–2019 без 2010 — лаг дотаций за 2011 потеряется"]
  - id: Q20
    type: link
    text: "После склейки у меня 85 строк на каждый год, а должно быть 83. Где лишние?"
    anchors: [E07, E03b, E06]
    expected: "Скорее всего, в выгрузке остались и Тюменская и Архангельская «всего» (с автономными округами), и «без АО»: оставить только строки «без АО» (по кодам ОКАТО); заодно проверить, что Крым и Севастополь удалены."
    inappropriate: ["удалить ХМАО, ЯНАО или НАО", "считать, что 85 — правильно"]
  - id: Q21
    type: change
    text: "Сделай таблицу с GMM для приложения."
    anchors: [E12c, E12b, E05, E19]
    retention_of: N02
    expected: "Нумерация приложения (A1, A2, …); docx; подписи на английском; лаг налоговых усилий; AR(1), AR(2), тест Хансена с оговоркой про p = 1,00 и число инструментов против 83 регионов; подаётся как проверка, а не основной результат."
    inappropriate: ["нумерация как у таблиц главы (3.x)", "подача GMM как главного результата", "без числа инструментов"]
  - id: Q22
    type: clarify
