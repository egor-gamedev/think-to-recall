segment: S2
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [E10]
    text: |
      Привет, я с данными. Исполнение бюджетов берём из Казначейства с 2014 года — там на сайте отчёты по консолидированным бюджетам субъектов, по файлу на год. А за 2010–2013 их архива у меня нет, поэтому за эти годы — из базы НИФИ. Начала с Казначейства: в каждом xlsx шапка на пять строк, потом регионы строками, а нужные показатели — в колонках с длинными названиями. Как это нормально прочитать?
  - role: assistant
    facts: []
    text: |
      Для таких отчётов удобно читать каждый файл одной функцией, пропуская шапку, а потом склеивать годы. Примерно так:

      ```r
      library(dplyr)
      library(readxl)
      library(purrr)

      read_treasury <- function(path) {
        year <- as.integer(sub(".*_(\\d{4})\\.xlsx$", "\\1", path))
        df <- read_excel(path, skip = 5, col_names = FALSE)
        df %>%
          select(region = 1, tax_rev = 4, transfers = 9) %>%   # номера колонок проверьте по файлу
          filter(!is.na(region)) %>%
          mutate(year = year)
      }

      files <- list.files("data_raw/treasury", pattern = "\\.xlsx$", full.names = TRUE)
      treasury <- map_dfr(files, read_treasury)
      ```

      Обратите внимание на две вещи:
      - **Номера колонок** между годами могут сдвигаться, если Казначейство меняло форму. Перед склейкой выведите `names()` или первые строки каждого файла и сверьте. Надёжнее — искать колонку по части названия (`grep("Налоговые", ...)`), а не по номеру.
      - **Итоговые строки.** В таких отчётах часто есть строки «Российская Федерация», «Центральный федеральный округ» и т. п. Их надо выкинуть, иначе федеральные округа попадут в панель как регионы.

      Пришлите, что получится после склейки: сколько строк на год.
  - role: user
    facts: [E11]
    text: |
      По НИФИ сразу скажу, чтобы не забыть: файл за 2010–2013 мне дала Ирина Сергеевна оттуда, лично, по знакомству научрука. Это их внутренняя база, статья по ней у них ещё на рецензии. Просила только обязательно сослаться. Там формат другой, регионы — коды и названия, а показатели по годам в колонках.
  - role: assistant
    facts: []
    text: |
      Понятно, тогда это отдельный загрузчик со своим преобразованием. Если годы в колонках — нужен переход из широкого формата в длинный:

      ```r
      library(tidyr)

      nifi_raw <- read_excel("data_raw/nifi_2010_2013.xlsx", sheet = 1)

      nifi <- nifi_raw %>%
        pivot_longer(
          cols = matches("^(tax|transf)_\\d{4}$"),
          names_to = c(".value", "year"),
          names_pattern = "^(tax|transf)_(\\d{4})$"
        ) %>%
        mutate(year = as.integer(year)) %>%
        rename(tax_rev = tax, transfers = transf)
      ```

      Названия колонок у вас, конечно, другие — подставьте шаблон под них. Смысл: каждая пара «показатель_год» превращается в строку с годом и колонками показателей.

      Ссылку на базу оформите в тексте так, как попросила Ирина Сергеевна, — лучше уточнить у неё точную формулировку (часто в таких случаях пишут «данные предоставлены НИФИ Минфина России»). И сразу проверьте, совпадают ли определения показателей с Казначейством: «налоговые доходы» в двух источниках могут считаться немного по-разному. Хорошая проверка — если какой-то год есть в обоих источниках, сравнить цифры.
  - role: user
    facts: [E08]
    text: |
      Пересекающегося года нет, увы. Склеила Казначейство: на 2014 год 89 строк, на 2015 — 89, дальше так же. Внутри ещё строка «Российская Федерация» и все федеральные округа, их я выкинула, осталось 85. Отлично. Теперь хочу присоединить ВРП и население из ЕМИСС, а там названия регионов другие. Вот кусок, как он выглядит в исходном csv:

      ```
      "Регион";"Год";"ВРП, млн руб.";"Численность населения, чел."
      "Кемеровская область - Кузбасс";"2015";"1 012 448,3";"2 717 627"
      "Ханты-Мансийский автономный округ - Югра";"2015";"2 791 004,1";"1 626 755"
      "г. Севастополь";"2015";"52 812,6";"416 263"
      "Республика Северная Осетия-Алания";"2015";"121 345,9";"705 107"
      ```

      ВРП и население я, правда, уже скачала раньше в xlsx и читаю через readxl. А у Казначейства «Кемеровская область — Кузбасс» с длинным тире, «Республика Северная Осетия — Алания» с пробелами. Как сопоставить?
  - role: assistant
    facts: []
    text: |
      Сопоставлять по названиям — путь к тихим ошибкам: тире, пробелы, «г.», «Республика», переименования вроде «— Кузбасс» (с 2019) и «— Югра». Даже если сейчас всё вручную подогнать, при добавлении нового файла история повторится.

      Надёжнее завести **справочник регионов** с кодом и привязать к нему каждый источник один раз:

      ```r
      regions <- read_excel("data_raw/regions_dict.xlsx")
      # колонки: okato, name_treasury, name_emiss, name_nifi, federal_district

      treasury <- treasury %>%
        left_join(select(regions, okato, name_treasury), by = c("region" = "name_treasury"))

      emiss <- emiss %>%
        left_join(select(regions, okato, name_emiss), by = c("region" = "name_emiss"))

      # проверка: кто не нашёлся
      treasury %>% filter(is.na(okato)) %>% distinct(region)
      emiss %>% filter(is.na(okato)) %>% distinct(region)
      ```

      Справочник заполняется руками один раз (85 строк), зато дальше все склейки идут по коду, а не по строке. В качестве кода обычно берут ОКАТО (первые две цифры — код субъекта) — он есть во многих выгрузках Росстата. У НИФИ, вы говорите, коды тоже есть: проверьте, какие именно, и добавьте соответствие в справочник.

      После склейки — та же проверка, что выше: строки с `NA` в коде показывают, какие названия не сопоставились.
  - role: user
    facts: [E06]
    text: |
      Всё, решено: регионы склеиваем по кодам ОКАТО, а не по названиям. Справочник сделала. Но вылезла другая беда: в ЕМИСС есть «Тюменская область» и отдельно «Тюменская область (кроме Ханты-Мансийского АО и Ямало-Ненецкого АО)», и такая же история с Архангельской и Ненецким АО. А ХМАО и ЯНАО ещё и отдельными строками. Что брать?
  - role: assistant
    facts: []
    text: |
      Это классическая ловушка с «матрёшечными» субъектами. ХМАО и ЯНАО — самостоятельные субъекты федерации, но статистически входят в состав Тюменской области; то же с Ненецким АО и Архангельской областью. Поэтому в данных Росстата есть и «всего по области» (вместе с округами), и «без автономных округов».

      Варианты:
      1. **Область без АО + округа отдельно.** Каждый субъект — отдельное наблюдение, ничего не посчитано дважды. Стандартный выбор в региональной эмпирике.
      2. **Область вместе с АО, округа выкинуть.** Меньше наблюдений, и вы смешиваете в одном наблюдении очень разные экономики.

      Двойной счёт возникает, если взять «всего по области» *и* округа отдельно — тогда, например, нефтегазовый ВРП Югры будет в панели дважды.

      Главное — чтобы и Казначейство, и ЕМИСС, и НИФИ были приведены к одному варианту. У Казначейства бюджет области и бюджеты округов исполняются отдельно, так что там «без АО» получается естественным образом — проверьте, что ВРП и население вы тоже взяли именно «без АО». В справочнике регионов это удобно отметить отдельными кодами.
  - role: user
    facts: [E07]
    text: |
      Тогда так: Тюменскую область берём без автономных округов, а ХМАО и ЯНАО — отдельными регионами. Архангельскую — тоже без НАО, НАО отдельно. В справочнике отметила. Следующее: Крым и Севастополь. Данных по ним до 2014 года нет вообще, а я хотела сбалансированную панель.
  - role: assistant
    facts: []
    text: |
      Тут два пути:

      - **Оставить несбалансированную панель.** Модели с фиксированными эффектами нормально работают с несбалансированными данными. Минус: Крым и Севастополь входят в выборку только с 2014–2015 года и в первые годы у них очень специфическая бюджетная ситуация (переходный период, огромная доля трансфертов). Они могут заметно повлиять на оценку при малом числе наблюдений.
      - **Исключить их.** Панель становится сбалансированной, вопрос сопоставимости снимается. В тексте достаточно одной фразы с причиной: данные доступны только с 2014 года и бюджетная система в переходный период несопоставима с остальными регионами.

      Для магистерской второй вариант проще и легче защищается. Можно в проверках устойчивости показать, что их добавление не меняет выводов, — но это необязательно.
  - role: user
    facts: [E03b]
    text: |
      Исключаем Крым и Севастополь, раз данных до 2014 года нет. Получается 83 региона, панель сбалансированная. Проверила: count по году везде 83. Теперь посчитала налоговые усилия и трансферты на душу, а цифры дикие — налоговые доходы к ВРП где-то 0,002 %.
  - role: assistant
    facts: []
    text: |
      Порядок величины сломан ровно в тысячу (или миллион) раз — почти наверняка дело в единицах. Нормальные налоговые усилия — единицы процентов, порядка 5–15 % ВРП.

      Проверьте, в чём каждая величина в исходниках. Это обычно написано в шапке отчёта или в названии колонки:

      ```r
      treasury %>% summarise(across(c(tax_rev, transfers), median))
      emiss %>% summarise(grp = median(grp), pop = median(pop))
      ```

      Если медиана налоговых доходов региона ~ 50 000 000, а ВРП ~ 300 000 — значит, первое в тысячах рублей, второе в миллионах (50 млрд и 300 млрд рублей соответственно).
  - role: user
    facts: [E09]
    text: |
      Да, нашла: трансферты в отчётах Казначейства даны в тысячах рублей, и налоговые доходы тоже, а ВРП из ЕМИСС — в миллионах рублей. Перевожу всё в миллионы.
  - role: assistant
    facts: []
    text: |
      Да, так и надо — приведите к одной единице сразу при чтении, чтобы дальше не думать:

      ```r
      treasury <- treasury %>%
        mutate(across(c(tax_rev, transfers), ~ .x / 1000))   # тыс. руб. -> млн руб.

      panel <- treasury %>%
        inner_join(emiss, by = c("okato", "year")) %>%
        mutate(
          tax_effort   = 100 * tax_rev / grp,             # % ВРП
          transf_pc    = transfers * 1e6 / pop            # руб. на человека
        )

      summary(panel$tax_effort)
      ```

      И проверьте единицы в базе НИФИ отдельно — у неё может быть своя договорённость. Если 2013 и 2014 годы на графике по какому-нибудь региону стыкуются со скачком в тысячу раз — значит, где-то единицы разные.
  - role: user
    facts: []
    text: |
      В НИФИ тоже тысячи, перевела. Теперь медиана налоговых усилий 9,8 %, похоже на правду. Можно уже первую модель?
  - role: assistant
    facts: []
    text: |
      Да. Перед моделью полезно посмотреть на данные глазами — хотя бы распределение и пару регионов во времени, чтобы поймать артефакты склейки:

      ```r
      library(ggplot2)

      ggplot(panel, aes(x = year, y = tax_effort, group = okato)) +
        geom_line(alpha = 0.3) +
        labs(x = "Year", y = "Tax revenue, % of GRP")
      ```

      Если на стыке 2013/2014 у всех регионов ступенька — значит, НИФИ и Казначейство считают показатель по-разному. Если ступенька только у пары регионов — смотрите их отдельно.

      Какую спецификацию берём как стартовую?
  - role: user
    facts: [E12, E13]
    text: |
      Ступеньки нет, хорошо. Базовая спецификация — модель с фиксированными эффектами региона и года, two-way FE, как мы обсуждали. Объясняющая переменная — все трансферты из федерального бюджета на душу населения. Контроли пока не добавляю.
  - role: assistant
    facts: []
    text: |
      Для этого подойдёт `plm`:

      ```r
      library(plm)

      pdata <- pdata.frame(panel, index = c("okato", "year"))

      m_fe <- plm(tax_effort ~ transf_pc,
                  data = pdata, model = "within", effect = "twoways")

      library(lmtest)
      coeftest(m_fe, vcov = vcovHC(m_fe, type = "HC1", cluster = "group"))
      ```

      Несколько замечаний:
      - `effect = "twoways"` даёт эффекты и региона, и года. Эффекты года поглощают всё общее для страны: изменения Налогового кодекса, кризисы, общие колебания цен на нефть.
      - Ошибки сразу считаем кластеризованными по региону (`cluster = "group"`): наблюдения одного региона во времени коррелированы, обычные ошибки будут занижены.
      - Масштаб коэффициента: трансферты в рублях на человека, налоговые усилия — в процентах. Коэффициент будет очень маленьким по абсолюту — это нормально; для интерпретации удобно пересчитать на 1000 рублей.

      Пока это только стартовая точка: без контролей и с текущими трансфертами модель почти наверняка ловит обратную связь (регионы с падающими доходами получают больше трансфертов в том же году).
  - role: user
    facts: []
    text: |
      Коэффициент −0,00007, значимый. Ок, в четверг встреча с научруком, покажу ему.
