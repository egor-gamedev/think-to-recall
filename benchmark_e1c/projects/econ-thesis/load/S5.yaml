segment: S5
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: []
    text: |
      GMM на 2011–2019 досчитался, вот кусок summary:

      ```
      Sargan test: chisq(119) = 71.42 (p-value = 1)
      Autocorrelation test (1): normal = -3.871 (p-value = 0.0001)
      Autocorrelation test (2): normal = -1.102 (p-value = 0.2705)
      Wald test for coefficients: chisq(6) = 412.3 (p-value = < 2.22e-16)
      ```

      Коэффициент при лаге налоговых усилий 0,71, при дотациях −0,0002, значим. Хансен прошёл, AR(2) нет — значит, всё хорошо?
  - role: assistant
    facts: []
    text: |
      AR(1) значим, AR(2) — нет: это как раз то, что нужно. А вот тест Хансена/Саргана с p-value = 1 — не «прошёл», а тревожный сигнал.

      Посмотрите на число степеней свободы: 119 — это число сверхидентифицирующих ограничений, то есть инструментов у вас порядка 125–130. А регионов — 83. Когда инструментов больше, чем групп, тест Хансена теряет мощность и почти всегда даёт p, близкий к единице, — он перестаёт что-либо проверять (Roodman, 2009, «A note on the theme of too many instruments»). Одновременно растёт смещение самой оценки в сторону FE/OLS: слишком много инструментов «переподгоняют» эндогенную переменную.

      Обычное лечение:
      ```r
      m_gmm_c <- pgmm(
        tax_effort ~ lag(tax_effort, 1) + eq_grants_pc_l1 +
          ln_grp_pc + mining_share + unemp + urban_share |
          lag(tax_effort, 2:3),
        data = pdata, effect = "twoways", model = "twosteps",
        transformation = "ld", collapse = TRUE
      )
      ```
      Ограничение лагов и `collapse = TRUE` сокращают число инструментов в разы. Если после этого результаты сильно поплывут — это аргумент, что исходная оценка держалась на переподгонке.
  - role: user
    facts: []
    text: |
      Сделала collapse и лаги 2:3. Инструментов стало 21, Хансен p = 0,04, коэффициент при дотациях стал −0,0001 и незначимый, при лаге налоговых усилий 0,93. Всё поплыло.
  - role: assistant
    facts: []
    text: |
      Это довольно типичная картина для коротких региональных панелей: при честном числе инструментов системный GMM становится неточным, а Хансен начинает отвергать валидность инструментов. Коэффициент при лаге около 0,93 говорит о том, что ряд почти персистентный — в такой ситуации инструменты-лаги в уровнях слабые.

      Что это значит для работы. У вас есть две спецификации, и ни одна не идеальна:
      - **GMM** учитывает инерцию, но его результаты неустойчивы к выбору инструментов и диагностика неблагоприятна;
      - **FE без лага зависимой** не страдает от этих проблем; инерция в налоговых усилиях частично поглощается фиксированными эффектами региона, а оставшаяся корреляция во времени учитывается кластеризацией ошибок по региону. Добавлять лаг зависимой в FE при T = 9 не стоит: будет смещение Никкелла порядка 1/T.

      Вполне защищаемая позиция: основная модель — FE, GMM — в приложении как проверка с честным описанием диагностики. Но это нужно согласовать с научруком, раз GMM был его предложением.
  - role: user
    facts: []
    text: |
      Показала ему обе версии с цифрами из теста. Он поворчал, но согласился, что 128 инструментов на 83 региона — перебор.
  - role: assistant
    facts: []
    text: |
      Хорошо, что вы пришли к нему с конкретными цифрами — так такие разговоры проходят намного проще. В тексте этот переход лучше описать прямо, а не прятать: «мы оценили также динамическую спецификацию системным GMM; при полном наборе инструментов их число (128) превышает число регионов (83), тест Хансена вырождается (p = 1,00); при ограничении инструментов оценки становятся неточными. Поэтому основной спецификацией выбрана…». Рецензенты обычно хорошо относятся к такой прозрачности.
  - role: user
    facts: [E12c]
    text: |
      Итак, решили окончательно: вернулись к two-way FE, но без лага налоговых усилий и с ошибками, кластеризованными по регионам. GMM — только в приложении: инструментов больше 120 при 83 регионах, тест Хансена p = 1,00. Теперь проверки устойчивости. Что обычно делают?
  - role: assistant
    facts: []
    text: |
      Для вашей модели я бы сделал такой набор (каждая проверка отвечает на конкретное возражение):

      1. **Без экстремальных регионов.** Москва и Санкт-Петербург по бюджетной структуре сильно отличаются от остальных: огромная налоговая база, почти нет дотаций. Если эффект держится без них — он не артефакт двух столиц.
      2. **Альтернативные ошибки** — Driscoll–Kraay (устойчивы к корреляции между регионами в один год, в том числе пространственной). В `fixest`: `vcov = "DK"` с `panel.id`.
      3. **Лаг дотаций на два года** вместо одного — проверка, что результат не зависит от выбора лага.
      4. **Расширенный период** с 2020–2022 — показать, как ковидные годы меняют картину.

      ```r
      m_main <- feols(tax_effort ~ eq_grants_pc_l1 + ln_grp_pc + mining_share + unemp + urban_share |
                        okato + year, data = est, cluster = ~okato)

      m_dk <- summary(m_main, vcov = "DK", panel.id = ~okato + year)
      ```
  - role: user
    facts: [E20]
    text: |
      Научрук утвердил главную: проверка устойчивости — выборка без Москвы и Санкт-Петербурга. Остальное — по желанию, если успею. Как отфильтровать по ОКАТО?
  - role: assistant
    facts: []
    text: |
      Коды субъектов по ОКАТО: Москва — 45, Санкт-Петербург — 40. Если у вас в справочнике полный код, сравнивайте по первым двум цифрам:

      ```r
      est_nocap <- est %>% filter(!substr(okato, 1, 2) %in% c("45", "40"))
      stopifnot(n_distinct(est_nocap$okato) == n_distinct(est$okato) - 2)

      m_nocap <- feols(tax_effort ~ eq_grants_pc_l1 + ln_grp_pc + mining_share + unemp + urban_share |
                         okato + year, data = est_nocap, cluster = ~okato)

      etable(m_main, m_nocap)
      ```

      Проверьте, что в справочнике код записан строкой с ведущим нулём, если он есть, — иначе `substr` даст не то.
  - role: user
    facts: []
    text: |
      Коэффициент почти не поменялся: −0,00041 против −0,00043, оба значимы. Ура. Теперь рисунки. Хочу график средних налоговых усилий по группам регионов и динамику дотаций.
  - role: assistant
    facts: []
    text: |
      Для группового графика удобно сначала агрегировать, потом рисовать:

      ```r
      by_group <- est %>%
        group_by(year, high_dep) %>%
        summarise(tax_effort = mean(tax_effort), .groups = "drop")

      ggplot(by_group, aes(x = year, y = tax_effort,
                           colour = factor(high_dep))) +
        geom_line(linewidth = 1) +
        scale_colour_manual(values = c("0" = "#1b9e77", "1" = "#d95f02"),
                            labels = c("Low dependence", "High dependence")) +
        labs(x = NULL, y = "Tax revenue, % of GRP", colour = NULL) +
        theme_minimal()
      ```
  - role: user
    facts: [E21]
    text: |
      Красиво, но не пойдёт: работу печатают в чёрно-белом виде, так требует учебный офис, поэтому графики не должны держаться на цвете. Зелёный и оранжевый на распечатке будут одним серым.
  - role: assistant
    facts: []
    text: |
      Тогда различаем группы типом линии и формой маркера, а цвет оставляем в оттенках серого — так график читается и на экране, и на распечатке:

      ```r
      ggplot(by_group, aes(x = year, y = tax_effort,
                           linetype = factor(high_dep), shape = factor(high_dep))) +
        geom_line(linewidth = 0.8, colour = "grey20") +
        geom_point(size = 2.2, colour = "grey20") +
        scale_linetype_manual(values = c("0" = "solid", "1" = "dashed"),
                              labels = c("Low dependence", "High dependence")) +
        scale_shape_manual(values = c("0" = 16, "1" = 1),
                           labels = c("Low dependence", "High dependence")) +
        scale_x_continuous(breaks = 2011:2019) +
        labs(x = NULL, y = "Tax revenue, % of GRP", linetype = NULL, shape = NULL) +
        theme_bw(base_size = 11) +
        theme(legend.position = "bottom")

      ggsave("output/figures/tax_effort_groups.pdf", width = 16, height = 9, units = "cm")
      ```

      PDF — векторный, при печати линии будут чёткими. Если для Word нужен растр — `png` с `dpi = 300`.
  - role: user
    facts: []
    text: |
      Вот теперь отлично, и на распечатке видно. Завтра займусь H2.
