segment: S3
author: Claude Opus 5.5 (2026-10-22), по скелету spec.yaml
turns:
  - role: user
    facts: [E14]
    text: |
      Перед встречей хочу привести деньги в порядок. Денежные показатели переводим в цены 2015 года региональным ИПЦ — так у нас на кафедре принято. ИПЦ скачала по регионам, декабрь к декабрю предыдущего года. Как правильно собрать из него дефлятор?
  - role: assistant
    facts: []
    text: |
      Из годовых темпов «декабрь к декабрю» нужно собрать цепной индекс и нормировать его на 2015 год внутри каждого региона:

      ```r
      cpi <- cpi_raw %>%                     # okato, year, cpi_dec (например, 105.3)
        arrange(okato, year) %>%
        group_by(okato) %>%
        mutate(
          chain    = cumprod(cpi_dec / 100),
          deflator = chain / chain[year == 2015]
        ) %>%
        ungroup()

      panel <- panel %>%
        left_join(select(cpi, okato, year, deflator), by = c("okato", "year")) %>%
        mutate(
          transf_pc_real = transf_pc / deflator,
          grp_pc_real    = grp * 1e6 / pop / deflator
        )
      ```

      Две тонкости:
      - «Декабрь к декабрю» описывает инфляцию *внутри* года, а налоги и трансферты — потоки за весь год. Строже было бы брать «год к году» (среднегодовой индекс). Если на кафедре принято декабрьский — оставьте, но одной фразой отметьте в тексте.
      - Саму долю налогов в ВРП дефлировать не нужно: это отношение двух номинальных величин одного года, дефлятор сокращается.
  - role: user
    facts: []
    text: |
      Взяла «год к году», раз строже. Теперь контроли. Какие обычно ставят?
  - role: assistant
    facts: []
    text: |
      Логика выбора: контроль нужен, если он влияет и на налоговые усилия, и на трансферты. Типичный набор для российских регионов:

      - **Уровень развития** — логарифм реального ВРП на душу. Богатые регионы получают меньше дотаций и собирают больше налогов.
      - **Структура экономики** — доля добычи полезных ископаемых в ВРП. Сильно влияет на налоговую базу региона: значимая часть налогов с добычи уходит в федеральный бюджет.
      - **Рынок труда** — уровень безработицы: и налоговая база (НДФЛ), и социальные трансферты.
      - **Урбанизация** — доля городского населения: концентрация бизнеса и простота администрирования.
      - Иногда добавляют долю пенсионеров или демографическую нагрузку, но с урбанизацией и ВРП на душу они сильно коррелированы.

      Чем меньше контролей, тем проще защищать, что ни один из них не является «плохим контролем», то есть сам не определяется трансфертами.
  - role: user
    facts: [E15]
    text: |
      Беру так: контрольные переменные — логарифм ВРП на душу, доля добычи полезных ископаемых в ВРП, уровень безработицы и доля городского населения. Всё из ЕМИСС, уже склеила по ОКАТО.
  - role: assistant
    facts: []
    text: |
      Хороший компактный набор. Добавьте в панель и проверьте пропуски — безработица по некоторым республикам Северного Кавказа в отдельные годы может отсутствовать:

      ```r
      panel %>%
        summarise(across(c(ln_grp_pc, mining_share, unemp, urban_share),
                         ~ sum(is.na(.x))))
      ```

      Если пропусков единицы — можно интерполировать внутри региона и оговорить это в сноске. Если десятки — лучше разбираться с источником.
  - role: user
    facts: []
    text: |
      Пропусков ноль, повезло. Сходила к научруку. Он посмотрел и сказал две вещи. Первое: «все трансферты» — это каша, там и целевые субсидии на дороги, и субвенции на полномочия, они к стимулам собирать налоги отношения не имеют.
  - role: assistant
    facts: []
    text: |
      Это сильное замечание, и в литературе оно стандартное. Стимул ослаблять сбор налогов создают только трансферты, которые *зависят от собственных доходов* региона. В российской системе это прежде всего дотации на выравнивание бюджетной обеспеченности: их размер рассчитывается по формуле от налогового потенциала. Субвенции и большинство субсидий привязаны к полномочиям и проектам, а не к доходам.

      Плюс к этому, если брать трансферты того же года, в регрессию попадает обратная связь: в год, когда доходы региона упали, ему могут выделить дополнительные средства. Обычный приём — брать трансферт с лагом: решения о дотациях на год принимаются заранее, по данным прошлых лет.
  - role: user
    facts: [E13b]
    text: |
      Вот, он так и сказал. Значит, вместо всех трансфертов берём только дотации на выравнивание бюджетной обеспеченности на душу, с лагом в один год. В отчётах Казначейства эта строка есть отдельно, в НИФИ тоже.
  - role: assistant
    facts: []
    text: |
      Лаг внутри региона в длинной панели делается так — важно сортировать по году и группировать по региону, иначе `lag()` возьмёт значение соседнего региона:

      ```r
      panel <- panel %>%
        arrange(okato, year) %>%
        group_by(okato) %>%
        mutate(eq_grants_pc_l1 = dplyr::lag(eq_grants_pc_real, 1)) %>%
        ungroup()
      ```

      Обратите внимание: `eq_grants_pc_real` — реальные дотации на душу, в рублях 2015 года. Первый год панели после этого будет с `NA` в лаге — для него нет предыдущего значения.
  - role: user
    facts: [E12b]
    text: |
      Второе от научрука: налоговые усилия очень инерционны, и надо это учесть. Перешли на системный GMM, Blundell–Bond, через pgmm, с лагом налоговых усилий. Это по совету научрука, он сам по GMM защищался. Поможешь с синтаксисом? Документация plm меня пугает.
  - role: assistant
    facts: []
    text: |
      Синтаксис у `pgmm` действительно непривычный: после `|` пишутся инструменты.

      ```r
      library(plm)

      pdata <- pdata.frame(panel, index = c("okato", "year"))

      m_gmm <- pgmm(
        tax_effort ~ lag(tax_effort, 1) + eq_grants_pc_l1 +
          ln_grp_pc + mining_share + unemp + urban_share |
          lag(tax_effort, 2:99),
        data = pdata,
        effect = "twoways",
        model = "twosteps",
        transformation = "ld"            # "ld" = системный GMM (Blundell–Bond)
      )

      summary(m_gmm, robust = TRUE)      # ошибки с поправкой Windmeijer
      ```

      Что смотреть в выводе:
      - **AR(1)** должен быть значим, **AR(2)** — нет: иначе лаги 2+ не годятся как инструменты.
      - **Тест Саргана/Хансена** — проверка валидности инструментов. Слишком *высокий* p-value (близкий к 1) — тоже тревожный знак, а не повод радоваться.
      - **Число инструментов.** `lag(..., 2:99)` использует все доступные лаги — их число растёт квадратично с числом лет. Это стоит контролировать.

      Предупреждаю: на 83 регионах и десятке лет pgmm может считаться заметно дольше, чем FE.
  - role: user
    facts: []
    text: |
      Запустила. Пока считается, ещё вопрос. Мне на семинаре Олег (он аспирант на кафедре) посоветовал добавить контролем индекс налогового потенциала из методики Минфина — мол, он ровно про налоговую базу.
  - role: assistant
    facts: []
    text: |
      Тут есть проблема. Индекс налогового потенциала в методике распределения дотаций рассчитывается во многом на основе фактических налоговых поступлений региона за прошлые годы. То есть он сам — функция налоговых усилий (той же зависимой переменной), только со сдвигом. Это «плохой контроль»: вы частично ставите зависимую в правую часть, и коэффициент при дотациях становится трудно интерпретировать.

      К тому же он входит в формулу самих дотаций — тогда вы контролируете то, через что трансферт и действует.

      Налоговую базу у вас уже ловят ВРП на душу и доля добычи — это экзогенные к налоговому администрированию показатели.
  - role: user
    facts: [E15r]
    text: |
      Убедил. Индекс налогового потенциала Минфина как контроль отклонили: он считается по фактическим поступлениям и эндогенен. Олегу так и скажу. А ещё он сказал кластеризовать ошибки по федеральным округам — «так консервативнее».
  - role: assistant
    facts: []
    text: |
      Консервативнее — да, но только когда кластеров достаточно много. Федеральных округов 8. Кластерно-робастные оценки ковариации асимптотически обоснованы при числе кластеров, стремящемся к бесконечности; при 8 кластерах они сильно смещены, и тесты отвергают нулевую гипотезу то слишком часто, то слишком редко — ошибки становятся просто ненадёжными. Обычное практическое правило — хотя бы 40–50 кластеров.

      Если хочется показать, что вывод не зависит от корреляции внутри округов, есть дикий кластерный бутстрэп, но и он при 8 кластерах работает плохо. Кластер по региону (83) — естественный уровень: внутри региона наблюдения коррелированы во времени, а это главный источник зависимости в вашей панели.
  - role: user
    facts: [E12r]
    text: |
      Ок, кластеризацию по федеральным округам отклонили: всего 8 кластеров. Кластеры оставили по регионам. И последнее на сегодня — H2. Научрук хочет гипотезу про неоднородность.
  - role: assistant
    facts: []
    text: |
      Естественная H2 для вашей темы — эффект сильнее у регионов, которые сильнее зависят от дотаций: для них неявный налог на собственные доходы ощутимее. Проверяется взаимодействием дотаций с индикатором группы:

      ```r
      panel <- panel %>% mutate(high_dep = as.integer(grants_share > THRESHOLD))
      # tax_effort ~ eq_grants_pc_l1 * high_dep + контроли
      ```

      Индикатор лучше задать по среднему за период или по первому году, а не по каждому году отдельно: иначе регион переходит из группы в группу, и сама группа становится зависимой от трансфертов. Какой порог возьмёте?
  - role: user
    facts: [E16]
    text: |
      Научрук сказал так: гипотеза H2 — эффект сильнее у высокодотационных регионов, где доля дотаций в доходах больше 40 %. Проверяем взаимодействием, группу по среднему за период. GMM, кстати, всё ещё считается.
